<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EcoHub Supplier Login</title>
<style>
:root{--bg:#f5f1e8;--ink:#173b2b;--muted:#6d786f;--line:#ddd6c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(440px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 50px #173b2b14}.logo{font:800 24px Georgia,serif}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin-top:9px}.btn{margin-top:14px;border:1px solid var(--line);border-radius:9px;background:var(--ink);color:#fff;padding:10px 13px;font-weight:800;cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="card"><div class="logo">EcoHub Supplier Portal</div><div id="msg" class="sub">Opening a clean supplier login. Your Control Center session will stay signed in.</div><button id="retry" class="btn" hidden>Open Supplier Login</button></div>
<script>
(function(){
  const msg=document.getElementById('msg'),retry=document.getElementById('retry');
  function clearSupplierOnly(){try{localStorage.removeItem('ecohub-supplier-auth-v1');sessionStorage.removeItem('ecohub-supplier-auth-v1');}catch(_){}}
  function go(){clearSupplierOnly();location.replace('supplier-portal-isolated.html?fresh=1&v=20260827-fix2');}
  retry.onclick=go;
  try{go()}catch(e){msg.textContent='Could not open supplier login automatically. Tap below.';retry.hidden=false;}
})();
</script>
</body>
</html>
