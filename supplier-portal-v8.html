<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EcoHub Supplier Portal</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f1e8;color:#173b2b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#stage{height:100%;display:grid;place-items:center}.card{width:min(440px,calc(100% - 28px));background:#fff;border:1px solid #ddd6c8;border-radius:18px;padding:24px;box-shadow:0 14px 50px #173b2b14}.logo{font:800 24px Georgia,serif}.sub{color:#6d786f;font-size:12px;line-height:1.5;margin-top:10px}.btn{margin-top:14px;border:1px solid #ddd6c8;border-radius:9px;background:#fff;color:#173b2b;padding:9px 12px;font-weight:800;cursor:pointer}iframe{border:0;width:100%;height:100%;display:block;background:#f5f1e8}
</style>
</head>
<body>
<div id="stage"><div class="card"><div class="logo">EcoHub Supplier Portal</div><div id="msg" class="sub">Preparing stable supplier portal…</div><button id="retry" class="btn" hidden>Reload</button></div></div>
<script>
(async function(){
 const stage=document.getElementById('stage'),msg=document.getElementById('msg'),retry=document.getElementById('retry');
 retry.onclick=()=>location.reload();
 try{
   const r=await fetch('supplier-portal-v7.html?source=20260830-supplier-split-v1',{cache:'no-store'});
   if(!r.ok) throw new Error('Portal layout could not be loaded ('+r.status+').');
   let html=await r.text();
   const oldTag='<script src="assets/supplier-portal-v5.js?v=20260830-supplier-split-v1"></'+'script>';
   const newTag='<script src="assets/supplier-portal-runtime-v8.js?v=20260830-supplier-split-v1"></'+'script>';
   if(!html.includes(oldTag)) throw new Error('Portal application entry point was not found.');
   html=html.replace(oldTag,newTag);
   const frame=document.createElement('iframe');
   frame.title='EcoHub Supplier Portal';
   frame.setAttribute('allow','clipboard-read; clipboard-write');
   frame.srcdoc=html;
   stage.innerHTML='';stage.style.display='block';stage.appendChild(frame);
 }catch(e){console.error(e);msg.textContent='Unable to open supplier portal: '+(e.message||e);retry.hidden=false;}
})();
</script>
</body>
</html>
