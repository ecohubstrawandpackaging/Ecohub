<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EcoHub Supplier Sign In</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script><style>:root{--bg:#f5f1e8;--ink:#173b2b;--muted:#6d786f;--line:#ddd6c8;--red:#a23b34}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(430px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 50px #173b2b14}.logo{font:800 24px Georgia,serif}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin:8px 0 16px}input,.btn{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-top:8px}.btn{background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:10px;color:var(--red);font-size:12px}</style></head><body><div class="card"><div class="logo">EcoHub Supplier Portal</div><div class="sub">Supplier sign in only. Accounts are created by EcoHub Admin.</div><input id="email" type="email" placeholder="Supplier email"><input id="pass" type="password" placeholder="Password"><button id="login" class="btn">Sign in</button><div id="msg" class="msg"></div></div><script>const sb=supabase.createClient('https://fyvogvjvivxpqztbaoct.supabase.co','sb_publishable_gnvNDN1co5qB7tBBevXziQ_pbAoBc87');const $=s=>document.querySelector(s);async function goIfSession(){const{data:{session}}=await sb.auth.getSession();if(session)location.replace('supplier-portal-v5.html?v=20260827-admin-created')}$('#login').onclick=async()=>{const b=$('#login');b.disabled=true;$('#msg').textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(error){$('#msg').textContent=error.message;b.disabled=false;return}location.replace('supplier-portal-v5.html?v=20260827-admin-created')};goIfSession();</script></body></html>
