<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EcoHub Supplier Portal</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f5f1e8;color:#173b2b}body{display:grid;place-items:center}.box{padding:24px;text-align:center}.spin{width:30px;height:30px;border:3px solid #d9d4c8;border-top-color:#173b2b;border-radius:50%;margin:0 auto 12px;animation:s .9s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#6d786f}</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><b>Opening Supplier Portal…</b><br><small>Secure supplier session.</small></div>
<script>
(async()=>{
  const box=document.getElementById('box');
  try{
    const r=await fetch('supplier-portal-v5.html?v=20260827-rpcfix3',{cache:'no-store'});
    if(!r.ok) throw new Error('Supplier Portal file could not be loaded.');
    let html=await r.text();
    const marker='<script src="assets/supplier-portal-v5.js?v=20260826-1241"></scr'+'ipt>';
    const shim='<script>(function(){if(!window.supabase||window.__ecohubSupplierAuthIsolated)return;window.__ecohubSupplierAuthIsolated=true;const base=window.supabase.createClient.bind(window.supabase);window.supabase.createClient=function(url,key,opts){opts=opts||{};opts.auth=Object.assign({},opts.auth||{},{storageKey:"ecohub-supplier-auth-v1",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false});return base(url,key,opts);};const hideSignup=function(){const t=document.getElementById("tabSignup"),p=document.getElementById("signupPane"),tabs=document.querySelector("#auth .tabs");if(t)t.remove();if(p)p.remove();if(tabs){tabs.style.display="block";const l=document.getElementById("tabLogin");if(l){l.style.width="100%";l.classList.add("dark");}}const authSub=document.querySelector("#auth .sub");if(authSub)authSub.textContent="Supplier sign in only. Accounts are created by EcoHub Admin.";};hideSignup();})();</scr'+'ipt>';
    if(!html.includes(marker)) throw new Error('Supplier Portal entry point was not found.');
    html=html.replace(marker,shim+marker);
    document.open();document.write(html);document.close();
  }catch(e){console.error(e);box.innerHTML='<b>Supplier Portal could not open.</b><br><small>'+String(e.message||e)+'</small><br><button onclick="location.reload()" style="margin-top:12px;padding:9px 12px;border-radius:8px;border:1px solid #ccc;background:white">Reload</button>';}
})();
</script>
</body>
</html>
