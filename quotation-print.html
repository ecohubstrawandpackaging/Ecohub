<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EcoHub Quotation</title><style>:root{--ink:#1f3d2b;--gold:#9c7a54;--line:#dcd3c2;--bg:#eef2ec;--red:#a23b2a}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid var(--line)}button{appearance:none;-webkit-appearance:none;border:1px solid var(--ink);border-radius:10px;padding:11px 15px;font-size:16px;font-weight:700;background:#fff;color:var(--ink);min-height:44px}button.primary{background:var(--ink);color:#fff}.hint{width:100%;text-align:center;font-size:11px;color:#617064}.page{width:min(100%,210mm);margin:14px auto 30px;background:#fff;padding:18mm 14mm;box-shadow:0 5px 25px rgba(31,61,43,.09)}.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:18px;gap:18px}.logo{font-family:Georgia,serif;font-weight:800;font-size:24px}.logo small{display:block;font-family:-apple-system,sans-serif;font-size:9px;letter-spacing:.1em;color:var(--gold)}.title{text-align:right}.title h1{margin:0;font-size:20px;letter-spacing:.06em}.title div{font-family:monospace;font-size:12px;margin-top:4px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:18px;font-size:12px}.meta b{display:block;font-size:9.5px;text-transform:uppercase;color:var(--gold);margin-bottom:2px}.items{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:14px}.items th{background:var(--ink);color:#fff;text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase}.items td{padding:6px 8px;border-bottom:1px solid var(--line)}.num{text-align:right}.totals{display:flex;justify-content:flex-end}.totals table{width:270px;font-size:12px;border-collapse:collapse}.totals td{padding:4px 2px}.totals .grand td{border-top:2px solid var(--ink);font-weight:800;font-size:14px;padding-top:8px}.notes{margin-top:20px;font-size:11px;white-space:pre-wrap}.sign{display:flex;justify-content:space-between;margin-top:50px;font-size:11px}.sign div{width:40%;border-top:1px solid var(--ink);padding-top:4px}.error{max-width:700px;margin:20px auto;background:#fff;padding:16px;border:1px solid #e8c9c2;color:var(--red);border-radius:10px}@media(max-width:700px){.page{width:100%;margin:0;padding:16px 12px;box-shadow:none}.meta{grid-template-columns:1fr}.title h1{font-size:18px}.items{font-size:10.5px}.items th,.items td{padding:6px 5px}.totals table{width:230px}}@page{size:A4;margin:12mm}@media print{body{background:#fff}.toolbar{display:none!important}.page{width:100%;margin:0;padding:0;box-shadow:none}thead{display:table-header-group}tr{break-inside:avoid;page-break-inside:avoid}}</style></head><body><div class="toolbar"><button class="primary" id="print">🖨 Print / Save PDF</button><button id="back">← Back to EcoHub</button><div class="hint">iPhone / iPad: tap <b>Print / Save PDF</b>. In the print preview, use Share to save the PDF to Files.</div></div><main id="page" class="page"></main><script>(function(){'use strict';const STORE='ecohub:quotation-print:v1',page=document.getElementById('page');const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Number(n)||0,peso=n=>'₱'+num(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),line=it=>num(it.qty)*num(it.price)-num(it.discount);let q=null;try{q=JSON.parse(sessionStorage.getItem(STORE)||'null')}catch(e){}if(!q){page.className='error';page.innerHTML='<b>No quotation is loaded.</b><br><br>Go back to EcoHub, open a quotation, then tap <b>Print / PDF</b> again.';}else{const items=Array.isArray(q.items)?q.items:[];const subtotal=items.reduce((s,it)=>s+num(it.qty)*num(it.price),0),discount=items.reduce((s,it)=>s+num(it.discount),0),net=subtotal-discount,rate=num(q.vatRate)||12,vat=q.vatEnabled?net*(rate/100):0,grand=net+vat;document.title=(q.number||'EcoHub Quotation')+' - EcoHub';page.innerHTML=`<div class="head"><div class="logo">EcoHub<small>STRAW &amp; PACKAGING</small></div><div class="title"><h1>QUOTATION</h1><div>${esc(q.number||'—')}</div></div></div><div class="meta"><div><b>Client / Company</b>${esc(q.company||q.customer||'—')}</div><div><b>Date</b>${esc(q.date||'—')}</div><div><b>Contact Person</b>${esc(q.contact||'—')}</div><div><b>Valid Until</b>${esc(q.valid||'—')}</div><div><b>Address</b>${esc(q.address||'—')}</div><div><b>Terms</b>${esc(q.terms||'—')}</div></div><table class="items"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th class="num">Unit Price</th><th class="num">Discount</th><th class="num">Amount</th></tr></thead><tbody>${items.length?items.map(it=>`<tr><td>${esc(it.description||it.name||'—')}</td><td>${esc(it.qty)}</td><td>${esc(it.unit||'')}</td><td class="num">${peso(it.price)}</td><td class="num">${peso(it.discount)}</td><td class="num">${peso(line(it))}</td></tr>`).join(''):'<tr><td colspan="6">No items.</td></tr>'}</tbody></table><div class="totals"><table><tr><td>Subtotal</td><td class="num">${peso(subtotal)}</td></tr><tr><td>Discount Total</td><td class="num">-${peso(discount)}</td></tr>${q.vatEnabled?`<tr><td>VAT (${rate}%)</td><td class="num">${peso(vat)}</td></tr>`:''}<tr class="grand"><td>Grand Total</td><td class="num">${peso(grand)}</td></tr></table></div>${q.notes?`<div class="notes"><b>Notes:</b> ${esc(q.notes)}</div>`:''}<div class="sign"><div>Prepared by</div><div>Approved by</div></div>`;}document.getElementById('print').addEventListener('click',()=>{try{window.focus();window.print()}catch(e){alert('Print could not open. Please open this page in Safari and tap Print / Save PDF again.')}});document.getElementById('back').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='./'});})();</script></body></html>
