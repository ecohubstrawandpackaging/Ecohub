      c.preferredTerms=E.qs('#cl-terms',container).value.trim(); c.salesperson=E.qs('#cl-salesperson',container).value;
      c.status=E.qs('#cl-status',container).value; c.tags=E.qs('#cl-tags',container).value.trim(); c.notes=E.qs('#cl-notes',container).value.trim();
      if(!c.companyName && !c.contactPerson){toast('Add a company or contact person name');return;}
      const dupe=state.clients.find(x=>x.id!==c.id && [x.companyName,x.contactPerson].map(E.normalizeClientName).filter(Boolean).some(k=>[c.companyName,c.contactPerson].map(E.normalizeClientName).filter(Boolean).includes(k)));
      if(dupe && !confirm(`A similar client already exists: ${E.clientDisplayName(dupe)}. Save this as a separate client anyway?`)) return;
      await saveClient(c); editingId=c.id; toast('Client profile saved'); renderClientForm(container,c,false);
    });
    const del=E.qs('#cl-delete',container); if(del) del.addEventListener('click',async()=>{
      if(!confirm(`Delete ${E.clientDisplayName(c)} from the Client Database? Existing quotations will NOT be deleted.`)) return;
      await E.storageDelete('client:'+c.id); state.clients=state.clients.filter(x=>x.id!==c.id);
      for(const q of state.quotations.filter(q=>q.clientId===c.id)){ q.clientId=''; await E.storageSet('quotation:'+q.number,q); }
      editingId=''; toast('Client removed; quotation history kept'); renderClients(container);
    });
    E.qsa('[data-client-q]',container).forEach(btn=>btn.addEventListener('click',()=>{E.navigate('quotations');E.openQuotationEditor(document.getElementById('main-content'),btn.dataset.clientQ);}));
  }

  function renderClientOrders(c){
    const rows=relatedQuotations(c).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    return `<div class="card"><h3>Order / Quotation History</h3><div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Quotation</th><th>Status</th><th>Order Status</th><th class="num">Total</th><th></th></tr></thead><tbody>
      ${rows.length?rows.map(q=>`<tr><td>${escapeHtml(q.date||'—')}</td><td><b>${escapeHtml(q.number)}</b></td><td>${escapeHtml(q.quotationStatus||'')}</td><td>${escapeHtml(q.orderStatus||'')}</td><td class="num">${peso(E.quotationTotals(q).grand)}</td><td><button class="btn small" data-client-q="${escapeHtml(q.number)}">Open</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty-state">No quotation history for this client yet.</div></td></tr>`}
    </tbody></table></div></div>`;
  }

  function renderClients(container){
    if(editingId){
      const existing=state.clients.find(c=>c.id===editingId);
      if(existing){renderClientForm(container,existing,false);return;}
      if(editingId==='__new__'){renderClientForm(container,blankClient(),true);return;}
      editingId='';
    }
    const all=(state.clients||[]).map(c=>({c,stats:computeClientStats(c)}));
    const totalSales=all.reduce((s,x)=>s+x.stats.totalSales,0);
    const withOrders=all.filter(x=>x.stats.orders>0).length;
    const repeat=all.filter(x=>x.stats.completedOrders>=2).length;
    const rows=filteredClients();
    container.innerHTML=`
      <div class="topbar"><div class="titleblock"><p class="eyebrow">Sales CRM</p><h2>Client Database</h2></div><div class="actions"><button class="btn" id="cl-import-existing">Scan Existing Quotations</button><button class="btn primary" id="cl-add">+ Add Client</button></div></div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">Save reusable client details once, select them in future quotations, and rank clients using completed order history.</p>
      <div class="kpi-grid">
        <div class="kpi"><div class="lbl">Total Clients</div><div class="val">${all.length}</div></div>
        <div class="kpi"><div class="lbl">Clients With Orders</div><div class="val">${withOrders}</div></div>
        <div class="kpi"><div class="lbl">Repeat Clients</div><div class="val">${repeat}</div></div>
        <div class="kpi"><div class="lbl">Completed Client Sales</div><div class="val">${peso(totalSales)}</div></div>
      </div>
      <div class="card">
        <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px;">
          <div class="field" style="flex:1;min-width:220px;"><label>Search Client</label><input id="cl-search" value="${escapeHtml(searchText)}" placeholder="Company, contact, tag, address..."></div>
          <div class="field" style="width:180px;"><label>Client Tier</label><select id="cl-tier">${['All','Top Client','Repeat Client','Active Client','Prospect','No Orders'].map(t=>`<option ${t===tierFilter?'selected':''}>${t}</option>`).join('')}</select></div>
        </div>
        <div class="table-wrap"><table class="data"><thead><tr><th>Client</th><th>Contact</th><th class="num">Orders</th><th class="num">Completed Sales</th><th>Last Order</th><th>Tier</th><th>Status</th><th></th></tr></thead><tbody>
          ${rows.length?rows.map(({c,stats})=>`<tr><td><b>${escapeHtml(E.clientDisplayName(c))}</b>${c.companyName&&c.contactPerson?`<div style="font-size:10.5px;color:var(--ink-soft);">${escapeHtml(c.contactPerson)}</div>`:''}</td><td>${escapeHtml(c.contactDetails||'—')}</td><td class="num">${stats.orders}</td><td class="num">${peso(stats.totalSales)}</td><td>${escapeHtml(stats.lastOrder||'—')}</td><td><span class="pill ${tierClass(stats.tier)}">${escapeHtml(stats.tier)}</span></td><td><span class="pill ${c.status==='Active'?'green':'gray'}">${escapeHtml(c.status)}</span></td><td><button class="btn small" data-edit-client="${escapeHtml(c.id)}">Open</button></td></tr>`).join(''):`<tr><td colspan="8"><div class="empty-state">No clients match this filter.</div></td></tr>`}
        </tbody></table></div>
      </div>
      <div class="card"><h3>How Client Strength Is Ranked</h3><div style="font-size:12.5px;color:var(--ink-soft);line-height:1.7;"><b>Top Client:</b> 5+ completed orders or ₱50,000+ completed sales. &nbsp; <b>Repeat Client:</b> 2–4 completed orders. &nbsp; <b>Active Client:</b> 1 completed order. &nbsp; <b>Prospect:</b> quotation/order exists but none completed yet.</div></div>
    `;
    E.qs('#cl-add',container).addEventListener('click',()=>{editingId='__new__';renderClients(container);});
    E.qs('#cl-import-existing',container).addEventListener('click',async()=>{const n=await E.seedClientsFromQuotations(true);toast(n?`${n} client(s) added from quotation history`:'No new clients found in quotations');renderClients(container);});
    E.qs('#cl-search',container).addEventListener('input',e=>{searchText=e.target.value;const pos=e.target.selectionStart||searchText.length;renderClients(container);const inp=E.qs('#cl-search',container);if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(_){}}});
    E.qs('#cl-tier',container).addEventListener('change',e=>{tierFilter=e.target.value;renderClients(container);});
    E.qsa('[data-edit-client]',container).forEach(btn=>btn.addEventListener('click',()=>{editingId=btn.dataset.editClient;renderClients(container);}));
  }

  E.computeClientStats=computeClientStats;
  E.upsertClientFromQuotation=upsertClientFromQuotation;
  E.renderClients=renderClients;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;

  const RENDERERS = {
    dashboard: c=>E.renderDashboard(c),
    quotations: c=>E.renderQuotations(c),
    clients: c=>E.renderClients(c),
    sales: c=>E.renderSales(c),
    pending: c=>E.renderPending(c),
    products: c=>E.renderProducts(c),
    inventory: c=>E.renderInventory(c),
    expenses: c=>E.renderExpenses(c),
    payables: c=>E.renderPayables(c),
    cupstock: c=>E.renderCupStock(c),
    directpurchase: c=>E.renderDirectPurchases(c),
    finance: c=>E.renderFinance(c),
    settings: c=>E.renderSettings(c),
  };

  let currentView = 'dashboard';

  function navigate(view){
    if(!RENDERERS[view]) return;
    if(currentView==='quotations' && view!=='quotations' && E.canLeaveQuotationEditor && !E.canLeaveQuotationEditor()) return;
    E.resetQuotationsListMode();
    if(view!=='cupstock') E._cupPanel = null;
    if(view!=='directpurchase') E._dpPanel = null;
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
    const container = document.getElementById('main-content');
    RENDERERS[view](container);
  }
  E.navigate = navigate;

  function wireNav(){
    document.querySelectorAll('.nav-item').forEach(btn=>{
      btn.addEventListener('click', ()=> navigate(btn.dataset.view));
    });
  }

  function renderStorageStatus(){
    const banner = document.getElementById('storage-banner');
    const status = document.getElementById('storage-status');
    const available = E.storageApiPresent();
    const usingSupabase = E.SUPABASE_CONFIGURED;
    const backend = E.storageBackendName ? E.storageBackendName() : (usingSupabase ? 'Supabase' : 'Storage');
    if(available){
      banner.style.display = 'none';
      status.textContent = '● Connected to ' + backend;
      status.style.color = 'var(--sage)';
    } else if(usingSupabase){
      status.textContent = '● Supabase connection issue';
      status.style.color = '#E8B4A6';
      banner.style.display = 'block';
      banner.innerHTML = `
        <div style="background:#F7E7E4;border-bottom:2px solid #B3564A;color:#7A2E24;padding:10px 20px;font-size:12.5px;">
          <b>Couldn't reach Supabase.</b> Check your internet connection, or that the Project URL/anon key and RLS policies are set up correctly.
        </div>`;
    } else {
      status.textContent = '● No persistent storage';
      status.style.color = '#E8B4A6';
      banner.style.display = 'block';
      banner.innerHTML = `
        <div style="background:#F7E7E4;border-bottom:2px solid #B3564A;color:#7A2E24;padding:10px 20px;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span style="font-size:16px;">⚠️</span>
          <span style="flex:1;min-width:220px;"><b>This page has no persistent storage</b> — changes will be lost when you close or reload it. This usually happens when the file is opened directly instead of through Claude's chat link. Use <b>Export Backup</b> in the sidebar before you close this tab, and <b>Import Backup</b> next time you open it.</span>
          <button id="banner-export-btn" class="btn small" style="background:#fff;">Export Backup Now</button>
        </div>`;
      const btn = document.getElementById('banner-export-btn');
      if(btn) btn.addEventListener('click', exportBackup);
    }
  }

  /* ---------------- Export / Import full backup ---------------- */
  function exportBackup(){
    const payload = {
      exportedAt: new Date().toISOString(),
      version: 4,
      settings: E.state.settings,
      products: E.state.products,
      inventory: E.state.inventory,
      quotations: E.state.quotations,
      clients: E.state.clients,
      expenses: E.state.expenses,
      payables: E.state.payables,
      supplierPayments: E.state.supplierPayments,
      cupStock: E.state.cupStock,
      directPurchases: E.state.directPurchases,
      supplierProfiles: E.state.supplierProfiles,
      cashLedger: E.state.cashLedger
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url; a.download = `ecohub-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    E.toast('Backup downloaded — save it into your Google Drive folder to keep it safe');
  }

  async function importBackupFile(file){
    let data;
    try{
      const text = await file.text();
      data = JSON.parse(text);
    }catch(e){
      E.toast('That file could not be read as a valid backup'); return;
    }
    if(!data || typeof data!=='object' || !Array.isArray(data.products)){
      E.toast('That file does not look like an EcoHub backup'); return;
    }
    const ok = confirm('Importing will REPLACE all current data in this app (products, clients, quotations, expenses, inventory, payables, settings) with the contents of this backup file. This cannot be undone. Continue?');
    if(!ok) return;

    await E.flushAllSaves();
    const available = E.storageApiPresent();

    E.state.settings = Object.assign({}, E.state.settings, data.settings||{});
    E.state.products = Array.isArray(data.products) ? data.products : [];
    E.state.inventory = data.inventory && typeof data.inventory==='object' ? data.inventory : {};
    E.state.quotations = Array.isArray(data.quotations) ? data.quotations : [];
    E.state.clients = Array.isArray(data.clients) ? data.clients.map(E.ensureClientShape) : [];
    if(!E.state.clients.length) await E.seedClientsFromQuotations(false);
    E.state.expenses = Array.isArray(data.expenses) ? data.expenses : [];
    E.state.payables = Array.isArray(data.payables) ? data.payables : [];
    E.state.supplierPayments = Array.isArray(data.supplierPayments) ? data.supplierPayments : [];
    E.state.cupStock = Array.isArray(data.cupStock) ? data.cupStock : [];
    E.state.directPurchases = Array.isArray(data.directPurchases) ? data.directPurchases : [];
    E.state.supplierProfiles = Array.isArray(data.supplierProfiles) ? data.supplierProfiles : [];
    E.state.cashLedger = Array.isArray(data.cashLedger) ? data.cashLedger : [];

    const repairSummary = await E.repairStateData(false);
    const financialSummary = E.applyVerifiedFinancialPosition ? await E.applyVerifiedFinancialPosition({persist:false}) : {applied:false};

    if(available){
      const existingKeys = await E.storageListKeys();
      for(const k of existingKeys){ if(k!=='settings:main') await E.storageDelete(k); }
      await E.storageSet('settings:main', E.state.settings);
      for(const p of E.state.products) await E.storageSet('product:'+p.code, p);
      for(const code of Object.keys(E.state.inventory)) await E.storageSet('inventory:'+code, E.state.inventory[code]);
      for(const q of E.state.quotations) await E.storageSet('quotation:'+q.number, q);
      for(const clt of E.state.clients) await E.storageSet('client:'+clt.id, clt);
      for(const ex of E.state.expenses) await E.storageSet('expense:'+ex.id, ex);
      for(const pay of E.state.payables) await E.storageSet('payable:'+pay.id, pay);
      for(const sp of E.state.supplierPayments) await E.storageSet('supplierPayment:'+sp.id, sp);
      for(const cs of E.state.cupStock) await E.storageSet('cupstock:'+cs.id, cs);
      for(const dp of E.state.directPurchases) await E.storageSet('directpurchase:'+dp.id, dp);
      for(const sp2 of E.state.supplierProfiles) await E.storageSet('supplierprofile:'+E.sanitizeKeyPart(sp2.name), sp2);
      for(const cl of E.state.cashLedger) await E.storageSet('cashledger:'+cl.id, cl);
      E.toast(`Backup imported and saved — verified financial position applied${financialSummary.archivedPayables?`, ${financialSummary.archivedPayables} old payable(s) settled`:''}`);
    } else {
      E.toast(`Backup imported into this session — verified financial position applied`);
    }
    navigate(currentView);
  }

  function wireBackupButtons(){
    document.getElementById('export-backup-btn').addEventListener('click', exportBackup);
    const fileInput = document.getElementById('import-backup-input');
    document.getElementById('import-backup-btn').addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', ()=>{
      if(fileInput.files && fileInput.files[0]) importBackupFile(fileInput.files[0]);
      fileInput.value = '';
    });
  }

  function showAuthGate(errorMsg){
    document.getElementById('app-shell').style.display = 'none';
    const gate = document.getElementById('auth-gate');
    gate.style.display = 'flex';
    const warn = document.getElementById('auth-cfgwarn');
    if(!E.SUPABASE_CONFIGURED){
      warn.innerHTML = `<div class="cfgwarn">Supabase isn't configured in this file yet — paste your Project URL and anon key into the SUPABASE_URL / SUPABASE_ANON_KEY constants near the top of the script.</div>`;
    } else {
      warn.innerHTML = '';
    }
    document.getElementById('auth-error').textContent = errorMsg || '';
  }

  function hideAuthGate(){
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('app-shell').style.display = '';
  }

  async function attemptSignIn(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if(!E.supabaseClient){ errEl.textContent = 'Supabase is not configured in this file yet.'; return; }
    if(!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }
    const { error } = await E.supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = error.message; return; }
    hideAuthGate();
    await startApp();
  }

  function wireAuthGate(){
    const btn = document.getElementById('auth-submit');
    btn.addEventListener('click', attemptSignIn);
    document.getElementById('auth-password').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptSignIn(); });
  }

  async function startApp(){
    const container = document.getElementById('main-content');
    container.innerHTML = `<div class="empty-state">Loading EcoHub…</div>`;
    await E.loadAll();
    if(E.applyVerifiedFinancialPosition) await E.applyVerifiedFinancialPosition({persist:true});
    wireNav();
    wireBackupButtons();
    renderStorageStatus();
    wireSignOutButton();
    navigate('dashboard');
  }

  function wireSignOutButton(){
    const el = document.getElementById('storage-status');
    if(!el || !E.supabaseClient || el.dataset.signoutWired) return;
    el.dataset.signoutWired = '1';
    const btn = document.createElement('button');
    btn.id = 'auth-signout-btn';
    btn.textContent = 'Sign out';
    btn.className = 'nav-item';
    btn.style.marginTop = '4px';
    btn.addEventListener('click', async ()=>{
      await E.supabaseClient.auth.signOut();
      showAuthGate();
    });
    el.parentElement.appendChild(btn);
  }

  async function boot(){
    wireAuthGate();
    if(E.supabaseClient){
      const { data: { session } } = await E.supabaseClient.auth.getSession();
      if(!session){ showAuthGate(); return; }
      E.supabaseClient.auth.onAuthStateChange((event)=>{
        if(event==='SIGNED_OUT') showAuthGate();
      });
      hideAuthGate();
      await startApp();
    } else if(E.SUPABASE_CONFIGURED){
      // URL/key present but client failed to init (e.g. library didn't load)
      showAuthGate('Could not connect to Supabase — check your Project URL/key and internet connection.');
    } else {
      // No Supabase configured — use platform storage when available, otherwise browser localStorage.
      hideAuthGate();
      await startApp();
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
