        <div class="kpi"><div class="lbl">Net Cash Position</div><div class="val">${peso(s.netCashPosition)}</div></div>
        <div class="kpi"><div class="lbl">Outstanding Receivables</div><div class="val">${peso(s.outstandingReceivables)}</div></div>
        <div class="kpi"><div class="lbl">Outstanding Supplier Payables</div><div class="val">${peso(s.outstandingPayables)}</div></div>
        <div class="kpi"><div class="lbl">Verified Inventory Value</div><div class="val">${peso(s.inventoryValue)}</div></div>
        <div class="kpi"><div class="lbl">Net Operating Position</div><div class="val">${peso(s.netOperatingPosition)}</div></div>
      </div>

      <div id="fin-panel-slot"></div>

      <div class="card">
        <h3>Account Balances</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Account</th><th class="num">Balance</th></tr></thead>
            <tbody>${s.accountBalances.map(a=>`<tr><td>${escapeHtml(a.name)}</td><td class="num">${peso(a.balance)}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>Cash Flow Report</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          ${['daily','weekly','monthly','annual'].map(p=>`<button class="btn small ${p===reportPeriod?'primary':''}" data-period="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}
        </div>
        <div id="fin-report-slot"></div>
      </div>

      <div class="chart-grid">
        <div class="card chart-card">
          <h3>Cash In vs Cash Out — ${escapeHtml(monthLabel)}</h3>
          <div id="fin-inout-chart"></div>
        </div>
        <div class="card chart-card">
          <h3>Monthly Collections (all-time trend)</h3>
          <div id="fin-collections-chart"></div>
        </div>
        <div class="card chart-card">
          <h3>Monthly Expenses (all-time trend)</h3>
          <div id="fin-expenses-chart"></div>
        </div>
        <div class="card chart-card">
          <h3>Account Balances</h3>
          <div id="fin-balances-chart"></div>
        </div>
      </div>

      <div class="card">
        <h3>Cash Ledger</h3>
        <div class="grid cols-2">
          <div class="field"><label>Account</label><select id="lf-account"><option value="">All accounts</option>${state.settings.cashAccounts.map(a=>`<option ${a===ledgerFilters.account?'selected':''}>${escapeHtml(a)}</option>`).join('')}</select></div>
          <div class="field"><label>Transaction Type</label><select id="lf-type"><option value="">All types</option>${E.LEDGER_TRANSACTION_TYPES.map(t=>`<option ${t===ledgerFilters.type?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select></div>
        </div>
        <div class="table-wrap" style="margin-top:10px;">
          <table class="data">
            <thead><tr>
              <th>Date</th><th>Time</th><th>Type</th><th>Client/Supplier</th><th>Account</th>
              <th class="num">Cash In</th><th class="num">Cash Out</th><th class="num">Running Balance</th><th>Reference</th><th>Remarks</th>
            </tr></thead>
            <tbody id="fin-ledger-body"></tbody>
          </table>
        </div>
      </div>
    `;

    renderLedgerTable(container);
    renderReport(container);
    renderCharts(container);

    E.qs('#fin-manual-btn', container).addEventListener('click', ()=>{ panel = panel==='manual'?null:'manual'; renderPanel(container); });
    E.qs('#fin-transfer-btn', container).addEventListener('click', ()=>{ panel = panel==='transfer'?null:'transfer'; renderPanel(container); });
    E.qs('#lf-account', container).addEventListener('change', e=>{ ledgerFilters.account=e.target.value; renderLedgerTable(container); });
    E.qs('#lf-type', container).addEventListener('change', e=>{ ledgerFilters.type=e.target.value; renderLedgerTable(container); });
    E.qsa('[data-period]', container).forEach(b=> b.addEventListener('click', ()=>{ reportPeriod=b.dataset.period; renderFinance(container); }));

    if(panel) renderPanel(container);
  }

  function renderReport(container){
    const slot = E.qs('#fin-report-slot', container);
    let r;
    if(reportPeriod==='daily') r = E.dailyCashFlow();
    else if(reportPeriod==='weekly') r = E.weeklyCashFlow();
    else if(reportPeriod==='annual') r = E.annualCashFlow(state.selectedMonth.year);
    else r = E.monthlyCashFlow(state.selectedMonth);
    slot.innerHTML = `
      <div class="grid cols-2">
        <div class="field"><label>Beginning Balance</label><input readonly value="${peso(r.beginningBalance)}"></div>
        <div class="field"><label>Ending Balance</label><input readonly value="${peso(r.endingBalance)}"></div>
        <div class="field"><label>Total Cash In</label><input readonly value="${peso(r.totalCashIn)}"></div>
        <div class="field"><label>Total Cash Out</label><input readonly value="${peso(r.totalCashOut)}"></div>
        <div class="field full"><label>Net Cash Flow</label><input readonly value="${peso(r.netCashFlow)}" style="font-weight:800;"></div>
      </div>
    `;
  }

  function renderCharts(container){
    const ym = state.selectedMonth;
    const monthEntries = state.cashLedger.filter(e=>E.inMonth(e.date, ym));
    const inTotal = monthEntries.reduce((s,e)=>s+(Number(e.cashIn)||0),0);
    const outTotal = monthEntries.reduce((s,e)=>s+(Number(e.cashOut)||0),0);
    E.qs('#fin-inout-chart', container).innerHTML = E.charts.barChart([
      {label:'Cash In', value: Math.round(inTotal)}, {label:'Cash Out', value: Math.round(outTotal)}
    ]);

    const monthMapC = {}, monthMapE = {};
    state.cashLedger.forEach(e=>{
      const mk = E.monthKey(e.date);
      if(!mk) return;
      if(e.transactionType==='Client Payment') monthMapC[mk] = (monthMapC[mk]||0) + (Number(e.cashIn)||0);
      if(['Expense','Other Expense'].includes(e.transactionType)) monthMapE[mk] = (monthMapE[mk]||0) + (Number(e.cashOut)||0);
    });
    const cMonths = Object.keys(monthMapC).sort();
    const eMonths = Object.keys(monthMapE).sort();
    E.qs('#fin-collections-chart', container).innerHTML = E.charts.lineChart(cMonths.map(mk=>({label:E.monthLabel(mk+'-01'), value: Math.round(monthMapC[mk])})));
    E.qs('#fin-expenses-chart', container).innerHTML = E.charts.lineChart(eMonths.map(mk=>({label:E.monthLabel(mk+'-01'), value: Math.round(monthMapE[mk])})));

    const balances = E.allAccountBalances();
    E.qs('#fin-balances-chart', container).innerHTML = E.charts.barChart(balances.map(a=>({label:a.name, value:Math.round(a.balance)})));
  }

  function visibleLedger(){
    return state.cashLedger.filter(e=>{
      if(ledgerFilters.account && e.account!==ledgerFilters.account) return false;
      if(ledgerFilters.type && e.transactionType!==ledgerFilters.type) return false;
      return true;
    }).sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
  }

  function renderLedgerTable(container){
    const body = E.qs('#fin-ledger-body', container);
    const rows = visibleLedger();
    let running = 0;
    const withBalance = rows.map(e=>{
      if(!ledgerFilters.account){ running += (Number(e.cashIn)||0) - (Number(e.cashOut)||0); }
      return e;
    });
    // per-account running balance if filtered; else running TOTAL across all accounts
    let runningBalances = {};
    const display = rows.map(e=>{
      let bal;
      if(ledgerFilters.account){
        runningBalances[e.account] = (runningBalances[e.account]||0) + (Number(e.cashIn)||0) - (Number(e.cashOut)||0);
        bal = runningBalances[e.account];
      } else {
        runningBalances.__all = (runningBalances.__all||0) + (Number(e.cashIn)||0) - (Number(e.cashOut)||0);
        bal = runningBalances.__all;
      }
      return {e, bal};
    }).reverse(); // newest first for display

    body.innerHTML = display.length ? display.map(({e,bal})=>`
      <tr>
        <td>${escapeHtml(e.date)}</td>
        <td>${escapeHtml(e.time||'')}</td>
        <td><span class="pill ${e.cashIn>0?'green':'orange'}">${escapeHtml(e.transactionType)}</span></td>
        <td>${escapeHtml(e.clientOrSupplier||'—')}</td>
        <td>${escapeHtml(e.account)}</td>
        <td class="num">${e.cashIn>0?peso(e.cashIn):'—'}</td>
        <td class="num">${e.cashOut>0?peso(e.cashOut):'—'}</td>
        <td class="num">${peso(bal)}</td>
        <td>${escapeHtml(e.referenceNumber||'—')}</td>
        <td>${escapeHtml(e.remarks||'')}</td>
      </tr>
    `).join('') : `<tr><td colspan="10"><div class="empty-state">No cash movements yet.</div></td></tr>`;
  }

  function renderPanel(container){
    const slot = E.qs('#fin-panel-slot', container);
    if(!slot) return;
    if(!panel){ slot.innerHTML=''; return; }
    if(panel==='manual') return renderManualEntryPanel(container, slot);
    if(panel==='transfer') return renderTransferPanel(container, slot);
  }

  function renderManualEntryPanel(container, slot){
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>Manual Cash Entry</h3>
        <div class="grid">
          <div class="field"><label>Date</label><input id="mc-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Account</label><select id="mc-account">${state.settings.cashAccounts.map(a=>`<option>${escapeHtml(a)}</option>`).join('')}</select></div>
          <div class="field"><label>Transaction Type</label><select id="mc-type">${E.LEDGER_TRANSACTION_TYPES.map(t=>`<option>${escapeHtml(t)}</option>`).join('')}</select></div>
          <div class="field"><label>Amount</label><input id="mc-amount" type="number" step="0.01" min="0" value="0"></div>
          <div class="field"><label>Direction</label><select id="mc-direction"><option value="in">Cash In (increases account)</option><option value="out">Cash Out (decreases account)</option></select></div>
          <div class="field"><label>Category</label><input id="mc-category" placeholder="e.g. Salary, Rent, Fuel, Utilities"></div>
          <div class="field full"><label>Remarks</label><input id="mc-remarks" placeholder="Optional"></div>
        </div>
        <div class="actions" style="margin-top:10px;">
          <button class="btn" id="mc-cancel">Cancel</button>
          <button class="btn primary" id="mc-save">Save Entry</button>
        </div>
      </div>
    `;
    const typeSelect = E.qs('#mc-type', container);
    const directionSelect = E.qs('#mc-direction', container);
    const defaultDirection = t => ['Owner Withdrawal','Bank Withdrawal','Expense','Other Expense','Refund'].includes(t) ? 'out' : 'in';
    directionSelect.value = defaultDirection(typeSelect.value);
    typeSelect.addEventListener('change', ()=>{ directionSelect.value = defaultDirection(typeSelect.value); });

    E.qs('#mc-cancel', container).addEventListener('click', ()=>{ panel=null; renderPanel(container); });
    E.qs('#mc-save', container).addEventListener('click', async ()=>{
      const amount = parseFloat(E.qs('#mc-amount',container).value)||0;
      if(amount<=0){ toast('Enter an amount greater than zero'); return; }
      const direction = E.qs('#mc-direction',container).value;
      await E.createLedgerEntry({
        date: E.qs('#mc-date',container).value, account: E.qs('#mc-account',container).value,
        transactionType: E.qs('#mc-type',container).value, source: E.qs('#mc-category',container).value || 'Manual Entry',
        cashIn: direction==='in' ? amount : 0, cashOut: direction==='out' ? amount : 0,
        remarks: E.qs('#mc-remarks',container).value
      });
      toast('Cash entry recorded');
      panel = null;
      renderFinance(container);
    });
  }

  function renderTransferPanel(container, slot){
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>Transfer Between Accounts</h3>
        <div class="grid">
          <div class="field"><label>Date</label><input id="tf-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>From Account</label><select id="tf-from">${state.settings.cashAccounts.map(a=>`<option>${escapeHtml(a)}</option>`).join('')}</select></div>
          <div class="field"><label>To Account</label><select id="tf-to">${state.settings.cashAccounts.map((a,i)=>`<option ${i===1?'selected':''}>${escapeHtml(a)}</option>`).join('')}</select></div>
          <div class="field"><label>Amount</label><input id="tf-amount" type="number" step="0.01" min="0" value="0"></div>
          <div class="field full"><label>Remarks</label><input id="tf-remarks" placeholder="Optional"></div>
        </div>
        <p style="font-size:11.5px;color:var(--ink-soft);">Total Cash Available won't change — this just moves money from one account to another.</p>
        <div class="actions" style="margin-top:6px;">
          <button class="btn" id="tf-cancel">Cancel</button>
          <button class="btn primary" id="tf-save">Save Transfer</button>
        </div>
      </div>
    `;
    E.qs('#tf-cancel', container).addEventListener('click', ()=>{ panel=null; renderPanel(container); });
    E.qs('#tf-save', container).addEventListener('click', async ()=>{
      const amount = parseFloat(E.qs('#tf-amount',container).value)||0;
      const from = E.qs('#tf-from',container).value;
      const to = E.qs('#tf-to',container).value;
      if(amount<=0){ toast('Enter an amount greater than zero'); return; }
      if(from===to){ toast('Choose two different accounts'); return; }
      const date = E.qs('#tf-date',container).value;
      const remarks = E.qs('#tf-remarks',container).value || `Transfer to ${to}`;
      const transferId = uid('xfer');
      await E.createLedgerEntry({ date, account: from, transactionType:'Cash Transfer', source:'Transfer',
        referenceNumber: transferId, cashIn:0, cashOut: amount, remarks: `${remarks} (to ${to})` });
      await E.createLedgerEntry({ date, account: to, transactionType:'Cash Transfer', source:'Transfer',
        referenceNumber: transferId, cashIn: amount, cashOut:0, remarks: `${remarks} (from ${from})` });
      toast('Transfer recorded');
      panel = null;
      renderFinance(container);
    });
  }

  E.renderFinance = renderFinance;
  E._financeRenderLedgerTable = renderLedgerTable;
  E._financeRenderCharts = renderCharts;
  E._financeRenderReport = renderReport;
})();
</script>



<script>
/* =====================================================================
   CLIENT CUP STOCK INVENTORY — separate module, separate dashboard.
   Never touches the main Dashboard, general Inventory, or any other
   existing module. Only one small linked KPI card is added elsewhere.
===================================================================== */
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO } = E;

  const MOVEMENT_TYPES = ["Stock In","Stock Out","Manual Adjustment","Damaged Items","Returned Items"];

  function cupComputed(r){
    const added = Number(r.quantityAdded)||0;
    const released = Number(r.quantityReleased)||0;
    const cost = Number(r.unitCost)||0;
    const remaining = Math.max(0, added - released);
    const originalValue = added * cost;
    const remainingValue = remaining * cost;
    const weekly = Number(r.expectedWeeklyConsumption)||0;
    const weeksRemaining = weekly>0 ? remaining/weekly : null;
    let status = 'In Stock';
    const reorder = Number(r.reorderLevel)||0;
    if(remaining<=0) status = 'Out of Stock';
    else if(remaining<=reorder) status = 'Low Stock';
    return { added, released, cost, remaining, originalValue, remainingValue, weeksRemaining, status };
  }
  function cupStatusPill(status){
    if(status==='Out of Stock') return 'red';
    if(status==='Low Stock') return 'orange';
    return 'green';
  }

  function blankCupRecord(){
    return {
      id: uid('cup'), dateAdded: todayISO(), client:'', cupDescription:'', cupSize:'', cupType:'',
      printDescription:'', productCode:'', supplier: state.settings.suppliers[0]||'',
      quantityAdded:0, unitCost:0, quantityReleased:0, reorderLevel:100, expectedWeeklyConsumption:0,
      remarks:'', lastUpdated: todayISO(),
      movements: []
    };
  }

  function pushMovement(r, type, qty, note, extra){
    r.movements.unshift(Object.assign({
      id: uid('mv'), date: todayISO(), type, qty, note: note||'',
      balanceAfter: null // filled in after quantity fields updated by caller
    }, extra||{}));
  }

  /* ---------------- summary for the ONE card on the main dashboard ---------------- */
  function computeCupStockCardValue(){
    return state.cupStock.reduce((s,r)=> s + cupComputed(r).remainingValue, 0);
  }
  E.computeCupStockCardValue = computeCupStockCardValue;

  /* ---------------- dedicated dashboard summary ---------------- */
  function computeCupDashboardSummary(){
    const rows = state.cupStock.map(r=>({r, c:cupComputed(r)}));
    const totalValue = rows.reduce((s,x)=>s+x.c.remainingValue,0);
    const totalCups = rows.reduce((s,x)=>s+x.c.remaining,0);
    const clients = new Set(rows.filter(x=>x.c.remaining>0).map(x=>x.r.client)).size;
    const lowStock = rows.filter(x=>x.c.status==='Low Stock').length;
    const outStock = rows.filter(x=>x.c.status==='Out of Stock').length;
    const byClient = {};
    rows.forEach(x=>{ byClient[x.r.client] = (byClient[x.r.client]||0) + x.c.remainingValue; });
    const topClient = Object.entries(byClient).sort((a,b)=>b[1]-a[1])[0];
    return { totalValue, totalCups, clients, lowStock, outStock, topClient: topClient ? {name:topClient[0], value:topClient[1]} : null };
  }

  /* ---------------- filters + page state ---------------- */
  let filters = { client:'', size:'', status:'', supplier:'', dateAdded:'' };

  function visibleCupStock(){
    return state.cupStock.filter(r=>{
      if(filters.client && !(r.client||'').toLowerCase().includes(filters.client.toLowerCase())) return false;
      if(filters.size && r.cupSize!==filters.size) return false;
      if(filters.status && cupComputed(r).status!==filters.status) return false;
      if(filters.supplier && r.supplier!==filters.supplier) return false;
      if(filters.dateAdded && r.dateAdded!==filters.dateAdded) return false;
      return true;
    }).sort((a,b)=> (b.lastUpdated||'').localeCompare(a.lastUpdated||''));
  }

  function renderCupStock(container){
    const s = computeCupDashboardSummary();
    const sizes = [...new Set(state.cupStock.map(r=>r.cupSize).filter(Boolean))];
    const rows = visibleCupStock();

    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Client Cup Stock</p><h2>Cup Stock Inventory Dashboard</h2></div>
        <div class="actions"><button class="btn primary" id="cup-add-btn">+ Add Cup Stock Entry</button></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">
        Advance cup stock purchased and held for specific clients — separate from general Inventory and the main Dashboard.
      </p>

      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="kpi"><div class="lbl">Total Client Cup Stock Value</div><div class="val">${peso(s.totalValue)}</div></div>
        <div class="kpi"><div class="lbl">Total Cups Currently in Stock</div><div class="val">${s.totalCups.toLocaleString()}</div></div>
        <div class="kpi"><div class="lbl">Clients with Cup Stocks</div><div class="val">${s.clients}</div></div>
        <div class="kpi"><div class="lbl">Low-Stock Cup Items</div><div class="val">${s.lowStock}</div></div>
        <div class="kpi"><div class="lbl">Out-of-Stock Cup Items</div><div class="val">${s.outStock}</div></div>
        <div class="kpi"><div class="lbl">Highest-Value Client Stock</div><div class="val" style="font-size:15px;">${s.topClient ? escapeHtml(s.topClient.name)+' — '+peso(s.topClient.value) : '—'}</div></div>
      </div>

      <div id="cup-panel-slot"></div>

      <div class="card">
        <h3>Filters</h3>
        <div class="grid" style="grid-template-columns:repeat(5,1fr);">
          <div class="field"><label>Client</label><input id="cf-client" value="${escapeHtml(filters.client)}" placeholder="Search client…"></div>
          <div class="field"><label>Cup Size</label><select id="cf-size"><option value="">All sizes</option>${sizes.map(sz=>`<option ${sz===filters.size?'selected':''}>${escapeHtml(sz)}</option>`).join('')}</select></div>
          <div class="field"><label>Stock Status</label><select id="cf-status"><option value="">All statuses</option><option ${filters.status==='In Stock'?'selected':''}>In Stock</option><option ${filters.status==='Low Stock'?'selected':''}>Low Stock</option><option ${filters.status==='Out of Stock'?'selected':''}>Out of Stock</option></select></div>
          <div class="field"><label>Supplier</label><select id="cf-supplier"><option value="">All suppliers</option>${state.settings.suppliers.map(sp=>`<option ${sp===filters.supplier?'selected':''}>${escapeHtml(sp)}</option>`).join('')}</select></div>
          <div class="field"><label>Date Added</label><input id="cf-date" type="date" value="${filters.dateAdded}"></div>
        </div>
        <button class="btn small" id="cf-clear" style="margin-top:8px;">Clear filters</button>
      </div>

      <div class="card">
        <h3>Cup Stock (${rows.length})</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Client</th><th>Description</th><th>Size</th><th class="num">Added</th><th class="num">Released</th>
              <th class="num">Remaining</th><th class="num">Unit Cost</th><th class="num">Remaining Value</th>
              <th class="num">Weekly Use</th><th class="num">Weeks Left</th><th class="num">Reorder At</th><th>Status</th><th>Last Updated</th><th></th>
            </tr></thead>
            <tbody id="cup-body"></tbody>
          </table>
        </div>
      </div>
    `;

    renderCupRows(container);

    E.qs('#cup-add-btn', container).addEventListener('click', ()=> E.openCupPanel(container, 'form', null));
    E.qs('#cf-client', container).addEventListener('input', e=>{ filters.client=e.target.value; refreshTableAndCount(container); });
    E.qs('#cf-size', container).addEventListener('change', e=>{ filters.size=e.target.value; refreshTableAndCount(container); });
    E.qs('#cf-status', container).addEventListener('change', e=>{ filters.status=e.target.value; refreshTableAndCount(container); });
    E.qs('#cf-supplier', container).addEventListener('change', e=>{ filters.supplier=e.target.value; refreshTableAndCount(container); });
    E.qs('#cf-date', container).addEventListener('change', e=>{ filters.dateAdded=e.target.value; refreshTableAndCount(container); });
    E.qs('#cf-clear', container).addEventListener('click', ()=>{ filters={client:'',size:'',status:'',supplier:'',dateAdded:''}; renderCupStock(container); });

    if(E._cupPanel) E._renderCupPanel(container);
  }

  function refreshTableAndCount(container){
    renderCupRows(container);
    const h3 = container.querySelectorAll('.card h3')[1];
    if(h3) h3.textContent = `Cup Stock (${visibleCupStock().length})`;
  }

  function renderCupRows(container){
    const body = E.qs('#cup-body', container);
    const rows = visibleCupStock();
    body.innerHTML = rows.length ? rows.map(r=>{
      const c = cupComputed(r);
      return `<tr data-id="${r.id}">
        <td><b>${escapeHtml(r.client)}</b></td>
        <td>${escapeHtml(r.cupDescription)}</td>
        <td>${escapeHtml(r.cupSize)}</td>
        <td class="num">${c.added.toLocaleString()}</td>
        <td class="num">${c.released.toLocaleString()}</td>
        <td class="num">${c.remaining.toLocaleString()}</td>
        <td class="num">${peso(c.cost)}</td>
        <td class="num">${peso(c.remainingValue)}</td>
        <td class="num">${r.expectedWeeklyConsumption||0}</td>
        <td class="num">${c.weeksRemaining==null?'—':c.weeksRemaining.toFixed(1)}</td>
        <td class="num">${r.reorderLevel||0}</td>
        <td><span class="pill ${cupStatusPill(c.status)}">${c.status}</span></td>
        <td>${escapeHtml(r.lastUpdated||'')}</td>
        <td style="white-space:nowrap;">
          <button class="btn small" data-edit="${r.id}">Edit</button>
          <button class="btn small" data-release="${r.id}">Release</button>
          <button class="btn small" data-adjust="${r.id}">Adjust</button>
          <button class="btn small" data-history="${r.id}">History</button>
        </td>
      </tr>`;
    }).join('') : `<tr><td colspan="14"><div class="empty-state">No client cup stock yet — click "+ Add Cup Stock Entry" to record advance stock for a client.</div></td></tr>`;

    body.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> E.openCupPanel(container, 'form', b.dataset.edit)));
    body.querySelectorAll('[data-release]').forEach(b=> b.addEventListener('click', ()=> E.openCupPanel(container, 'release', b.dataset.release)));
    body.querySelectorAll('[data-adjust]').forEach(b=> b.addEventListener('click', ()=> E.openCupPanel(container, 'adjust', b.dataset.adjust)));
    body.querySelectorAll('[data-history]').forEach(b=> b.addEventListener('click', ()=> E.openCupPanel(container, 'history', b.dataset.history)));
  }

  E.cupComputedPublic = cupComputed;
  E.blankCupRecord = blankCupRecord;
  E.pushCupMovement = pushMovement;
  E.renderCupStock = renderCupStock;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO } = E;

  function renderPanel(container){
    const slot = E.qs('#cup-panel-slot', container);
    if(!slot) return;
    if(!panelState()){ slot.innerHTML=''; return; }
    const p = panelState();
    if(p.type==='form') return renderFormPanel(container, slot, p.recordId);
    if(p.type==='release') return renderReleasePanel(container, slot, p.recordId);
    if(p.type==='adjust') return renderAdjustPanel(container, slot, p.recordId);
    if(p.type==='history') return renderHistoryPanel(container, slot, p.recordId);
  }

  // panel state lives in the main cup-stock module's closure; expose accessors via E
  function panelState(){ return E._cupPanel; }
  function setPanelState(v){ E._cupPanel = v; }
  E.openCupPanel = function(container, type, recordId){ setPanelState({type, recordId}); renderPanel(container); };
  E.closeCupPanel = function(container){ setPanelState(null); renderPanel(container); };

  /* ---------------- Add / Edit form ---------------- */
  function renderFormPanel(container, slot, recordId){
    const editing = recordId ? state.cupStock.find(r=>r.id===recordId) : null;
    const r = editing || E.blankCupRecord();
    const products = state.products;
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>${editing ? 'Edit Cup Stock Entry' : 'Add Cup Stock Entry'}</h3>
        <div class="grid">
          <div class="field"><label>Date Added</label><input id="cp-date" type="date" value="${r.dateAdded}"></div>
          <div class="field"><label>Client / Coffee Shop Name</label><input id="cp-client" value="${escapeHtml(r.client)}" placeholder="Camp Cafe"></div>
          <div class="field"><label>Supplier</label><select id="cp-supplier">${state.settings.suppliers.map(s=>`<option ${s===r.supplier?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Cup Description</label><input id="cp-desc" value="${escapeHtml(r.cupDescription)}" placeholder="16oz Cold Cup, Clear PET"></div>
          <div class="field"><label>Cup Size</label><input id="cp-size" value="${escapeHtml(r.cupSize)}" placeholder="16oz"></div>
          <div class="field"><label>Cup Type</label><input id="cp-type" value="${escapeHtml(r.cupType)}" placeholder="Cold Cup / Hot Cup"></div>
          <div class="field full"><label>Print / Design Description</label><input id="cp-print" value="${escapeHtml(r.printDescription)}" placeholder="Camp Cafe logo, 2-color print"></div>
          <div class="field"><label>Product Code (if available)</label><select id="cp-product"><option value="">— none / custom —</option>${products.map(p=>`<option value="${escapeHtml(p.code)}" ${p.code===r.productCode?'selected':''}>${escapeHtml(p.code)} — ${escapeHtml(p.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Quantity Added</label><input id="cp-qtyadd" type="number" min="0" value="${r.quantityAdded}"></div>
          <div class="field"><label>Unit Cost (supplier cost, not selling price)</label><input id="cp-cost" type="number" step="0.01" min="0" value="${r.unitCost}"></div>
          <div class="field"><label>Quantity Released (to date)</label><input id="cp-qtyrel" type="number" min="0" value="${r.quantityReleased}" ${editing?'':'disabled title="New entries start at 0 — use Release after saving"'}></div>
          <div class="field"><label>Reorder Level</label><input id="cp-reorder" type="number" min="0" value="${r.reorderLevel}"></div>
          <div class="field"><label>Expected Weekly Consumption</label><input id="cp-weekly" type="number" min="0" value="${r.expectedWeeklyConsumption}"></div>
          <div class="field full"><label>Remarks</label><textarea id="cp-remarks">${escapeHtml(r.remarks)}</textarea></div>
        </div>
        <div class="actions" style="margin-top:14px;">
          <button class="btn" id="cp-cancel">Cancel</button>
          ${editing ? '<button class="btn danger" id="cp-delete">Delete Entry</button>' : ''}
          <button class="btn primary" id="cp-save">${editing?'Save Changes':'Add Cup Stock'}</button>
        </div>
      </div>
    `;

    E.qs('#cp-product', container).addEventListener('change', e=>{
      const prod = products.find(p=>p.code===e.target.value);
      if(prod){
        if(!E.qs('#cp-desc',container).value) E.qs('#cp-desc',container).value = prod.name;
        E.qs('#cp-cost',container).value = E.productCostPerPiece(prod).toFixed(4);
      }
    });

    E.qs('#cp-cancel', container).addEventListener('click', ()=> E.closeCupPanel(container));
    if(editing){
      E.qs('#cp-delete', container).addEventListener('click', async ()=>{
        if(!confirm(`Delete the cup stock entry for ${r.client}? This removes its full movement history too.`)) return;
        state.cupStock = state.cupStock.filter(x=>x.id!==r.id);
        await E.storageDelete('cupstock:'+r.id);
        toast('Cup stock entry deleted');
        E.closeCupPanel(container);
        E.renderCupStock(container);
      });
    }
    E.qs('#cp-save', container).addEventListener('click', async ()=>{
      const client = E.qs('#cp-client',container).value.trim();
      if(!client){ toast('Enter a client / coffee shop name'); return; }
      r.dateAdded = E.qs('#cp-date',container).value;
      r.client = client;
      r.supplier = E.qs('#cp-supplier',container).value;
      r.cupDescription = E.qs('#cp-desc',container).value;
      r.cupSize = E.qs('#cp-size',container).value;
      r.cupType = E.qs('#cp-type',container).value;
      r.printDescription = E.qs('#cp-print',container).value;
      r.productCode = E.qs('#cp-product',container).value;
      r.quantityAdded = parseFloat(E.qs('#cp-qtyadd',container).value)||0;
      r.unitCost = parseFloat(E.qs('#cp-cost',container).value)||0;
      if(editing) r.quantityReleased = parseFloat(E.qs('#cp-qtyrel',container).value)||0;
      r.reorderLevel = parseFloat(E.qs('#cp-reorder',container).value)||0;
      r.expectedWeeklyConsumption = parseFloat(E.qs('#cp-weekly',container).value)||0;
      r.remarks = E.qs('#cp-remarks',container).value;
      r.lastUpdated = E.todayISO();

      if(!editing){
        r.movements = [];
        E.pushCupMovement(r, 'Stock In', r.quantityAdded, 'Initial advance stock purchase', {balanceAfter: r.quantityAdded});
        state.cupStock.unshift(r);
      }
      await E.storageSet('cupstock:'+r.id, r);
      toast(editing ? 'Cup stock entry updated' : 'Cup stock entry added');
      E.closeCupPanel(container);
      E.renderCupStock(container);
    });
  }

  /* ---------------- Release ---------------- */
  function renderReleasePanel(container, slot, recordId){
    const r = state.cupStock.find(x=>x.id===recordId);
    if(!r){ slot.innerHTML=''; return; }
    const c = E.cupComputedPublic(r);
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>Release Stock — ${escapeHtml(r.client)} (${escapeHtml(r.cupDescription)})</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">Currently remaining: <b>${c.remaining.toLocaleString()}</b> pcs</p>
        <div class="grid">
          <div class="field"><label>Release Date</label><input id="rl-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Quotation / Order Number</label><input id="rl-order" placeholder="e.g. QTN-2026-0012"></div>
          <div class="field"><label>Quantity Released</label><input id="rl-qty" type="number" min="1" max="${c.remaining}" value="0"></div>
          <div class="field"><label>Released By</label><select id="rl-by">${state.settings.salespersons.map(s=>`<option>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field full"><label>Remarks</label><input id="rl-remarks" placeholder="Optional note"></div>
        </div>
        <div class="actions" style="margin-top:14px;">
          <button class="btn" id="rl-cancel">Cancel</button>
          <button class="btn primary" id="rl-save">Record Release</button>
        </div>
      </div>
    `;
    E.qs('#rl-cancel', container).addEventListener('click', ()=> E.closeCupPanel(container));
    E.qs('#rl-save', container).addEventListener('click', async ()=>{
      const qty = parseFloat(E.qs('#rl-qty',container).value)||0;
      if(qty<=0){ toast('Enter a quantity greater than zero'); return; }
      const current = E.cupComputedPublic(r).remaining;
      if(qty>current){ toast(`Only ${current.toLocaleString()} pcs remain — cannot release more than that`); return; }
      r.quantityReleased = (Number(r.quantityReleased)||0) + qty;
      r.lastUpdated = E.todayISO();
      const balanceAfter = E.cupComputedPublic(r).remaining;
      E.pushCupMovement(r, 'Stock Out', qty,
        E.qs('#rl-remarks',container).value,
        { quotationNumber: E.qs('#rl-order',container).value, releasedBy: E.qs('#rl-by',container).value, balanceAfter });
      await E.storageSet('cupstock:'+r.id, r);
      toast('Release recorded — remaining stock updated');
      E.closeCupPanel(container);
      E.renderCupStock(container);
    });
  }

  /* ---------------- Manual adjustment ---------------- */
  function renderAdjustPanel(container, slot, recordId){
    const r = state.cupStock.find(x=>x.id===recordId);
    if(!r){ slot.innerHTML=''; return; }
    const c = E.cupComputedPublic(r);
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>Manual Stock Adjustment — ${escapeHtml(r.client)} (${escapeHtml(r.cupDescription)})</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">Currently remaining: <b>${c.remaining.toLocaleString()}</b> pcs</p>
        <div class="grid">
          <div class="field"><label>Adjustment Type</label><select id="aj-type"><option>Stock In</option><option>Damaged Items</option><option>Returned Items</option><option>Manual Adjustment</option></select></div>
          <div class="field"><label>Quantity</label><input id="aj-qty" type="number" min="0" value="0"></div>
          <div class="field full"><label>Reason (required)</label><input id="aj-reason" placeholder="Why is this adjustment being made?"></div>
        </div>
        <p style="font-size:11.5px;color:var(--ink-soft);">Stock In / Returned Items add to available stock. Damaged Items / Manual Adjustment reduce it.</p>
        <div class="actions" style="margin-top:6px;">
          <button class="btn" id="aj-cancel">Cancel</button>
          <button class="btn primary" id="aj-save">Save Adjustment</button>
        </div>
      </div>
    `;
    E.qs('#aj-cancel', container).addEventListener('click', ()=> E.closeCupPanel(container));
    E.qs('#aj-save', container).addEventListener('click', async ()=>{
      const type = E.qs('#aj-type',container).value;
      const qty = parseFloat(E.qs('#aj-qty',container).value)||0;
      const reason = E.qs('#aj-reason',container).value.trim();
      if(qty<=0){ toast('Enter a quantity greater than zero'); return; }
      if(!reason){ toast('A reason is required for manual adjustments'); return; }
      if(type==='Stock In' || type==='Returned Items'){
        r.quantityAdded = (Number(r.quantityAdded)||0) + qty;
      } else {
        const current = E.cupComputedPublic(r).remaining;
        if(qty>current){ toast(`Only ${current.toLocaleString()} pcs remain — cannot reduce by more than that`); return; }
        r.quantityReleased = (Number(r.quantityReleased)||0) + qty;
      }
      r.lastUpdated = E.todayISO();
      const balanceAfter = E.cupComputedPublic(r).remaining;
      E.pushCupMovement(r, type, qty, reason, {balanceAfter});
      await E.storageSet('cupstock:'+r.id, r);
      toast('Adjustment saved');
      E.closeCupPanel(container);
      E.renderCupStock(container);
    });
  }

  /* ---------------- History ---------------- */
  function renderHistoryPanel(container, slot, recordId){
    const r = state.cupStock.find(x=>x.id===recordId);
    if(!r){ slot.innerHTML=''; return; }
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>Stock Movement History — ${escapeHtml(r.client)} (${escapeHtml(r.cupDescription)})</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Date</th><th>Type</th><th class="num">Qty</th><th>Note / Reason</th><th>Order No.</th><th>Released By</th><th class="num">Balance After</th></tr></thead>
            <tbody>
              ${(r.movements&&r.movements.length) ? r.movements.map(m=>`
                <tr>
                  <td>${escapeHtml(m.date)}</td>
                  <td><span class="pill ${m.type==='Stock In'||m.type==='Returned Items'?'green':(m.type==='Damaged Items'?'red':'orange')}">${escapeHtml(m.type)}</span></td>
                  <td class="num">${m.qty}</td>
                  <td>${escapeHtml(m.note||'')}</td>
                  <td>${escapeHtml(m.quotationNumber||'—')}</td>
                  <td>${escapeHtml(m.releasedBy||'—')}</td>
                  <td class="num">${m.balanceAfter==null?'—':m.balanceAfter.toLocaleString()}</td>
                </tr>
              `).join('') : `<tr><td colspan="7"><div class="empty-state">No movements recorded yet.</div></td></tr>`}
            </tbody>
          </table>
        </div>
        <div class="actions" style="margin-top:14px;"><button class="btn" id="hs-close">Close</button></div>
      </div>
    `;
    E.qs('#hs-close', container).addEventListener('click', ()=> E.closeCupPanel(container));
  }

  E._renderCupPanel = renderPanel;
})();
</script>

<script>
/* =====================================================================
   DIRECT SUPPLIER PURCHASE — purchases with no client quotation attached.
   Auto-creates/updates a linked Supplier Payable (sourceType='Direct Purchase').
   "Receive to Inventory" only touches stock once explicitly confirmed, and
   supports partial receiving.
===================================================================== */
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO } = E;

  const PURCHASE_TYPES = ["General Inventory Stock","Client-Specific Cup Stock","Retail Stock","Sample Stock","Replacement Stock","Other"];
  const GENERAL_DESTINATION_TYPES = ["General Inventory Stock","Retail Stock","Sample Stock","Replacement Stock","Other"];

  function nextPurchaseId(){
    const year = new Date().getFullYear();
    let max = 0;
    state.directPurchases.forEach(p=>{
      const m = (p.id||'').match(new RegExp('DSP-'+year+'-(\\d+)$'));
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    return `DSP-${year}-${String(max+1).padStart(4,'0')}`;
  }

  function blankPurchase(){
    return {
      id: nextPurchaseId(), purchaseDate: todayISO(), supplierName: state.settings.suppliers[0]||'',
      productCode:'', productName:'', productDescription:'', variant:'',
      quantityPurchased:0, unit:'Piece', piecesPerBox:0, numberOfBoxes:0,
      supplierUnitCost:0, costPerBox:0, shippingCost:0, handlingCost:0, printingCost:0, otherCharges:0,
      expectedDeliveryDate:'', actualDeliveryDate:'', paymentDueDate:E.addDays(todayISO(),25),
      paymentTerm:'25 Days', paymentTermDays:25,
      purchaseType: PURCHASE_TYPES[0], inventoryDestination:'',
      remarks:'', referenceNumber:'', purchaseBatchId:'', purchaseOrderNumber:'', batchLineNumber:0,
      quantityReceivedTotal:0, damagedQuantityTotal:0,
      receivingHistory:[]
    };
  }

  function purchaseComputed(p){
    const totalPurchaseCost = (Number(p.quantityPurchased)||0)*(Number(p.supplierUnitCost)||0)
      + (Number(p.shippingCost)||0)+(Number(p.handlingCost)||0)+(Number(p.printingCost)||0)+(Number(p.otherCharges)||0);
    const quantityReceived = Number(p.quantityReceivedTotal)||0;
    const damaged = Number(p.damagedQuantityTotal)||0;
    const quantityPending = Math.max(0, (Number(p.quantityPurchased)||0) - quantityReceived);
    const acceptedQuantity = Math.max(0, quantityReceived - damaged);
    const purchaseStatus = quantityPending<=0 && quantityReceived>0 ? 'Fully Received' : (quantityReceived>0 ? 'Partially Received' : 'Pending Delivery');
    return { totalPurchaseCost, quantityReceived, damaged, quantityPending, acceptedQuantity, purchaseStatus };
  }

  function linkedPayable(purchaseId){
    return state.payables.find(p=>p.sourceType==='Direct Purchase' && p.sourceId===purchaseId);
  }

  /* ---------------- main dashboard card total ---------------- */
  // (Outstanding Supplier Payables card already covers direct purchases since they share the Payables pool.)

  /* ---------------- filters + page state ---------------- */
  let filters = { supplier:'', product:'', status:'', paymentStatus:'' };

  function visiblePurchases(){
    const ym = state.selectedMonth;
    return state.directPurchases.filter(p=>{
      if(filters.supplier && p.supplierName!==filters.supplier) return false;
      if(filters.product && !(p.productName||'').toLowerCase().includes(filters.product.toLowerCase())) return false;
      if(filters.status && purchaseComputed(p).purchaseStatus!==filters.status) return false;
      if(filters.paymentStatus){
        const pay = linkedPayable(p.id);
        if(!pay || pay.paymentStatus!==filters.paymentStatus) return false;
      }
      return true;
    }).sort((a,b)=> (b.purchaseDate||'').localeCompare(a.purchaseDate||''));
  }

  function computeMonthlySummary(){
    const ym = state.selectedMonth;
    const thisMonth = state.directPurchases.filter(p=>E.inMonth(p.purchaseDate, ym));
    const purchasesThisMonth = thisMonth.length;
    const totalValueThisMonth = thisMonth.reduce((s,p)=>s+purchaseComputed(p).totalPurchaseCost,0);
    let paidThisMonth = 0, outstandingThisMonth = 0;
    thisMonth.forEach(p=>{
      const pay = linkedPayable(p.id);
      if(pay){ paidThisMonth += Number(pay.amountPaid)||0; if(!pay.cancelled) outstandingThisMonth += Number(pay.remainingBalance)||0; }
    });
    const waitingForDelivery = state.directPurchases.filter(p=>purchaseComputed(p).quantityPending>0).length;
    const receivedThisMonth = state.directPurchases.filter(p=>
      (p.receivingHistory||[]).some(r=>E.inMonth(r.date, ym))
    ).length;
    return { purchasesThisMonth, totalValueThisMonth, paidThisMonth, outstandingThisMonth, waitingForDelivery, receivedThisMonth };
  }

  function purchaseStatusPill(status){
    if(status==='Fully Received') return 'green';
    if(status==='Partially Received') return 'orange';
    return 'gray';
  }

  function renderDirectPurchases(container){
    const s = computeMonthlySummary();
    const rows = visiblePurchases();
    const monthLabel = new Date(state.selectedMonth.year, state.selectedMonth.month-1, 1).toLocaleString('en-US',{month:'long', year:'numeric'});

    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Operations</p><h2>Direct Supplier Purchase</h2></div>
        <div class="actions"><button class="btn" id="dp-multi-btn">+ Multi-Item Supplier PO</button><button class="btn primary" id="dp-add-btn">+ Single Direct Purchase</button></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">
        For stock EcoHub buys for itself — no client quotation needed. Use <b>Multi-Item Supplier PO</b> when ordering several products from one supplier; use Single Direct Purchase for detailed one-item entries/receiving. Every saved line automatically creates a linked entry in Supplier Payables.
        Monthly figures below follow the month selected on the main Dashboard (currently <b>${escapeHtml(monthLabel)}</b>).
      </p>

      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="kpi"><div class="lbl">Purchases This Month</div><div class="val">${s.purchasesThisMonth}</div></div>
        <div class="kpi"><div class="lbl">Total Purchase Value (This Month)</div><div class="val">${peso(s.totalValueThisMonth)}</div></div>
        <div class="kpi"><div class="lbl">Total Paid to Suppliers (This Month)</div><div class="val">${peso(s.paidThisMonth)}</div></div>
        <div class="kpi"><div class="lbl">Outstanding Balance (This Month)</div><div class="val">${peso(s.outstandingThisMonth)}</div></div>
        <div class="kpi"><div class="lbl">Products Waiting for Delivery</div><div class="val">${s.waitingForDelivery}</div></div>
        <div class="kpi"><div class="lbl">Received This Month</div><div class="val">${s.receivedThisMonth}</div></div>
      </div>

      <div id="dp-panel-slot"></div>

      <div class="card">
        <h3>Filters</h3>
        <div class="grid" style="grid-template-columns:repeat(4,1fr);">
          <div class="field"><label>Supplier</label><select id="df-supplier"><option value="">All suppliers</option>${state.settings.suppliers.map(s2=>`<option ${s2===filters.supplier?'selected':''}>${escapeHtml(s2)}</option>`).join('')}</select></div>
          <div class="field"><label>Product</label><input id="df-product" value="${escapeHtml(filters.product)}" placeholder="Search product…"></div>
          <div class="field"><label>Purchase Status</label><select id="df-status"><option value="">All</option><option ${filters.status==='Pending Delivery'?'selected':''}>Pending Delivery</option><option ${filters.status==='Partially Received'?'selected':''}>Partially Received</option><option ${filters.status==='Fully Received'?'selected':''}>Fully Received</option></select></div>
          <div class="field"><label>Payment Status</label><select id="df-paystatus"><option value="">All</option>${E.PAYABLE_STATUSES.map(st=>`<option ${st===filters.paymentStatus?'selected':''}>${escapeHtml(st)}</option>`).join('')}</select></div>
        </div>
        <button class="btn small" id="df-clear" style="margin-top:8px;">Clear filters</button>
      </div>

      <div class="card">
        <h3>Purchases (${rows.length})</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Purchase ID</th><th>Date</th><th>Supplier</th><th>Product</th><th>Type</th>
              <th class="num">Qty Purchased</th><th class="num">Received</th><th class="num">Pending</th>
              <th class="num">Total Cost</th><th class="num">Balance</th><th>Payment</th><th>Status</th><th></th>
            </tr></thead>
            <tbody id="dp-body"></tbody>
          </table>
        </div>
      </div>
    `;

    renderPurchaseRows(container);

    E.qs('#dp-multi-btn', container).addEventListener('click', ()=>{ E.navigate('payables'); const host=document.getElementById('main-content'); if(E.openSupplierPOBatch) E.openSupplierPOBatch(host,todayISO()); });
    E.qs('#dp-add-btn', container).addEventListener('click', ()=> E.openDirectPurchasePanel(container, 'form', null));
    E.qs('#df-supplier', container).addEventListener('change', e=>{ filters.supplier=e.target.value; refresh(container); });
    E.qs('#df-product', container).addEventListener('input', e=>{ filters.product=e.target.value; refresh(container); });
    E.qs('#df-status', container).addEventListener('change', e=>{ filters.status=e.target.value; refresh(container); });
    E.qs('#df-paystatus', container).addEventListener('change', e=>{ filters.paymentStatus=e.target.value; refresh(container); });
    E.qs('#df-clear', container).addEventListener('click', ()=>{ filters={supplier:'',product:'',status:'',paymentStatus:''}; renderDirectPurchases(container); });

    if(E._dpPanel) E._renderDpPanel(container);
  }

  function refresh(container){
    renderPurchaseRows(container);
    const h3s = container.querySelectorAll('.card h3');
    if(h3s[1]) h3s[1].textContent = `Purchases (${visiblePurchases().length})`;
  }

  function renderPurchaseRows(container){
    const body = E.qs('#dp-body', container);
    const rows = visiblePurchases();
    body.innerHTML = rows.length ? rows.map(p=>{
      const c = purchaseComputed(p);
      const pay = linkedPayable(p.id);
      return `<tr data-id="${p.id}">
        <td><b>${escapeHtml(p.id)}</b></td>
        <td>${escapeHtml(p.purchaseDate)}</td>
        <td>${escapeHtml(p.supplierName)}</td>
        <td>${escapeHtml(p.productName)}</td>
        <td>${escapeHtml(p.purchaseType)}</td>
        <td class="num">${(Number(p.quantityPurchased)||0).toLocaleString()}</td>
        <td class="num">${c.quantityReceived.toLocaleString()}</td>
        <td class="num">${c.quantityPending.toLocaleString()}</td>
        <td class="num">${peso(c.totalPurchaseCost)}</td>
        <td class="num">${pay?peso(pay.remainingBalance):'—'}</td>
        <td><span class="pill ${pay?({'Fully Paid':'green','Overdue':'red','Cancelled':'gray'}[pay.paymentStatus]||'orange'):'gray'}">${pay?escapeHtml(pay.paymentStatus):'—'}</span></td>
        <td><span class="pill ${purchaseStatusPill(c.purchaseStatus)}">${c.purchaseStatus}</span></td>
        <td style="white-space:nowrap;">
          <button class="btn small" data-edit="${p.id}">Edit</button>
          <button class="btn small" data-receive="${p.id}" ${c.quantityPending<=0?'disabled':''}>Receive</button>
          <button class="btn small" data-history="${p.id}">History</button>
        </td>
      </tr>`;
    }).join('') : `<tr><td colspan="13"><div class="empty-state">No direct supplier purchases yet — click "+ New Direct Purchase" to record one.</div></td></tr>`;

    body.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> E.openDirectPurchasePanel(container, 'form', b.dataset.edit)));
    body.querySelectorAll('[data-receive]').forEach(b=> b.addEventListener('click', ()=> E.openDirectPurchasePanel(container, 'receive', b.dataset.receive)));
    body.querySelectorAll('[data-history]').forEach(b=> b.addEventListener('click', ()=> E.openDirectPurchasePanel(container, 'history', b.dataset.history)));
  }

  E.purchaseComputedPublic = purchaseComputed;
  E.blankDirectPurchase = blankPurchase;
  E.linkedPayableForPurchase = linkedPayable;
  E.PURCHASE_TYPES = PURCHASE_TYPES;
  E.GENERAL_DESTINATION_TYPES = GENERAL_DESTINATION_TYPES;
  E.renderDirectPurchases = renderDirectPurchases;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO } = E;

  function panelState(){ return E._dpPanel; }
  function setPanelState(v){ E._dpPanel = v; }
  E.openDirectPurchasePanel = function(container, type, id){ setPanelState({type, id}); renderPanel(container); };
  E.closeDirectPurchasePanel = function(container){ setPanelState(null); renderPanel(container); };

  function renderPanel(container){
    const slot = E.qs('#dp-panel-slot', container);
    if(!slot) return;
    const p = panelState();
    if(!p){ slot.innerHTML=''; return; }
    if(p.type==='form') return renderFormPanel(container, slot, p.id);
    if(p.type==='receive') return renderReceivePanel(container, slot, p.id);
    if(p.type==='history') return renderHistoryPanel(container, slot, p.id);
  }

  /* ---------------- Add / Edit form ---------------- */
  function renderFormPanel(container, slot, id){
    const editing = id ? state.directPurchases.find(x=>x.id===id) : null;
    const p = editing || E.blankDirectPurchase();
    const products = state.products;
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>${editing ? 'Edit Direct Purchase' : 'New Direct Supplier Purchase'} — ${escapeHtml(p.id)}</h3>
        <div class="grid">
          <div class="field"><label>Purchase Date</label><input id="dp-date" type="date" value="${p.purchaseDate}"></div>
          <div class="field"><label>Supplier Name</label><select id="dp-supplier">${state.settings.suppliers.map(s=>`<option ${s===p.supplierName?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Reference / Receipt No.</label><input id="dp-ref" value="${escapeHtml(p.referenceNumber)}"></div>
          <div class="field"><label>Product Code (existing product)</label><select id="dp-product"><option value="">— none / new item —</option>${products.map(pr=>`<option value="${escapeHtml(pr.code)}" ${pr.code===p.productCode?'selected':''}>${escapeHtml(pr.code)} — ${escapeHtml(pr.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Product Name</label><input id="dp-name" value="${escapeHtml(p.productName)}" placeholder="Kraft Sushi Tray"></div>
          <div class="field"><label>Variant / Size</label><input id="dp-variant" value="${escapeHtml(p.variant)}"></div>
          <div class="field full"><label>Product Description</label><input id="dp-desc" value="${escapeHtml(p.productDescription)}"></div>
          <div class="field"><label>Purchase Type</label><select id="dp-type">${E.PURCHASE_TYPES.map(t=>`<option ${t===p.purchaseType?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select></div>
          <div class="field"><label>Inventory Destination (notes)</label><input id="dp-dest" value="${escapeHtml(p.inventoryDestination)}" placeholder="e.g. Main warehouse, or client name if cup stock"></div>
          <div class="field"><label>Unit</label><select id="dp-unit">${state.settings.units.map(u=>`<option ${u===p.unit?'selected':''}>${escapeHtml(u)}</option>`).join('')}</select></div>
          <div class="field"><label>Quantity Purchased</label><input id="dp-qty" type="number" min="0" value="${p.quantityPurchased}"></div>
          <div class="field"><label>Pieces per Box</label><input id="dp-pieces" type="number" min="0" value="${p.piecesPerBox}"></div>
          <div class="field"><label>Number of Boxes</label><input id="dp-boxes" type="number" min="0" value="${p.numberOfBoxes}"></div>
          <div class="field"><label>Supplier Unit Cost</label><input id="dp-unitcost" type="number" step="0.0001" min="0" value="${p.supplierUnitCost}"></div>
          <div class="field"><label>Cost per Box (info only)</label><input id="dp-costbox" type="number" step="0.01" min="0" value="${p.costPerBox}"></div>
          <div class="field"><label>Shipping Cost</label><input id="dp-ship" type="number" step="0.01" min="0" value="${p.shippingCost}"></div>
          <div class="field"><label>Handling Cost</label><input id="dp-handle" type="number" step="0.01" min="0" value="${p.handlingCost}"></div>
          <div class="field"><label>Printing Cost</label><input id="dp-print" type="number" step="0.01" min="0" value="${p.printingCost}"></div>
          <div class="field"><label>Other Charges</label><input id="dp-other" type="number" step="0.01" min="0" value="${p.otherCharges}"></div>
          <div class="field"><label>Total Purchase Cost</label><input id="dp-total" readonly value="${peso(E.purchaseComputedPublic(p).totalPurchaseCost)}"></div>
          <div class="field"><label>Expected Delivery Date</label><input id="dp-expected" type="date" value="${p.expectedDeliveryDate}"></div>
          <div class="field"><label>Payment Term</label><select id="dp-term">${E.SUPPLIER_PAYMENT_TERMS.map(t=>`<option ${t===(p.paymentTerm||'25 Days')?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select></div>
          <div class="field"><label>Payment Due Date</label><input id="dp-duedate" type="date" value="${p.paymentDueDate}"></div>
          <div class="field full"><label>Remarks</label><textarea id="dp-remarks">${escapeHtml(p.remarks)}</textarea></div>
        </div>
        <p style="font-size:11.5px;color:var(--ink-soft);">Saving will automatically create or update a matching entry in Supplier Payables (Source: Direct Purchase, no quotation required). Payments are recorded from the Supplier Payables page.</p>
        <div class="actions" style="margin-top:10px;">
          <button class="btn" id="dp-cancel">Cancel</button>
          ${editing ? '<button class="btn danger" id="dp-delete">Delete Purchase</button>' : ''}
          <button class="btn primary" id="dp-save">${editing?'Save Changes':'Save Purchase'}</button>
        </div>
      </div>
    `;

    E.qs('#dp-product', container).addEventListener('change', e=>{
      const prod = products.find(pr=>pr.code===e.target.value);
      if(prod){
        E.qs('#dp-name',container).value = prod.name;
        E.qs('#dp-unit',container).value = prod.unit;
        E.qs('#dp-unitcost',container).value = E.productCostPerPiece(prod).toFixed(4);
      }
    });
    const recalcTotalDisplay = ()=>{
      const tmp = {
        quantityPurchased: parseFloat(E.qs('#dp-qty',container).value)||0,
        supplierUnitCost: parseFloat(E.qs('#dp-unitcost',container).value)||0,
        shippingCost: parseFloat(E.qs('#dp-ship',container).value)||0,
        handlingCost: parseFloat(E.qs('#dp-handle',container).value)||0,
        printingCost: parseFloat(E.qs('#dp-print',container).value)||0,
        otherCharges: parseFloat(E.qs('#dp-other',container).value)||0,
      };
      E.qs('#dp-total',container).value = peso(E.purchaseComputedPublic(tmp).totalPurchaseCost);
    };
    ['#dp-qty','#dp-unitcost','#dp-ship','#dp-handle','#dp-print','#dp-other'].forEach(sel=>{
      E.qs(sel, container).addEventListener('input', recalcTotalDisplay);
    });
    const recalcDirectDue=()=>{const term=E.qs('#dp-term',container).value;const d=E.paymentTermDefaultDays(term);E.qs('#dp-duedate',container).value=E.calcDueDate(E.qs('#dp-date',container).value,term,d===null?(Number(p.paymentTermDays)||25):d);};
    E.qs('#dp-date',container).addEventListener('change',recalcDirectDue);
    E.qs('#dp-term',container).addEventListener('change',recalcDirectDue);

    E.qs('#dp-cancel', container).addEventListener('click', ()=> E.closeDirectPurchasePanel(container));
    if(editing){
      E.qs('#dp-delete', container).addEventListener('click', async ()=>{
        if(!confirm(`Delete purchase ${p.id}? Its linked Supplier Payable will also be removed (or cancelled if already paid).`)) return;
        state.directPurchases = state.directPurchases.filter(x=>x.id!==p.id);
        await E.storageDelete('directpurchase:'+p.id);
        await E.removePayableForPurchase(p.id);
        toast('Direct purchase deleted');
        E.closeDirectPurchasePanel(container);
        E.renderDirectPurchases(container);
      });
    }
    E.qs('#dp-save', container).addEventListener('click', async ()=>{
      const name = E.qs('#dp-name',container).value.trim();
      if(!name){ toast('Enter a product name'); return; }
      p.purchaseDate = E.qs('#dp-date',container).value;
      p.supplierName = E.qs('#dp-supplier',container).value;
      p.referenceNumber = E.qs('#dp-ref',container).value;
      p.productCode = E.qs('#dp-product',container).value;
      p.productName = name;
      p.variant = E.qs('#dp-variant',container).value;
      p.productDescription = E.qs('#dp-desc',container).value;
      p.purchaseType = E.qs('#dp-type',container).value;
      p.inventoryDestination = E.qs('#dp-dest',container).value;
      p.unit = E.qs('#dp-unit',container).value;
      p.quantityPurchased = parseFloat(E.qs('#dp-qty',container).value)||0;
      p.piecesPerBox = parseFloat(E.qs('#dp-pieces',container).value)||0;
      p.numberOfBoxes = parseFloat(E.qs('#dp-boxes',container).value)||0;
      p.supplierUnitCost = parseFloat(E.qs('#dp-unitcost',container).value)||0;
      p.costPerBox = parseFloat(E.qs('#dp-costbox',container).value)||0;
      p.shippingCost = parseFloat(E.qs('#dp-ship',container).value)||0;
      p.handlingCost = parseFloat(E.qs('#dp-handle',container).value)||0;
      p.printingCost = parseFloat(E.qs('#dp-print',container).value)||0;
      p.otherCharges = parseFloat(E.qs('#dp-other',container).value)||0;
      p.expectedDeliveryDate = E.qs('#dp-expected',container).value;
      p.paymentTerm = E.qs('#dp-term',container).value;
      { const d=E.paymentTermDefaultDays(p.paymentTerm); p.paymentTermDays=d===null?(Number(p.paymentTermDays)||25):d; }
      p.paymentDueDate = E.qs('#dp-duedate',container).value || E.calcDueDate(p.purchaseDate,p.paymentTerm,p.paymentTermDays);
      p.remarks = E.qs('#dp-remarks',container).value;

      if(!editing) state.directPurchases.unshift(p);
      await E.storageSet('directpurchase:'+p.id, p);
      await E.createOrUpdatePayableFromPurchase(p);
      toast(editing ? 'Purchase updated — Supplier Payable synced' : 'Purchase saved — Supplier Payable created');
      E.closeDirectPurchasePanel(container);
      E.renderDirectPurchases(container);
    });
  }

  /* ---------------- Receive to Inventory (supports partial receiving) ---------------- */
  function renderReceivePanel(container, slot, id){
    const p = state.directPurchases.find(x=>x.id===id);
    if(!p){ slot.innerHTML=''; return; }
    const c = E.purchaseComputedPublic(p);
    const targetsGeneralInventory = p.productCode && E.GENERAL_DESTINATION_TYPES.includes(p.purchaseType);
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>Receive to Inventory — ${escapeHtml(p.id)} (${escapeHtml(p.productName)})</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">
          Ordered: <b>${(Number(p.quantityPurchased)||0).toLocaleString()}</b> ·
          Received so far: <b>${c.quantityReceived.toLocaleString()}</b> ·
          Pending: <b>${c.quantityPending.toLocaleString()}</b>
        </p>
        ${targetsGeneralInventory
          ? `<p style="font-size:11.5px;color:var(--ink-soft);">Accepted quantity will be added to <b>${escapeHtml(p.productCode)}</b> in general Inventory.</p>`
          : (p.purchaseType==='Client-Specific Cup Stock'
              ? `<p style="font-size:11.5px;color:#8A5A16;background:var(--orange-bg);padding:6px 8px;border-radius:6px;">This is Client-Specific Cup Stock — receiving here logs the delivery on this purchase, but you'll need to add/adjust the matching entry in the Cup Stock Inventory module yourself (no linked product code to auto-route to general Inventory).</p>`
              : `<p style="font-size:11.5px;color:var(--ink-soft);">No matching Product Code selected — this receiving event will be logged on the purchase only, not applied to general Inventory.</p>`)
        }
        <div class="grid">
          <div class="field"><label>Delivery Date</label><input id="rc-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Quantity Received (this delivery)</label><input id="rc-qty" type="number" min="0" max="${c.quantityPending}" value="0"></div>
          <div class="field"><label>Damaged / Missing (this delivery)</label><input id="rc-damaged" type="number" min="0" value="0"></div>
          <div class="field full"><label>Note</label><input id="rc-note" placeholder="Optional"></div>
        </div>
        <div class="actions" style="margin-top:10px;">
          <button class="btn" id="rc-cancel">Cancel</button>
          <button class="btn primary" id="rc-save">Confirm Receipt</button>
        </div>
      </div>
    `;
    E.qs('#rc-cancel', container).addEventListener('click', ()=> E.closeDirectPurchasePanel(container));
    E.qs('#rc-save', container).addEventListener('click', async ()=>{
      const qty = parseFloat(E.qs('#rc-qty',container).value)||0;
      const damaged = parseFloat(E.qs('#rc-damaged',container).value)||0;
      if(qty<=0){ toast('Enter a received quantity greater than zero'); return; }
      if(qty>c.quantityPending){ toast(`Only ${c.quantityPending.toLocaleString()} units are still pending delivery`); return; }
      if(damaged>qty){ toast('Damaged quantity cannot exceed the quantity received'); return; }
      const date = E.qs('#rc-date',container).value;
      const note = E.qs('#rc-note',container).value;

      p.receivingHistory.unshift({ id: uid('rcv'), date, qtyReceived: qty, qtyDamaged: damaged, note });
      p.quantityReceivedTotal = (Number(p.quantityReceivedTotal)||0) + qty;
      p.damagedQuantityTotal = (Number(p.damagedQuantityTotal)||0) + damaged;
      p.actualDeliveryDate = date;
      await E.storageSet('directpurchase:'+p.id, p);

      if(targetsGeneralInventory){
        const accepted = qty - damaged;
        const inv = state.inventory[p.productCode] || (state.inventory[p.productCode] = {code:p.productCode,beginningStock:0,stockIn:0,returns:0,stockOut:0,reserved:0,damaged:0,reorderLevel:100,movements:[]});
        inv.stockIn = (Number(inv.stockIn)||0) + accepted;
        inv.damaged = (Number(inv.damaged)||0) + damaged;
        if(!Array.isArray(inv.movements)) inv.movements = [];
        inv.movements.unshift({
          id: uid('mv'), date, type:'Stock In (Direct Purchase)', qty: accepted, damagedQty: damaged,
          note: `From ${p.id} — ${p.supplierName}${note?': '+note:''}`
        });
        await E.storageSet('inventory:'+p.productCode, inv);
      }

      toast('Receipt confirmed — inventory updated');
      E.closeDirectPurchasePanel(container);
      E.renderDirectPurchases(container);
    });
  }

  /* ---------------- History ---------------- */
  function renderHistoryPanel(container, slot, id){
    const p = state.directPurchases.find(x=>x.id===id);
    if(!p){ slot.innerHTML=''; return; }
    slot.innerHTML = `
      <div class="card" style="border-color:var(--sage);">
        <h3>Receiving History — ${escapeHtml(p.id)} (${escapeHtml(p.productName)})</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Date</th><th class="num">Qty Received</th><th class="num">Qty Damaged</th><th class="num">Accepted</th><th>Note</th></tr></thead>
            <tbody>
              ${(p.receivingHistory&&p.receivingHistory.length) ? p.receivingHistory.map(h=>`
                <tr>
                  <td>${escapeHtml(h.date)}</td>
                  <td class="num">${h.qtyReceived}</td>
                  <td class="num">${h.qtyDamaged}</td>
                  <td class="num">${h.qtyReceived-h.qtyDamaged}</td>
                  <td>${escapeHtml(h.note||'')}</td>
                </tr>
              `).join('') : `<tr><td colspan="5"><div class="empty-state">No deliveries received yet.</div></td></tr>`}
            </tbody>
          </table>
        </div>
        <div class="actions" style="margin-top:14px;"><button class="btn" id="rh-close">Close</button></div>
      </div>
    `;
    E.qs('#rh-close', container).addEventListener('click', ()=> E.closeDirectPurchasePanel(container));
  }

  E._renderDpPanel = renderPanel;
})();
</script>







<script>
/* =====================================================================
   VERIFIED FINANCIAL POSITION — one-time reconciliation as of 2026-08-07.
   Does NOT rewrite product costs or inventory quantities. It stores a transparent
   inventory-value reconciliation adjustment and one cash-ledger adjustment, then
   archives only the pre-reset supplier obligations the owner confirmed as paid.
===================================================================== */
(function(){
  "use strict";
  const E=window.__ecohub, state=E.state;
  const RESET_VERSION='verified-position-2026-08-07-v1';
  const RESET_DATE='2026-08-07';
  const VERIFIED_CASH_ON_HAND=62007;
  const VERIFIED_INVENTORY_VALUE=337993;
  const CASH_RESET_LEDGER_ID='cl-financial-reset-20260807';

  function rawInventoryPosition(){
    const general=(state.products||[]).reduce((sum,p)=>{
      const inv=state.inventory[p.code];
      if(!inv) return sum;
      return sum + Math.max(0,E.availableStock(inv))*E.productCostPerPiece(p);
    },0);
    const cup=E.computeCupStockCardValue ? E.computeCupStockCardValue() : 0;
    return {general,cup,total:general+cup};
  }
  function inventoryValueAdjustment(){
    const fp=state.settings && state.settings.financialPosition;
    return fp ? (Number(fp.inventoryValueAdjustment)||0) : 0;
  }
  function currentInventoryValue(){ return rawInventoryPosition().total + inventoryValueAdjustment(); }

  async function applyVerifiedFinancialPosition(options){
    options=options||{}; const persist=options.persist!==false;
    state.settings.financialPosition=state.settings.financialPosition||{};
    const fp=state.settings.financialPosition;
    if(fp.resetVersion===RESET_VERSION) return {applied:false, financialPosition:fp};

    const raw=rawInventoryPosition();
    fp.resetVersion=RESET_VERSION; fp.asOf=RESET_DATE;
    fp.verifiedCashOnHand=VERIFIED_CASH_ON_HAND; fp.verifiedInventoryValue=VERIFIED_INVENTORY_VALUE;
    fp.rawInventoryValueAtReset=raw.total;
    fp.inventoryValueAdjustment=VERIFIED_INVENTORY_VALUE-raw.total;
    fp.note='Owner-verified financial position baseline. Underlying inventory quantities and product costing were not changed.';

    const qByNo=new Map((state.quotations||[]).map(q=>[q.number,q]));
    let archivedPayables=0;
    for(const pay of (state.payables||[])){
      if(!pay || pay.cancelled || pay.archived || pay.historicalSettled) continue;
      let settle=false;
      if(pay.sourceType==='Direct Purchase'){
        settle=!pay.quotationDate || pay.quotationDate<=RESET_DATE;
      } else if(pay.quotationNumber){
        const q=qByNo.get(pay.quotationNumber);
        if(!q) settle=true;
        else settle=(q.orderStatus==='Completed' || q.orderStatus==='Cancelled' || E.CANCELLED_QUOTATION_STATUSES.includes(q.quotationStatus));
      }
      if(!settle) continue;
      pay.historicalSettled=true; pay.archived=true; pay.historicalSettledDate=RESET_DATE;
      pay.amountPaid=Number(pay.totalSupplierCost)||0; pay.remainingBalance=0; pay.paymentStatus='Fully Paid';
      pay.remarks=(pay.remarks?pay.remarks+' | ':'')+'Financial reset 2026-08-07: confirmed already paid; excluded from current outstanding supplier payables.';
      archivedPayables++;
      if(persist) await E.storageSet('payable:'+pay.id,pay);
    }

    const existing=state.cashLedger.find(e=>e.id===CASH_RESET_LEDGER_ID);
    const baseCash=(state.cashLedger||[]).reduce((sum,e)=>{
      if(!e || e.id===CASH_RESET_LEDGER_ID || e.account!=='Cash on Hand') return sum;
      return sum+(Number(e.cashIn)||0)-(Number(e.cashOut)||0);
    },0);
    const delta=VERIFIED_CASH_ON_HAND-baseCash;
    const entry=existing || {id:CASH_RESET_LEDGER_ID,date:RESET_DATE,time:'13:26',transactionType:'Cash Adjustment',source:'Verified Financial Position',referenceNumber:'FP-2026-08-07',clientOrSupplier:'',account:'Cash on Hand',cashIn:0,cashOut:0,recordedBy:'Owner verification',remarks:'',createdAt:'2026-08-07T13:26:00+08:00',history:[]};
    entry.date=RESET_DATE; entry.account='Cash on Hand'; entry.transactionType='Cash Adjustment'; entry.source='Verified Financial Position';
    entry.cashIn=delta>0?delta:0; entry.cashOut=delta<0?Math.abs(delta):0;
    entry.remarks='One-time reconciliation so Cash on Hand equals the owner-verified ₱62,007 as of August 7, 2026. Historical supplier payments before this baseline are not double-counted.';
    if(!existing) state.cashLedger.push(entry);
    if(persist){ await E.storageSet('settings:main',state.settings); await E.storageSet('cashledger:'+entry.id,entry); }
    return {applied:true, archivedPayables, inventoryAdjustment:fp.inventoryValueAdjustment, cashAdjustment:delta, financialPosition:fp};
  }

  E.rawInventoryPosition=rawInventoryPosition;
  E.inventoryValueAdjustment=inventoryValueAdjustment;
  E.currentInventoryValue=currentInventoryValue;
  E.applyVerifiedFinancialPosition=applyVerifiedFinancialPosition;
})();
</script>

<script>
(function(){
  "use strict";
  const E=window.__ecohub;
  const {state,escapeHtml,peso,toast,uid,todayISO}=E;
  let editingId='';
  let searchText='';
  let tierFilter='All';

  function activeQuotation(q){
    return q && q.orderStatus!=='Cancelled' && !['Cancelled','Declined','Expired'].includes(q.quotationStatus);
  }
  function completedQuotation(q){ return q && q.orderStatus==='Completed'; }
  function relatedQuotations(c){ return (state.quotations||[]).filter(q=>E.clientMatchesQuotation(c,q)); }
  function computeClientStats(c){
    const related=relatedQuotations(c);
    const orders=related.filter(activeQuotation);
    const completed=related.filter(completedQuotation);
    const totalSales=completed.reduce((s,q)=>s+(E.quotationTotals?E.quotationTotals(q).grand:0),0);
    const quotedValue=orders.reduce((s,q)=>s+(E.quotationTotals?E.quotationTotals(q).grand:0),0);
    const dates=orders.map(q=>q.date).filter(Boolean).sort();
    const lastOrder=dates.length?dates[dates.length-1]:'';
    const completedOrders=completed.length;
    let tier='No Orders';
    if(completedOrders>=5 || totalSales>=50000) tier='Top Client';
    else if(completedOrders>=2) tier='Repeat Client';
    else if(completedOrders===1) tier='Active Client';
    else if(orders.length) tier='Prospect';
    return {orders:orders.length,completedOrders,totalSales,quotedValue,lastOrder,avgOrder:completedOrders?totalSales/completedOrders:0,tier};
  }
  function tierClass(t){ return t==='Top Client'?'green':(t==='Repeat Client'||t==='Active Client'?'orange':'gray'); }

  async function saveClient(c){
    E.ensureClientShape(c); c.updatedAt=new Date().toISOString();
    const i=state.clients.findIndex(x=>x.id===c.id);
    if(i>=0) state.clients[i]=c; else state.clients.push(c);
    state.clients.sort((a,b)=>E.clientDisplayName(a).localeCompare(E.clientDisplayName(b)));
    await E.storageSet('client:'+c.id,c);
    return c;
  }

  async function upsertClientFromQuotation(q){
    let c=q.clientId ? state.clients.find(x=>x.id===q.clientId) : E.findClientForQuotation(q);
    if(!c){ c=E.ensureClientShape({id:uid('cli'),createdAt:new Date().toISOString()}); }
    c.companyName=String(q.company||'').trim();
    c.contactPerson=String(q.customer||'').trim();
    c.contactDetails=String(q.contact||'').trim();
    c.address=String(q.address||'').trim();
    c.preferredTerms=String(q.terms||'').trim();
    c.salesperson=String(q.salesperson||'').trim();
    if(!c.status) c.status='Active';
    await saveClient(c); q.clientId=c.id;
    return c;
  }

  function blankClient(){
    return E.ensureClientShape({id:uid('cli'),companyName:'',contactPerson:'',contactDetails:'',address:'',preferredTerms:'',salesperson:state.settings.salespersons[0]||'',status:'Active',tags:'',notes:'',createdAt:new Date().toISOString()});
  }

  function filteredClients(){
    const q=E.normalizeClientName(searchText);
    return (state.clients||[]).map(c=>({c,stats:computeClientStats(c)})).filter(x=>{
      if(tierFilter!=='All' && x.stats.tier!==tierFilter) return false;
      if(!q) return true;
      const hay=E.normalizeClientName([x.c.companyName,x.c.contactPerson,x.c.contactDetails,x.c.address,x.c.tags,x.c.notes].join(' '));
      return hay.includes(q);
    }).sort((a,b)=> b.stats.totalSales-a.stats.totalSales || b.stats.orders-a.stats.orders || E.clientDisplayName(a.c).localeCompare(E.clientDisplayName(b.c)));
  }

  function renderClientForm(container,c,isNew){
    const stats=computeClientStats(c);
    container.innerHTML=`
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Client Database</p><h2>${isNew?'Add Client':escapeHtml(E.clientDisplayName(c))}</h2></div>
        <div class="actions"><button class="btn" id="cl-back">← Back to clients</button>${!isNew?'<button class="btn danger" id="cl-delete">Delete Client</button>':''}<button class="btn primary" id="cl-save">Save Client</button></div>
      </div>
      ${!isNew?`<div class="kpi-grid">
        <div class="kpi"><div class="lbl">Orders</div><div class="val">${stats.orders}</div></div>
        <div class="kpi"><div class="lbl">Completed Sales</div><div class="val">${peso(stats.totalSales)}</div></div>
        <div class="kpi"><div class="lbl">Average Completed Order</div><div class="val">${peso(stats.avgOrder)}</div></div>
        <div class="kpi"><div class="lbl">Client Tier</div><div class="val" style="font-family:inherit;font-size:17px;">${escapeHtml(stats.tier)}</div></div>
      </div>`:''}
      <div class="card">
        <h3>Client Information</h3>
        <div class="grid">
          <div class="field"><label>Company / Business Name</label><input id="cl-company" value="${escapeHtml(c.companyName)}" placeholder="e.g. Sabana Cafe"></div>
          <div class="field"><label>Contact Person</label><input id="cl-person" value="${escapeHtml(c.contactPerson)}" placeholder="Owner / purchasing contact"></div>
          <div class="field"><label>Phone / Email</label><input id="cl-contact" value="${escapeHtml(c.contactDetails)}" placeholder="09xx... / email"></div>
          <div class="field full"><label>Address</label><input id="cl-address" value="${escapeHtml(c.address)}" placeholder="Delivery / billing address"></div>
          <div class="field"><label>Preferred Payment Terms</label><input id="cl-terms" value="${escapeHtml(c.preferredTerms)}" placeholder="e.g. 50% DP, balance on delivery"></div>
          <div class="field"><label>Default Salesperson</label><select id="cl-salesperson"><option value="">— None —</option>${state.settings.salespersons.map(s=>`<option ${s===c.salesperson?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Client Status</label><select id="cl-status">${['Active','Inactive','Prospect','On Hold'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field full"><label>Tags / Categories</label><input id="cl-tags" value="${escapeHtml(c.tags)}" placeholder="e.g. Cafe, Printed Cups, Wholesale, VIP"></div>
          <div class="field full"><label>Custom Notes / Information</label><textarea id="cl-notes" placeholder="Preferences, usual orders, delivery instructions, special pricing, etc.">${escapeHtml(c.notes)}</textarea></div>
        </div>
        <p style="font-size:11px;color:var(--ink-soft);margin:12px 0 0;">Editing this profile changes future auto-fill details only. Old quotations stay unchanged as transaction history.</p>
      </div>
      ${!isNew?renderClientOrders(c):''}
    `;
    E.qs('#cl-back',container).addEventListener('click',()=>{editingId='';renderClients(container);});
    E.qs('#cl-save',container).addEventListener('click',async()=>{
      c.companyName=E.qs('#cl-company',container).value.trim(); c.contactPerson=E.qs('#cl-person',container).value.trim();
      c.contactDetails=E.qs('#cl-contact',container).value.trim(); c.address=E.qs('#cl-address',container).value.trim();
