<style>
  :root{
    --ink:#1F3D2B; --ink-soft:#3F5A46; --sage:#A9BFA3; --sage-light:#E9EFE5;
    --kraft:#9C7A54; --kraft-dark:#7A5D3F; --cream:#FFFDF8; --paper:#FBF8F1;
    --line:#DCD3C2; --red:#B3564A; --red-bg:#F7E7E4; --orange:#C08A3E; --orange-bg:#FBF0DD;
    --green-bg:#E3EFDD; --gray-bg:#EAE6DD;
    --shadow:0 1px 2px rgba(31,61,43,.06),0 4px 14px rgba(31,61,43,.06);
    --radius:10px; --mono:'SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  #app-root{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    background:var(--paper); color:var(--ink); margin:0; min-height:100%; font-size:14px; line-height:1.45;
  }
  #app-root button{font-family:inherit; cursor:pointer;}
  #app-root table{border-collapse:collapse;}
  .shell{display:grid; grid-template-columns:230px 1fr; min-height:100vh;}
  @media (max-width:900px){ .shell{grid-template-columns:76px 1fr;} .nav-label{display:none;} .brand-text{display:none;} }

  /* ---------- sidebar ---------- */
  .side{background:var(--ink); color:var(--sage-light); padding:18px 12px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:9px; padding:2px 6px 16px;}
  .brand .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#C9DFC0,#8FAF83);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:14px;flex:none;}
  .brand-text h1{font-size:14px;margin:0;font-weight:700;color:#fff;}
  .brand-text p{margin:0;font-size:9.5px;color:var(--sage);letter-spacing:.05em;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; color:var(--sage-light); font-size:13px; font-weight:600; background:none; border:none; text-align:left; width:100%; transition:.12s;}
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:rgba(255,255,255,.16); color:#fff;}
  .nav-icon{font-size:15px; width:18px; text-align:center; flex:none;}
  .nav-divider{height:1px; background:rgba(255,255,255,.1); margin:8px 4px;}
  .nav-section-label{font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--sage); padding:10px 10px 2px; font-weight:700;}

  /* ---------- main ---------- */
  .main{padding:22px 28px 60px; max-width:1180px;}
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .titleblock .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--kraft); font-weight:700; margin:0 0 2px;}
  .titleblock h2{margin:0; font-size:22px; font-family:Georgia,'Times New Roman',serif; color:var(--ink);}
  .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{border:1px solid var(--line); background:#fff; color:var(--ink); padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:.15s;}
  .btn:hover{border-color:var(--sage); background:var(--sage-light);}
  .btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn.primary:hover{background:var(--ink-soft);}
  .btn.danger{color:var(--red); border-color:var(--red-bg);}
  .btn.danger:hover{background:var(--red-bg);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.small{padding:5px 9px; font-size:12px;}
  .toast{position:fixed; bottom:18px; right:18px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); opacity:0; transform:translateY(6px); transition:.2s; pointer-events:none; z-index:80;}
  .toast.show{opacity:1; transform:translateY(0);}

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:18px;}
  .card h3{margin:0 0 14px; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--kraft); font-weight:700;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .grid .full{grid-column:1/-1;}
  @media (max-width:760px){ .grid{grid-template-columns:1fr 1fr;} }
  .field label{display:block; font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; background:var(--cream); color:var(--ink); font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--sage); outline-offset:1px; border-color:var(--sage);}
  .field input[readonly]{background:var(--sage-light); color:var(--ink); font-family:var(--mono); font-weight:700;}
  .field textarea{resize:vertical; min-height:52px;}

  .view{display:none;}
  .view.active{display:block;}

  .pill{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
  .pill.green{background:var(--green-bg); color:#2C5A2C;}
  .pill.orange{background:var(--orange-bg); color:#8A5A16;}
  .pill.red{background:var(--red-bg); color:#8A2E24;}
  .pill.gray{background:var(--gray-bg); color:#5C5648;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
  @media (max-width:900px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .kpi .lbl{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px;}
  .kpi .val{font-size:20px; font-weight:800; color:var(--kraft); font-family:var(--mono);}

  .table-wrap{overflow-x:auto;}
  table.data{width:100%; font-size:13px;}
  table.data thead th{text-align:left; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); border-bottom:2px solid var(--ink); padding:0 8px 8px; font-weight:700; white-space:nowrap;}
  table.data tbody td{padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.data tbody tr:hover{background:var(--sage-light);}
  table.data td.num{text-align:right; font-family:var(--mono);}
  table.data td input, table.data td select{width:100%; border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-size:12.5px; background:var(--cream);}
  .empty-state{text-align:center; padding:34px 10px; color:var(--ink-soft); font-size:13px;}
  .row-del{width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--red); font-size:13px; line-height:1; display:inline-flex; align-items:center; justify-content:center;}
  .row-del:hover{background:var(--red-bg); border-color:var(--red-bg);}

  .chart-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media (max-width:900px){ .chart-grid{grid-template-columns:1fr;} }
  .chart-card canvas{max-height:230px;}

  .tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .tag-chip{display:inline-flex; align-items:center; gap:6px; background:var(--sage-light); border:1px solid var(--line); padding:4px 8px 4px 10px; border-radius:99px; font-size:12px;}
  .tag-chip button{background:none; border:none; color:var(--ink-soft); font-size:13px; line-height:1;}
</style>

  function storageApiPresent(){
    if(SUPABASE_CONFIGURED) return !!supabaseClient;
    return platformStoragePresent() || localStoragePresent();
  }

  async function storageGet(key){
    if(supabaseClient){
      try{
        const { data, error } = await supabaseClient.from(KV_TABLE).select('value').eq('key', key).maybeSingle();
        if(error) throw error;
        return data ? data.value : null;
      }catch(e){ console.error('supabase get failed', key, e); return null; }
    }
    if(platformStoragePresent()){
      try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
      catch(e){ console.error('platform storage get failed', key, e); }
    }
    if(localStoragePresent()){
      try{
        const raw = window.localStorage.getItem(LOCAL_STORAGE_PREFIX + key);
        return raw===null ? null : JSON.parse(raw);
      }catch(e){ console.error('localStorage get failed', key, e); }
    }
    return null;
  }
  async function storageSet(key, obj){
    if(supabaseClient){
      try{
        const { error } = await supabaseClient.from(KV_TABLE).upsert({ key, value: obj });
        if(error) throw error;
        return true;
      }catch(e){
        console.error('supabase set failed', key, e);
        if(!_storageWarned){ toast('Save failed — check your connection or Supabase setup.'); _storageWarned = true; }
        return false;
      }
    }
    if(platformStoragePresent()){
      try{ await window.storage.set(key, JSON.stringify(obj)); return true; }
      catch(e){ console.error('platform storage set failed', key, e); }
    }
    if(localStoragePresent()){
      try{ window.localStorage.setItem(LOCAL_STORAGE_PREFIX + key, JSON.stringify(obj)); return true; }
      catch(e){ console.error('localStorage set failed', key, e); }
    }
    if(!_storageWarned){
      toast('Save failed — browser storage is unavailable. Export a backup before closing.');
      _storageWarned = true;
    }
    return false;
  }
  async function storageDelete(key){
    if(supabaseClient){
      try{ const { error } = await supabaseClient.from(KV_TABLE).delete().eq('key', key); if(error) throw error; return true; }
      catch(e){ console.error('supabase delete failed', key, e); return false; }
    }
    if(platformStoragePresent()){
      try{ await window.storage.delete(key); return true; }
      catch(e){ console.error('platform storage delete failed', key, e); }
    }
    if(localStoragePresent()){
      try{ window.localStorage.removeItem(LOCAL_STORAGE_PREFIX + key); return true; }
      catch(e){ console.error('localStorage delete failed', key, e); }
    }
    return false;
  }
  async function storageListKeys(prefix){
    if(supabaseClient){
      try{
        let q = supabaseClient.from(KV_TABLE).select('key');
        if(prefix) q = q.like('key', prefix+'%');
        const { data, error } = await q;
        if(error) throw error;
        return (data||[]).map(r=>r.key);
      }catch(e){ console.error('supabase list failed', prefix, e); return []; }
    }
    if(platformStoragePresent()){
      try{ const r = await window.storage.list(prefix); return (r && r.keys) || []; }
      catch(e){ console.error('platform storage list failed', prefix, e); }
    }
    if(localStoragePresent()){
      try{
        const keys = [];
        for(let i=0;i<window.localStorage.length;i++){
          const rawKey = window.localStorage.key(i);
          if(!rawKey || !rawKey.startsWith(LOCAL_STORAGE_PREFIX)) continue;
          const key = rawKey.slice(LOCAL_STORAGE_PREFIX.length);
          if(!prefix || key.startsWith(prefix)) keys.push(key);
        }
        return keys;
      }catch(e){ console.error('localStorage list failed', prefix, e); }
    }
    return [];
  }

  async function loadAll(){
    const s = await storageGet('settings:main');
    if(s) state.settings = Object.assign({}, DEFAULT_SETTINGS, s);
    else await storageSet('settings:main', state.settings);

    const pKeys = await storageListKeys('product:');
    if(pKeys.length===0){
      state.products = SEED_PRODUCTS.map(p=>Object.assign({}, p));
      for(const p of state.products) await storageSet('product:'+p.code, p);
    } else {
      state.products = [];
      for(const k of pKeys){ const v = await storageGet(k); if(v) state.products.push(v); }
      state.products.sort((a,b)=>a.code.localeCompare(b.code));
    }
    // backfill fields added by later features so old saved products don't break new UI
    state.products.forEach(p=>{
      if(p.supplier===undefined) p.supplier = state.settings.suppliers[0] || '';
      if(p.directSupplierOrder===undefined) p.directSupplierOrder = false;
    });

    const iKeys = await storageListKeys('inventory:');
    state.inventory = {};
    for(const k of iKeys){ const v = await storageGet(k); if(v) state.inventory[v.code] = v; }
    // ensure every product has an inventory record
    for(const p of state.products){
      if(!state.inventory[p.code]){
        state.inventory[p.code] = {code:p.code, beginningStock:0, stockIn:0, returns:0, stockOut:0, reserved:0, damaged:0, reorderLevel:100, movements:[]};
      }
    }
    Object.values(state.inventory).forEach(inv=>{
      if(!Array.isArray(inv.movements)) inv.movements = [];
      if(inv.returns===undefined) inv.returns = 0; // backfill for records saved before Returns was tracked
    });

    const qKeys = await storageListKeys('quotation:');
    state.quotations = [];
    for(const k of qKeys){ const v = await storageGet(k); if(v) state.quotations.push(v); }
    state.quotations.sort((a,b)=> b.number.localeCompare(a.number));
    state.quotations.forEach(q=>{
      if(!Array.isArray(q.payments)) q.payments = [];
      if(q.clientId===undefined) q.clientId = '';
      if(q.paymentDueDate===undefined) q.paymentDueDate = '';
      if(q.expectedCompletionDate===undefined) q.expectedCompletionDate = '';
      if(!q.lastUpdated) q.lastUpdated = q.date || todayISO();
      // backfill inventory-first fulfillment fields for quotation items saved before this feature
      (q.items||[]).forEach(it=>{
        if(it.fulfillmentSource===undefined) it.fulfillmentSource = 'Automatic';
        if(it.mixQtyInventory===undefined) it.mixQtyInventory = 0;
        if(it.isService===undefined) it.isService = false;
        if(it.excessAllocation===undefined) it.excessAllocation = 'Add Excess to General Inventory';
        if(it._deductedQty===undefined) it._deductedQty = 0;
        if(it._deductedCode===undefined) it._deductedCode = '';
        if(it._resolvedSource===undefined) it._resolvedSource = '';
      });
    });

    const clientKeys = await storageListKeys('client:');
    state.clients = [];
    for(const k of clientKeys){ const v = await storageGet(k); if(v) state.clients.push(ensureClientShape(v)); }
    state.clients.sort((a,b)=> clientDisplayName(a).localeCompare(clientDisplayName(b)));
    // First CRM launch: build a starter client database from names already used in quotations.
    if(state.clients.length===0) await seedClientsFromQuotations(true);

    const eKeys = await storageListKeys('expense:');
    state.expenses = [];
    for(const k of eKeys){ const v = await storageGet(k); if(v) state.expenses.push(v); }
    state.expenses.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

    const payKeys = await storageListKeys('payable:');
    state.payables = [];
    for(const k of payKeys){ const v = await storageGet(k); if(v) state.payables.push(v); }
    // Payment-term backfill: the credit clock starts from the Supplier Order / PO date,
    // never from the customer quotation date. Old records remain untouched unless fields are missing.
    state.payables.forEach(pay=>{
      if(!pay.paymentTerm) pay.paymentTerm = '25 Days';
      if(pay.paymentTermDays===undefined || pay.paymentTermDays===null){
        const d = paymentTermDefaultDays(pay.paymentTerm);
        pay.paymentTermDays = d===null ? 25 : d;
      }
      if(pay.dateOrderedFromSupplier===undefined) pay.dateOrderedFromSupplier = '';
      if(pay.paymentDueDate===undefined) pay.paymentDueDate = '';
      if(!pay.purchaseStage) pay.purchaseStage = pay.dateOrderedFromSupplier ? 'Ordered from Supplier' : 'For Purchase';
      if(pay.dateOrderedFromSupplier && !pay.paymentDueDate){
        const days = pay.paymentTerm==='Custom Terms' ? (Number(pay.paymentTermDays)||0) : (paymentTermDefaultDays(pay.paymentTerm)||0);
        const dt = new Date(pay.dateOrderedFromSupplier+'T00:00:00');
        if(!Number.isNaN(dt.getTime())){ dt.setDate(dt.getDate()+days); pay.paymentDueDate = dt.toISOString().slice(0,10); }
      }
    });
    state.payables.sort((a,b)=> (b.quotationDate||'').localeCompare(a.quotationDate||''));

    const spKeys = await storageListKeys('supplierPayment:');
    state.supplierPayments = [];
    for(const k of spKeys){ const v = await storageGet(k); if(v) state.supplierPayments.push(v); }
    state.supplierPayments.sort((a,b)=> (b.paymentDate||'').localeCompare(a.paymentDate||''));

    const csKeys = await storageListKeys('cupstock:');
    state.cupStock = [];
    for(const k of csKeys){ const v = await storageGet(k); if(v) state.cupStock.push(v); }
    state.cupStock.sort((a,b)=> (b.dateAdded||'').localeCompare(a.dateAdded||''));

    const dpKeys = await storageListKeys('directpurchase:');
    state.directPurchases = [];
    for(const k of dpKeys){ const v = await storageGet(k); if(v) state.directPurchases.push(v); }
    state.directPurchases.sort((a,b)=> (b.purchaseDate||'').localeCompare(a.purchaseDate||''));

    const spKeys2 = await storageListKeys('supplierprofile:');
    state.supplierProfiles = [];
    for(const k of spKeys2){ const v = await storageGet(k); if(v) state.supplierProfiles.push(v); }

    const clKeys = await storageListKeys('cashledger:');
    state.cashLedger = [];
    for(const k of clKeys){ const v = await storageGet(k); if(v) state.cashLedger.push(v); }
    state.cashLedger.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));

    await repairStateData(true);

    const savedMonth = await storageGet('ui:selectedMonth');
    if(savedMonth && savedMonth.year && savedMonth.month) state.selectedMonth = savedMonth;

    state.ready = true;
  }

  /* =====================================================================
     UTILITIES
  ===================================================================== */
  const $ = (sel, root) => (root||document).querySelector('#'+sel);
  const qs = (sel, root) => (root||document).querySelector(sel);
  const qsa = (sel, root) => Array.from((root||document).querySelectorAll(sel));
  const peso = (n) => '₱' + (Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2, maximumFractionDigits:2});
  const todayISO = () => new Date().toISOString().slice(0,10);
  const addDays = (iso, d) => { const dt = new Date(iso); dt.setDate(dt.getDate()+d); return dt.toISOString().slice(0,10); };
  const monthKey = (iso) => iso ? iso.slice(0,7) : '';
  const monthLabel = (iso) => iso ? new Date(iso+'T00:00:00').toLocaleString('en-US',{month:'short', year:'2-digit'}) : '';
  function escapeHtml(s){
    return (s==null ? '' : String(s)).replace(/[&<>"']/g, ch => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]
    ));
  }
  function toast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
  }
  function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  // Storage keys can't contain whitespace, / \ or quotes. Anything user-typed that becomes
  // part of a key (e.g. Product Code) must be sanitized or saves silently fail.
  function sanitizeKeyPart(s){
    return String(s==null?'':s).trim().replace(/[\s\/\\'"]+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
  }

  /* ---------------- Client CRM helpers ---------------- */
  function normalizeClientName(s){
    return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  }
  function clientDisplayName(c){ return String((c&&c.companyName)||(c&&c.contactPerson)||'Unnamed Client').trim(); }
  function ensureClientShape(c){
    c = c && typeof c==='object' ? c : {};
    if(!c.id) c.id=uid('cli');
    if(c.companyName===undefined) c.companyName='';
    if(c.contactPerson===undefined) c.contactPerson='';
    if(c.contactDetails===undefined) c.contactDetails='';
    if(c.address===undefined) c.address='';
    if(c.preferredTerms===undefined) c.preferredTerms='';
    if(c.salesperson===undefined) c.salesperson='';
    if(c.status===undefined) c.status='Active';
    if(c.tags===undefined) c.tags='';
    if(c.notes===undefined) c.notes='';
    if(c.createdAt===undefined) c.createdAt=new Date().toISOString();
    if(c.updatedAt===undefined) c.updatedAt=c.createdAt;
    return c;
  }
  function findClientForQuotation(q){
    if(!q) return null;
    if(q.clientId){ const byId=state.clients.find(c=>c.id===q.clientId); if(byId) return byId; }
    const qKeys=[q.company,q.customer].map(normalizeClientName).filter(Boolean);
    if(!qKeys.length) return null;
    return state.clients.find(c=>{
      const cKeys=[c.companyName,c.contactPerson].map(normalizeClientName).filter(Boolean);
      return cKeys.some(k=>qKeys.includes(k));
    }) || null;
  }
  function clientMatchesQuotation(c,q){
    if(!c||!q) return false;
    if(q.clientId && q.clientId===c.id) return true;
    const cKeys=[c.companyName,c.contactPerson].map(normalizeClientName).filter(Boolean);
    const qKeys=[q.company,q.customer].map(normalizeClientName).filter(Boolean);
    return cKeys.some(k=>qKeys.includes(k));
  }
  async function seedClientsFromQuotations(persist){
    const existingKeys=new Set((state.clients||[]).flatMap(c=>[c.companyName,c.contactPerson].map(normalizeClientName).filter(Boolean)));
    let added=0;
    const ordered=[...(state.quotations||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    for(const q of ordered){
      const company=String(q.company||'').trim();
      const person=String(q.customer||'').trim();
      const primary=normalizeClientName(company||person);
      if(!primary || existingKeys.has(primary)) continue;
      const c=ensureClientShape({
        id:uid('cli'), companyName:company, contactPerson:person, contactDetails:String(q.contact||'').trim(),
        address:String(q.address||'').trim(), preferredTerms:String(q.terms||'').trim(), salesperson:String(q.salesperson||'').trim(),
        status:'Active', tags:'Imported from quotations', notes:'Auto-created from existing quotation history.'
      });
      state.clients.push(c); existingKeys.add(primary); added++;
      if(persist) await storageSet('client:'+c.id,c);
    }
    state.clients.sort((a,b)=>clientDisplayName(a).localeCompare(clientDisplayName(b)));
    return added;
  }

  // Maps an explicit payment method to the cash account that should receive it. This fixes the
  // old behavior where selecting GCash still left the account on the first option (Cash on Hand).
  // Bank transfers without a known bank are kept visible in a separate review account instead of
  // being silently and incorrectly assigned to BDO/BPI/Metrobank.
  function defaultAccountForPayment(method, currentAccount){
    const methodName = String(method||'').trim();
    const current = String(currentAccount||'').trim();
    if(methodName==='GCash') return 'GCash';
    if(methodName==='Maya') return 'Maya';
    if(methodName==='Cash') return 'Cash on Hand';
    if(current && !(methodName==='GCash' && current==='Cash on Hand') && !(methodName==='Maya' && current==='Cash on Hand')) return current;
    if(methodName==='Bank Transfer' || methodName==='Check' || methodName==='Credit Card') return 'Bank Transfer (Unassigned)';
    return current || state.settings.cashAccounts[0] || 'Cash on Hand';
  }

  function ensureQuotationShape(q){
    if(!q || typeof q!=='object') return false;
    let changed = false;
    if(!Array.isArray(q.items)){ q.items=[]; changed=true; }
    if(!Array.isArray(q.payments)){ q.payments=[]; changed=true; }
    if(q.clientId===undefined){ q.clientId=''; changed=true; }
    if(q.paymentDueDate===undefined){ q.paymentDueDate=''; changed=true; }
    if(q.expectedCompletionDate===undefined){ q.expectedCompletionDate=''; changed=true; }
    if(!q.lastUpdated){ q.lastUpdated=q.date || new Date().toISOString().slice(0,10); changed=true; }
    if(q.orderStatus==='Completed' && !q.completedDate){ q.completedDate=q.date || q.lastUpdated || new Date().toISOString().slice(0,10); changed=true; }
    if(q.orderStatus!=='Completed' && q.completedDate===undefined){ q.completedDate=''; changed=true; }
    q.items.forEach((it,idx)=>{
      if(!it || typeof it!=='object'){ it={}; q.items[idx]=it; changed=true; }
      if(!it.id){ it.id='itmigrated-'+sanitizeKeyPart((q.number||'quotation')+'-'+idx); changed=true; }
      if(it.code===undefined){ it.code=''; changed=true; }
      if(it.name===undefined){ it.name=it.description||''; changed=true; }
      if(it.category===undefined){ it.category=''; changed=true; }
      if(it.description===undefined){ it.description=it.name||''; changed=true; }
      if(it.qty===undefined){ it.qty=0; changed=true; }
      if(it.unit===undefined){ it.unit='Piece'; changed=true; }
      if(it.price===undefined){ it.price=0; changed=true; }
      if(it.cost===undefined){ it.cost=0; changed=true; }
      if(it.discount===undefined){ it.discount=0; changed=true; }
      if(it.fulfillmentSource===undefined){ it.fulfillmentSource='Automatic'; changed=true; }
      if(it.mixQtyInventory===undefined){ it.mixQtyInventory=0; changed=true; }
      if(it.isService===undefined){ it.isService=false; changed=true; }
      if(it.excessAllocation===undefined){ it.excessAllocation='Add Excess to General Inventory'; changed=true; }
      if(it._deductedQty===undefined){ it._deductedQty=0; changed=true; }
      if(it._deductedCode===undefined){ it._deductedCode=''; changed=true; }
      if(it._resolvedSource===undefined){ it._resolvedSource=''; changed=true; }
    });
    return changed;
  }

  // Repairs legacy quotation/payment records after load or import. It does not alter product
  // costing or inventory quantities. Missing client-payment ledger rows are reconstructed from
  // the quotation's own payment records so the Finance Dashboard can finally see them.
  async function repairStateData(persist){
    const changedQuotations = new Set();
    const changedLedgerIds = new Set();
    const ledgerById = new Map((state.cashLedger||[]).filter(Boolean).map(e=>[e.id,e]));

    for(const q of (state.quotations||[])){
      if(ensureQuotationShape(q)) changedQuotations.add(q.number);
      for(let i=0;i<q.payments.length;i++){
        const pmt = q.payments[i] || (q.payments[i]={});
        if(!pmt.id){ pmt.id='cpaymigrated-'+sanitizeKeyPart((q.number||'quotation')+'-'+i); changedQuotations.add(q.number); }
        const fixedAccount = defaultAccountForPayment(pmt.method, pmt.account);
        if(pmt.account!==fixedAccount){ pmt.account=fixedAccount; changedQuotations.add(q.number); }

        let ledger = pmt.ledgerEntryId ? ledgerById.get(pmt.ledgerEntryId) : null;
        if(!ledger){
          let ledgerId = 'clmig-'+sanitizeKeyPart(pmt.id || ((q.number||'quotation')+'-'+i));
          let suffix=1;
          while(ledgerById.has(ledgerId)) ledgerId='clmig-'+sanitizeKeyPart(pmt.id || q.number)+'-'+(suffix++);
          ledger = {
            id:ledgerId, date:pmt.date || q.date || new Date().toISOString().slice(0,10), time:'00:00',
            transactionType:'Client Payment', source:'Quotation', referenceNumber:pmt.reference||'',
            clientOrSupplier:q.company||q.customer||'', account:fixedAccount,
            cashIn:Number(pmt.amount)||0, cashOut:0, recordedBy:'',
            remarks:pmt.remarks || `Payment for ${q.number}`, createdAt:(pmt.date||q.date||new Date().toISOString().slice(0,10))+'T00:00:00.000Z',
            history:[], migratedFromQuotation:true
          };
          state.cashLedger.push(ledger); ledgerById.set(ledger.id,ledger);
          pmt.ledgerEntryId=ledger.id;
          changedQuotations.add(q.number); changedLedgerIds.add(ledger.id);
        } else {
          const desired = {
            date:pmt.date || ledger.date, transactionType:'Client Payment', source:'Quotation',
            referenceNumber:pmt.reference||ledger.referenceNumber||'', clientOrSupplier:q.company||q.customer||ledger.clientOrSupplier||'',
            account:fixedAccount, cashIn:Number(pmt.amount)||0, cashOut:0,
            remarks:pmt.remarks || ledger.remarks || `Payment for ${q.number}`
          };
          let ledgerChanged=false;
          Object.keys(desired).forEach(k=>{ if(ledger[k]!==desired[k]){ ledger[k]=desired[k]; ledgerChanged=true; } });
          if(ledgerChanged) changedLedgerIds.add(ledger.id);
        }
      }
    }

    state.cashLedger = (state.cashLedger||[]).filter(Boolean).sort((a,b)=> (a.createdAt||a.date||'').localeCompare(b.createdAt||b.date||''));
    if(persist){
      for(const q of state.quotations){ if(changedQuotations.has(q.number)) await storageSet('quotation:'+q.number,q); }
      for(const e of state.cashLedger){ if(changedLedgerIds.has(e.id)) await storageSet('cashledger:'+e.id,e); }
    }
    return { repairedQuotations:changedQuotations.size, repairedLedgerEntries:changedLedgerIds.size };
  }

  // Typing triggers many rapid change events; writing to storage on every keystroke can hit
  // the platform's write-rate limit and surface as "Save failed" even though nothing is wrong.
  // debounceSave coalesces rapid-fire saves for the same key into one write ~500ms after the
  // user pauses, and flushSave lets a blur/navigation event force an immediate write so nothing
  // is lost if they click away right after typing.
  const _saveTimers = new Map();
  const _pendingSaveFns = new Map();
  function debounceSave(key, saveFn, delay){
    delay = delay || 500;
    if(_saveTimers.has(key)) clearTimeout(_saveTimers.get(key));
    _pendingSaveFns.set(key, saveFn);
    const t = setTimeout(async ()=>{
      _saveTimers.delete(key);
      const fn = _pendingSaveFns.get(key);
      _pendingSaveFns.delete(key);
      if(fn) await fn();
    }, delay);
    _saveTimers.set(key, t);
  }
  async function flushSave(key){
    if(!_saveTimers.has(key)) return;
    clearTimeout(_saveTimers.get(key));
    _saveTimers.delete(key);
    const fn = _pendingSaveFns.get(key);
    _pendingSaveFns.delete(key);
    if(fn) await fn();
  }
  async function flushAllSaves(){
    const keys = [...(_pendingSaveFns.keys())];
    for(const k of keys) await flushSave(k);
  }
  window.addEventListener('beforeunload', ()=>{ flushAllSaves(); });
  window.addEventListener('pagehide', ()=>{ flushAllSaves(); });

  // Expose a minimal namespace early so later script chunks can attach to it.
  window.__ecohub = { state, storageGet, storageSet, storageDelete, storageListKeys, loadAll,
    $, qs, qsa, peso, todayISO, addDays, monthKey, monthLabel, escapeHtml, toast, uid, sanitizeKeyPart,
    normalizeClientName, clientDisplayName, ensureClientShape, findClientForQuotation, clientMatchesQuotation, seedClientsFromQuotations,
    defaultAccountForPayment, ensureQuotationShape, repairStateData,
    debounceSave, flushSave, flushAllSaves, storageApiPresent, storageBackendName,
    productLandedCost, productCostPerPiece, CONFIRMED_ORDER_STATUSES, DONE_ORDER_STATUSES,
    NOT_CONFIRMED_STATUSES, CANCELLED_QUOTATION_STATUSES, PAYABLE_STATUSES, PAYMENT_BATCHES,
    SUPPLIER_PAYMENT_TERMS, PURCHASE_STAGES, paymentTermDefaultDays,
    LEDGER_TRANSACTION_TYPES,
    SUPABASE_CONFIGURED, supabaseClient };
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state } = E;

  /* ---------------------------------------------------------------
     Line-item math (used by the quotation editor + everything downstream)
  --------------------------------------------------------------- */
  function lineAmount(it){ return Math.max(0, (Number(it.qty)||0)*(Number(it.price)||0) - (Number(it.discount)||0)); }
  function lineCOGS(it){ return (Number(it.qty)||0)*(Number(it.cost)||0); }

  function quotationTotals(q){
    const items = Array.isArray(q && q.items) ? q.items : [];
    const subtotal = items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0);
    const discountTotal = items.reduce((s,it)=> s + (Number(it.discount)||0), 0);
    const net = Math.max(0, subtotal - discountTotal);
    const vat = q.vatEnabled ? net * (Number(q.vatRate)||0)/100 : 0;
    const grand = net + vat;
    const cogs = items.reduce((s,it)=> s + lineCOGS(it), 0);
    const grossProfit = net - cogs;
    return {subtotal, discountTotal, net, vat, grand, cogs, grossProfit};
  }

  function quotationPaymentInfo(q){
    const grand = quotationTotals(q).grand;
    const amountPaid = (Array.isArray(q && q.payments)?q.payments:[]).reduce((s,p)=> s + (Number(p.amount)||0), 0);
    const remainingBalance = Math.max(0, grand - amountPaid);
    const overdue = q.paymentDueDate && q.paymentDueDate < E.todayISO() && remainingBalance>0;
    let status = 'Unpaid';
    if(grand>0 && remainingBalance<=0.004) status = 'Fully Paid';
    else if(amountPaid>0) status = overdue ? 'Overdue' : 'Partially Paid';
    else if(overdue) status = 'Overdue';
    return { grand, amountPaid, remainingBalance, status };
  }

  function isConfirmed(q){
    if(q.quotationStatus === 'Approved') return true;
    return E.CONFIRMED_ORDER_STATUSES.includes(q.orderStatus);
  }
  function isPendingOrder(q){
    return q.orderStatus && !E.DONE_ORDER_STATUSES.includes(q.orderStatus)
      && !E.CANCELLED_QUOTATION_STATUSES.includes(q.quotationStatus);
  }
  function isRevenueRecognized(q){
    return !!q && q.orderStatus==='Completed';
  }

  /* ---------------------------------------------------------------
     Sales Records — derived: one row per confirmed quotation line item
  --------------------------------------------------------------- */
  function computeSalesRows(){
    const rows = [];
    for(const q of state.quotations){
      if(!isRevenueRecognized(q)) continue;
      const recognizedDate = q.completedDate || q.date;
      for(const it of (Array.isArray(q.items)?q.items:[])){
        const gross = (Number(it.qty)||0)*(Number(it.price)||0);
        const discount = Number(it.discount)||0;
        const net = Math.max(0, gross - discount);
        const cogs = lineCOGS(it);
        rows.push({
          quotationNo: q.number, date: recognizedDate, quotationDate:q.date, customer: q.customer, company: q.company,
          salesperson: q.salesperson, product: it.name || it.description, category: it.category || '',
          qty: Number(it.qty)||0, price: Number(it.price)||0, gross, discount, net,
          cost: Number(it.cost)||0, cogs, grossProfit: net-cogs,
          orderStatus: q.orderStatus, quotationStatus: q.quotationStatus
        });
      }
    }
    rows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    return rows;
  }

  function computePendingOrders(){
    return state.quotations.filter(isPendingOrder).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  }

  /* ---------------------------------------------------------------
     Dashboard aggregates
  --------------------------------------------------------------- */
  function monthKeyOf(ym){ return `${ym.year}-${String(ym.month).padStart(2,'0')}`; }
  function inMonth(dateStr, ym){ return !!dateStr && dateStr.slice(0,7)===monthKeyOf(ym); }
  function daysBetween(fromISO, toISO){
    if(!fromISO) return 0;
    const a = new Date(fromISO+'T00:00:00');
    const b = new Date((toISO||E.todayISO())+'T00:00:00');
    return Math.max(0, Math.round((b-a)/86400000));
  }
  function monthLabelFromDate(dateStr){
    if(!dateStr) return '—';
    return new Date(dateStr+'T00:00:00').toLocaleString('en-US',{month:'long', year:'numeric'});
  }

  function computeDashboard(ym){
    ym = ym || state.selectedMonth;
    const salesRows = computeSalesRows(); // all confirmed sale line items, all-time (used for carry-over/trend)
    const monthSalesRows = salesRows.filter(r=>inMonth(r.date, ym)); // "Sales by Quotation Month" rule

    const monthQuotations = state.quotations.filter(q=>inMonth(q.date, ym));
    const totalQuotations = monthQuotations.length;
    const pendingQuotations = monthQuotations.filter(q=>q.quotationStatus==='Pending').length;
    const approvedQuotations = monthQuotations.filter(q=>q.quotationStatus==='Approved').length;
    const cancelledQuotations = monthQuotations.filter(q=>['Cancelled','Declined'].includes(q.quotationStatus)).length;

    const grossSales = monthSalesRows.reduce((s,r)=>s+r.gross,0);
    const discounts = monthSalesRows.reduce((s,r)=>s+r.discount,0);
    const netSales = monthSalesRows.reduce((s,r)=>s+r.net,0);
    const cogs = monthSalesRows.reduce((s,r)=>s+r.cogs,0);
    const grossProfit = netSales - cogs;

    const openReceivableProfit = state.quotations
      .filter(q=>isConfirmed(q) && !isRevenueRecognized(q) && !E.CANCELLED_QUOTATION_STATUSES.includes(q.quotationStatus))
      .reduce((sum,q)=> sum + quotationTotals(q).grossProfit, 0);

    const monthExpenses = state.expenses.filter(e=>inMonth(e.date, ym));
    const operatingExpenses = monthExpenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const netIncome = grossProfit - operatingExpenses;

    const confirmedOrderNumbers = new Set(monthSalesRows.map(r=>r.quotationNo));
    const confirmedOrders = confirmedOrderNumbers.size;
    const avgOrderValue = confirmedOrders>0 ? netSales/confirmedOrders : 0;

    const potentialSales = monthQuotations
      .filter(q=>['Pending','Sent'].includes(q.quotationStatus))
      .reduce((s,q)=> s + quotationTotals(q).grand, 0);

    const pendingOrdersCount = monthQuotations.filter(isPendingOrder).length;
    const completedOrdersCount = state.quotations.filter(q=>isRevenueRecognized(q) && inMonth(q.completedDate||q.date, ym)).length;

    // Collections by payment month — regardless of which month the underlying quotation belongs to
    let paymentsReceivedThisMonth = 0;
    state.quotations.forEach(q=>{
      (q.payments||[]).forEach(p=>{ if(inMonth(p.date, ym)) paymentsReceivedThisMonth += Number(p.amount)||0; });
    });

    // Supplier purchases this month — dated by the underlying quotation/purchase date
    const supplierPurchasesThisMonth = state.payables
      .filter(p=>!p.cancelled && inMonth(p.quotationDate, ym))
      .reduce((s,p)=>s+(Number(p.totalSupplierCost)||0),0);

    // ---------------- Carry-over: Pending Orders (ALL, regardless of month) ----------------
    const carryOverPending = computePendingOrders().map(q=>{
      const pay = E.quotationPaymentInfo(q);
      return {
        number: q.number, client: q.company||q.customer||'—',
        originalMonth: monthLabelFromDate(q.date), originalDate: q.date,
        currentStatus: q.orderStatus, quotationStatus: q.quotationStatus,
        daysPending: daysBetween(q.date, E.todayISO()),
        expectedCompletion: q.expectedCompletionDate||'—',
        remainingBalance: pay.remainingBalance,
        lastUpdated: q.lastUpdated||q.date
      };
    });

    // ---------------- Carry-over: Outstanding Receivables (ALL, regardless of month) ----------------
    const carryOverReceivables = state.quotations
      .filter(isConfirmed)
      .map(q=>({q, pay:E.quotationPaymentInfo(q)}))
      .filter(x=>x.pay.remainingBalance>0.004)
      .map(({q,pay})=>({
        number:q.number, client:q.company||q.customer||'—',
        originalDate:q.date, originalMonth: monthLabelFromDate(q.date),
        originalTotal:pay.grand, amountPaid:pay.amountPaid,
        remainingBalance:pay.remainingBalance, status:pay.status,
        dueDate:q.paymentDueDate||'—', daysOutstanding: daysBetween(q.date, E.todayISO())
      }))
      .sort((a,b)=> b.daysOutstanding-a.daysOutstanding);

    // monthly sales trend (all-time, last up to 12 months present in data — a single-month
    // selector wouldn't give a meaningful trend line, so this chart intentionally spans months)
    const monthMap = {};
    salesRows.forEach(r=>{
      const mk = E.monthKey(r.date);
      if(!mk) return;
      if(!monthMap[mk]) monthMap[mk] = {gross:0, net:0};
      monthMap[mk].gross += r.gross; monthMap[mk].net += r.net;
    });
    const months = Object.keys(monthMap).sort();
    const monthlyTrend = months.map(mk=>({ label: E.monthLabel(mk+'-01'), gross: monthMap[mk].gross, net: monthMap[mk].net }));

    // by category (scoped to selected month)
    const catMap = {};
    monthSalesRows.forEach(r=>{
      const c = r.category || 'Uncategorized';
      catMap[c] = (catMap[c]||0) + r.net;
    });
    const byCategory = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

    // quotation status breakdown (scoped to selected month)
    const statusMap = {};
    state.settings.quotationStatuses.forEach(s=> statusMap[s]=0);
    monthQuotations.forEach(q=>{ statusMap[q.quotationStatus] = (statusMap[q.quotationStatus]||0)+1; });
    const statusBreakdown = Object.entries(statusMap).filter(([,v])=>v>0);

    // top products by qty (scoped to selected month)
    const prodMap = {};
    monthSalesRows.forEach(r=>{ prodMap[r.product] = (prodMap[r.product]||0) + r.qty; });
    const topProducts = Object.entries(prodMap).sort((a,b)=>b[1]-a[1]).slice(0,6);

    return {
      ym, monthLabel: new Date(ym.year, ym.month-1, 1).toLocaleString('en-US',{month:'long', year:'numeric'}),
      totalQuotations, pendingQuotations, approvedQuotations, cancelledQuotations,
      grossSales, discounts, netSales, cogs, grossProfit, openReceivableProfit, operatingExpenses, netIncome,
      confirmedOrders, avgOrderValue, potentialSales, pendingOrdersCount, completedOrdersCount,
      paymentsReceivedThisMonth, supplierPurchasesThisMonth,
      carryOverPending, carryOverReceivables,
      monthlyTrend, byCategory, statusBreakdown, topProducts, salesRows
    };
  }

  E.lineAmount = lineAmount;
  E.lineCOGS = lineCOGS;
  E.quotationTotals = quotationTotals;
  E.quotationPaymentInfo = quotationPaymentInfo;
  E.isConfirmed = isConfirmed;
  E.isPendingOrder = isPendingOrder;
  E.isRevenueRecognized = isRevenueRecognized;
  E.computeSalesRows = computeSalesRows;
  E.computePendingOrders = computePendingOrders;
  function computeOutstandingSupplierPayables(){
    return state.payables.filter(p=>!p.cancelled && !p.archived && !p.historicalSettled).reduce((s,p)=>s+(Number(p.remainingBalance)||0),0);
  }
  function computeMissingCostReview(){
    const requiredCodes = new Set(state.products.filter(p=>p.costingRequired).map(p=>p.code));
    if(!requiredCodes.size) return [];
    const rows = [];
    state.quotations.forEach(q=>{
      const flaggedItems = q.items.filter(it=>requiredCodes.has(it.code));
      if(flaggedItems.length){
        rows.push({ quotationNo:q.number, client: q.company||q.customer||'—', date:q.date,
          items: flaggedItems.map(it=>it.name||it.description).join(', ') });
      }
    });
    return rows;
  }

  E.computeDashboard = computeDashboard;
  E.computeOutstandingSupplierPayables = computeOutstandingSupplierPayables;
  E.computeMissingCostReview = computeMissingCostReview;
  E.monthKeyOf = monthKeyOf;
  E.inMonth = inMonth;
  E.daysBetween = daysBetween;
  E.monthLabelFromDate = monthLabelFromDate;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const INK = '#1F3D2B', KRAFT = '#9C7A54', SAGE = '#A9BFA3', LINE = '#DCD3C2';
  const PALETTE = ['#1F3D2B','#9C7A54','#A9BFA3','#C08A3E','#6E8B6A','#B3564A','#D8CFC0'];

  function svg(w,h,inner){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,sans-serif">${inner}</svg>`; }

  function barChart(data, opts){
    opts = opts || {};
    const w = 460, h = 220, padL = 40, padB = 26, padT = 10, padR = 10;
    if(!data.length) return `<div class="empty-state">No data yet</div>`;
    const max = Math.max(1, ...data.map(d=>Math.max(d.value, d.value2||0)));
    const bw = (w-padL-padR) / data.length;
    let bars = '';
    data.forEach((d,i)=>{
      const x = padL + i*bw;
      const groupWidth = bw*0.7;
      const barW = d.value2!==undefined ? groupWidth/2 - 2 : groupWidth;
      const h1 = (d.value/max)*(h-padT-padB);
      bars += `<rect x="${x+bw*0.15}" y="${h-padB-h1}" width="${barW}" height="${h1}" fill="${INK}" rx="2"></rect>`;
      if(d.value2!==undefined){
        const h2 = (d.value2/max)*(h-padT-padB);
        bars += `<rect x="${x+bw*0.15+barW+3}" y="${h-padB-h2}" width="${barW}" height="${h2}" fill="${KRAFT}" rx="2"></rect>`;
      }
      bars += `<text x="${x+bw/2}" y="${h-8}" font-size="9" fill="${INK}" text-anchor="middle">${E.escapeHtml(d.label)}</text>`;
    });
    bars += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="${LINE}"/>`;
    return svg(w,h,bars);
  }

  function lineChart(data, opts){
    opts = opts || {};
    const w = 460, h = 220, padL = 42, padB = 26, padT = 14, padR = 14;
    if(!data.length) return `<div class="empty-state">No data yet</div>`;
    const max = Math.max(1, ...data.map(d=>Math.max(d.value, d.value2||0)));
    const stepX = data.length>1 ? (w-padL-padR)/(data.length-1) : 0;
    function pathFor(key){
      return data.map((d,i)=>{
        const x = padL + i*stepX;
        const y = h-padB-((d[key]||0)/max)*(h-padT-padB);
        return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
      }).join(' ');
    }
    let out = `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="${LINE}"/>`;
    out += `<path d="${pathFor('value')}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
    if(data[0].value2!==undefined) out += `<path d="${pathFor('value2')}" fill="none" stroke="${KRAFT}" stroke-width="2.5" stroke-dasharray="4,3"/>`;
    data.forEach((d,i)=>{
      const x = padL + i*stepX;
      out += `<text x="${x}" y="${h-8}" font-size="9" fill="${INK}" text-anchor="middle">${E.escapeHtml(d.label)}</text>`;
    });
    return svg(w,h,out);
  }

  function donutChart(data, opts){
    opts = opts || {};
    const w=220,h=220,cx=110,cy=110,r=80,r2=48;
    const total = data.reduce((s,d)=>s+d.value,0);
    if(!total) return `<div class="empty-state">No data yet</div>`;
    let angle = -Math.PI/2, paths = '', legend = '';
    data.forEach((d,i)=>{
      const frac = d.value/total;
      const a2 = angle + frac*Math.PI*2;
      const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
      const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      const large = (a2-angle) > Math.PI ? 1 : 0;
      const color = PALETTE[i%PALETTE.length];
      paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${color}"></path>`;
      angle = a2;
    });
    paths += `<circle cx="${cx}" cy="${cy}" r="${r2}" fill="#fff"/>`;
    data.forEach((d,i)=>{
      legend += `<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:4px;">
        <span style="width:9px;height:9px;border-radius:2px;background:${PALETTE[i%PALETTE.length]};display:inline-block;"></span>
        <span>${E.escapeHtml(d.label)}</span><span style="margin-left:auto;color:var(--ink-soft);font-family:var(--mono);">${d.value}</span></div>`;
    });
    return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">${svg(w,h,paths)}<div style="flex:1;min-width:120px;">${legend}</div></div>`;
  }

  E.charts = { barChart, lineChart, donutChart };
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml } = E;

  function monthSelectorHtml(ym){
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const years = [];
    for(let y=ym.year-3; y<=ym.year+3; y++) years.push(y);
    return `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button class="btn small" id="dm-prev">◀</button>
        <select id="dm-month">${monthNames.map((m,i)=>`<option value="${i+1}" ${i+1===ym.month?'selected':''}>${m}</option>`).join('')}</select>
        <select id="dm-year">${years.map(y=>`<option value="${y}" ${y===ym.year?'selected':''}>${y}</option>`).join('')}</select>
        <button class="btn small" id="dm-next">▶</button>
        <button class="btn small" id="dm-today">This Month</button>
      </div>`;
  }

  async function setSelectedMonth(year, month){
    state.selectedMonth = { year, month };
    await E.storageSet('ui:selectedMonth', state.selectedMonth);
  }

  function renderDashboard(container){
    const ym = state.selectedMonth;
    const d = E.computeDashboard(ym);
    const kpis = [
      ['New Quotations This Month', d.totalQuotations, false],
      ['Pending Quotations', d.pendingQuotations, false],
      ['Approved Quotations', d.approvedQuotations, false],
      ['Cancelled / Declined', d.cancelledQuotations, false],
      ['Completed Gross Sales', d.grossSales, true],
      ['Completed Discounts', d.discounts, true],
      ['Completed Net Sales', d.netSales, true],
      ['Completed COGS', d.cogs, true],
      ['Realized Gross Profit', d.grossProfit, true],
      ['Receivable Profit — Open Orders', d.openReceivableProfit, true],
      ['Operating Expenses', d.operatingExpenses, true],
      ['Net Income', d.netIncome, true],
      ['Confirmed Orders This Month', d.confirmedOrders, false],
      ['Completed Orders This Month', d.completedOrdersCount, false],
      ['Average Order Value', d.avgOrderValue, true],
      ['Potential Sales', d.potentialSales, true],
      ['New Orders This Month', d.pendingOrdersCount, false],
      ['Payments Received This Month', d.paymentsReceivedThisMonth, true],
      ['Supplier Purchases This Month', d.supplierPurchasesThisMonth, true],
    ];

    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Overview</p><h2>Dashboard — ${d.monthLabel}</h2></div>
        <div class="actions">${monthSelectorHtml(ym)}</div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">
        New quotation counts use the quotation date. Sales, COGS, and realized profit appear only after Order Status becomes Completed and are grouped by completion month. Open-order profit stays under Receivable Profit until completion.
      </p>
      <div class="kpi-grid">
        ${kpis.map(([label,val,isMoney])=>`
          <div class="kpi"><div class="lbl">${label}</div><div class="val">${isMoney?peso(val):Number(val).toLocaleString()}</div></div>
        `).join('')}
        <div class="kpi" id="cup-stock-card" style="cursor:pointer;border-color:var(--sage);" title="Open Cup Stock Inventory Dashboard">
          <div class="lbl">Client Cup Stock Value ↗</div><div class="val">${peso(E.computeCupStockCardValue())}</div>
        </div>
        <div class="kpi" id="payables-card" style="cursor:pointer;border-color:var(--kraft);" title="Open Supplier Payables">
          <div class="lbl">Outstanding Supplier Payables ↗</div><div class="val">${peso(E.computeOutstandingSupplierPayables())}</div>
        </div>
      </div>

      <div class="card">
        <h3>Carry-Over Pending Orders <span style="font-weight:400;text-transform:none;color:var(--ink-soft);">(all months — until Completed, Cancelled, Declined, or Expired)</span></h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Quotation No.</th><th>Client</th><th>Original Month</th><th>Current Status</th>
              <th class="num">Days Pending</th><th>Expected Completion</th><th class="num">Remaining Balance</th><th>Latest Update</th><th></th>
            </tr></thead>
            <tbody>
              ${d.carryOverPending.length ? d.carryOverPending.map(p=>`
                <tr>
                  <td><b>${escapeHtml(p.number)}</b></td>
                  <td>${escapeHtml(p.client)}</td>
                  <td>${escapeHtml(p.originalMonth)}</td>
                  <td><span class="pill orange">${escapeHtml(p.currentStatus)}</span></td>
                  <td class="num">${p.daysPending}</td>
                  <td>${escapeHtml(p.expectedCompletion)}</td>
                  <td class="num">${peso(p.remainingBalance)}</td>
                  <td>${escapeHtml(p.lastUpdated)}</td>
                  <td><button class="btn small" data-open-q="${escapeHtml(p.number)}">Open</button></td>
                </tr>
              `).join('') : `<tr><td colspan="9"><div class="empty-state">No pending orders carried over — everything is Completed or Cancelled.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>Outstanding Receivables <span style="font-weight:400;text-transform:none;color:var(--ink-soft);">(all months — until fully paid)</span></h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Client</th><th>Quotation No.</th><th>Original Date</th><th class="num">Original Total</th>
              <th class="num">Amount Paid</th><th class="num">Remaining Balance</th><th>Status</th><th>Due Date</th><th class="num">Days Outstanding</th><th></th>
            </tr></thead>
            <tbody>
              ${d.carryOverReceivables.length ? d.carryOverReceivables.map(r=>`
                <tr>
                  <td>${escapeHtml(r.client)}</td>
                  <td><b>${escapeHtml(r.number)}</b></td>
                  <td>${escapeHtml(r.originalDate)}</td>
                  <td class="num">${peso(r.originalTotal)}</td>
                  <td class="num">${peso(r.amountPaid)}</td>
                  <td class="num">${peso(r.remainingBalance)}</td>
                  <td><span class="pill ${r.status==='Overdue'?'red':(r.status==='Partially Paid'?'orange':'gray')}">${escapeHtml(r.status)}</span></td>
                  <td>${escapeHtml(r.dueDate)}</td>
                  <td class="num">${r.daysOutstanding}</td>
                  <td><button class="btn small" data-open-q="${escapeHtml(r.number)}">Open</button></td>
                </tr>
              `).join('') : `<tr><td colspan="10"><div class="empty-state">No outstanding balances — every confirmed sale is fully paid.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="chart-grid">
        <div class="card chart-card">
          <h3>Monthly Sales Trend (Gross vs Net, all-time)</h3>
          ${E.charts.lineChart(d.monthlyTrend.map(m=>({label:m.label, value:m.gross, value2:m.net})))}
          <div style="display:flex;gap:14px;font-size:11px;margin-top:6px;color:var(--ink-soft);">
            <span>▬ Gross Sales</span><span style="color:var(--kraft);">╌ Net Sales</span>
          </div>
        </div>
        <div class="card chart-card">
          <h3>Quotation Status Breakdown — ${d.monthLabel}</h3>
          ${E.charts.donutChart(d.statusBreakdown.map(([label,value])=>({label,value})))}
        </div>
        <div class="card chart-card">
          <h3>Net Sales by Category — ${d.monthLabel}</h3>
          ${E.charts.barChart(d.byCategory.map(([label,value])=>({label, value: Math.round(value)})))}
        </div>
        <div class="card chart-card">
          <h3>Top-Selling Products — ${d.monthLabel}</h3>
          ${E.charts.barChart(d.topProducts.map(([label,value])=>({label, value})))}
        </div>
      </div>
    `;

    const cupCard = E.qs('#cup-stock-card', container);
    if(cupCard) cupCard.addEventListener('click', ()=> E.navigate('cupstock'));
    const payCard = E.qs('#payables-card', container);
    if(payCard) payCard.addEventListener('click', ()=> E.navigate('payables'));

    E.qs('#dm-prev', container).addEventListener('click', async ()=>{
      let {year,month} = state.selectedMonth; month--; if(month<1){month=12;year--;}
      await setSelectedMonth(year,month); renderDashboard(container);
    });
    E.qs('#dm-next', container).addEventListener('click', async ()=>{
      let {year,month} = state.selectedMonth; month++; if(month>12){month=1;year++;}
      await setSelectedMonth(year,month); renderDashboard(container);
    });
    E.qs('#dm-today', container).addEventListener('click', async ()=>{
      const now = new Date();
      await setSelectedMonth(now.getFullYear(), now.getMonth()+1); renderDashboard(container);
    });
    E.qs('#dm-month', container).addEventListener('change', async e=>{
      await setSelectedMonth(state.selectedMonth.year, parseInt(e.target.value,10)); renderDashboard(container);
    });
    E.qs('#dm-year', container).addEventListener('change', async e=>{
      await setSelectedMonth(parseInt(e.target.value,10), state.selectedMonth.month); renderDashboard(container);
    });
    E.qsa('[data-open-q]', container).forEach(btn=>{
      btn.addEventListener('click', ()=>{ E.navigate('quotations'); E.openQuotationEditor(document.getElementById('main-content'), btn.dataset.openQ); });
    });
  }

  E.renderDashboard = renderDashboard;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO, addDays } = E;

  let mode = 'list';        // 'list' | 'edit'
  let current = null;       // quotation object being edited
  let listFilter = '';
  let editorDirty = false;
  let editorSaving = false;

  // Quotation recovery layer. User-entered quotation data is protected in a separate draft key
  // while typing. A successful permanent save clears the draft and writes a save marker.
  // This prevents a downstream inventory/payables error, reload, or transient storage failure
  // from making the user's line items appear to disappear.
  const QUOT_DRAFT_PREFIX = 'quotationDraft:';
  const QUOT_SAVE_META_PREFIX = 'quotationSaveMeta:';
  const DRAFT_DEBOUNCE_PREFIX = 'quotationDraftWrite:';

  function deepCloneQuotation(q){
    try{ return JSON.parse(JSON.stringify(q)); }
    catch(e){ console.error('quotation clone failed', e); return Object.assign({}, q); }
  }
  function quotationDraftKey(number){ return QUOT_DRAFT_PREFIX + E.sanitizeKeyPart(number||'unsaved'); }
  function quotationSaveMetaKey(number){ return QUOT_SAVE_META_PREFIX + E.sanitizeKeyPart(number||'unsaved'); }
  function quotationDraftTimerKey(number){ return DRAFT_DEBOUNCE_PREFIX + E.sanitizeKeyPart(number||'unsaved'); }

  function markEditorDirty(){ editorDirty = true; }

  async function persistQuotationDraft(container, q){
    if(!q || !q.number) return false;
    try{
      if(container && E.qs('#f-date',container)) readHeaderIntoState(container, q, {touchLastUpdated:false});
      const payload = { savedAt:new Date().toISOString(), quotation:deepCloneQuotation(q) };
      return await E.storageSet(quotationDraftKey(q.number), payload);
    }catch(err){
      console.error('quotation recovery draft save failed', err);
      return false;
    }
  }

  function queueQuotationDraft(container, q){
    if(!q || !q.number) return;
    E.debounceSave(quotationDraftTimerKey(q.number), ()=>persistQuotationDraft(container,q), 450);
  }

  async function recoverQuotationDraft(baseQuotation){
    if(!baseQuotation || !baseQuotation.number) return baseQuotation;
    try{
      const draft = await E.storageGet(quotationDraftKey(baseQuotation.number));
      if(!draft || !draft.quotation || draft.quotation.number!==baseQuotation.number) return baseQuotation;
      const meta = await E.storageGet(quotationSaveMetaKey(baseQuotation.number));
      const draftAt = String(draft.savedAt||'');
      const savedAt = String(meta && meta.savedAt || '');
      if(savedAt && draftAt && draftAt<=savedAt) return baseQuotation;
      E.ensureQuotationShape(draft.quotation);
      toast('Recovered unsaved quotation changes');
      return draft.quotation;
    }catch(err){
      console.error('quotation draft recovery failed', err);
      return baseQuotation;
    }
  }

  function wireQuotationDraftProtection(container, q){
    // Use event delegation so every header field and line-item field gets recovery protection,
    // including fields added later without needing a new listener for each one.
    container.oninput = ()=>{
      if(mode!=='edit' || current!==q || editorSaving) return;
      markEditorDirty();
      queueQuotationDraft(container,q);
    };
    container.onchange = ()=>{
      if(mode!=='edit' || current!==q || editorSaving) return;
      markEditorDirty();
      queueQuotationDraft(container,q);
    };
  }
  function canLeaveQuotationEditor(){
    if(mode!=='edit' || !editorDirty || editorSaving) return true;
    return confirm('This quotation has unsaved changes. Leave without saving?');
  }

  function statusPillClass(status){
    if(['Approved','Completed','Delivered','Shipped','Fully Paid'].includes(status)) return 'green';
    if(['Pending','Sent','For Confirmation','Waiting for Down Payment','For Production','Ongoing Production','For Quality Check','Ready for Release'].includes(status)) return 'orange';
    if(['Declined'].includes(status)) return 'red';
    if(['Cancelled','Expired'].includes(status)) return 'gray';
    return 'gray';
  }

  function blankItem(){
    return {
      id: uid('it'), code:'', name:'', category:'', description:'', qty:1, unit:'Piece', price:0, cost:0, discount:0,
      // Inventory-first fulfillment
      fulfillmentSource:'Automatic', // Automatic | Use Inventory | Order Entire Quantity from Supplier | Mixed Fulfillment
      mixQtyInventory:0, isService:false, excessAllocation:'Add Excess to General Inventory',
      // internal bookkeeping, not user-facing — tracks what's currently deducted from inventory for this line
      _deductedQty:0, _deductedCode:'', _resolvedSource:''
    };
  }

  function nextQuotationNumber(){
    const year = new Date().getFullYear();
    let max = 0;
    state.quotations.forEach(q=>{
      const m = (q.number||'').match(new RegExp('QTN-'+year+'-(\\d+)$'));
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    return `QTN-${year}-${String(max+1).padStart(4,'0')}`;
  }

  function blankQuotation(){
    return {
      number: nextQuotationNumber(), date: todayISO(), valid: addDays(todayISO(),15),
      clientId:'', customer:'', company:'', contact:'', address:'', terms:'', notes:'',
      salesperson: state.settings.salespersons[0] || '',
      quotationStatus: 'Draft', orderStatus: 'For Confirmation',
      vatEnabled:false, vatRate: state.settings.taxRate || 12,
      paymentDueDate: '', expectedCompletionDate: '', lastUpdated: todayISO(),
      payments: [],
      items:[blankItem()]
    };
  }

  /* ---------------- LIST VIEW ---------------- */
  function quotationMonthLabel(){
    return new Date(state.selectedMonth.year,state.selectedMonth.month-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});
  }
  function quotationVisibleInPeriod(q){
    const selectedKey = E.monthKeyOf(state.selectedMonth);
    const originalKey = E.monthKey(q.date);
    if(originalKey===selectedKey) return true;

    // Carry-over only moves FORWARD. An August quotation must never appear while viewing July.
    // Older unfinished orders / unpaid receivables can appear in the selected later month until resolved.
    if(!originalKey || originalKey>=selectedKey) return false;
    const hasOpenOrder = E.isPendingOrder(q);
    const hasReceivable = E.isConfirmed(q) && E.quotationPaymentInfo(q).remainingBalance>0.004;
    return hasOpenOrder || hasReceivable;
  }
  async function shiftQuotationMonth(delta){
    let {year,month}=state.selectedMonth;
    month+=delta;
    if(month<1){month=12;year--;}
    if(month>12){month=1;year++;}
    state.selectedMonth={year,month};
    await E.storageSet('ui:selectedMonth',state.selectedMonth);
  }
  function quotationMonthControls(){
    const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const years=[]; for(let y=state.selectedMonth.year-3;y<=state.selectedMonth.year+3;y++) years.push(y);
    return `<button class="btn small" id="q-prev-month">◀</button>
      <select id="q-month-select">${months.map((m,i)=>`<option value="${i+1}" ${i+1===state.selectedMonth.month?'selected':''}>${m}</option>`).join('')}</select>
      <select id="q-year-select">${years.map(y=>`<option value="${y}" ${y===state.selectedMonth.year?'selected':''}>${y}</option>`).join('')}</select>
      <button class="btn small" id="q-next-month">▶</button>
      <button class="btn small" id="q-current-month">This Month</button>`;
  }
  function renderQuotations(container){
    if(mode==='edit' && current){ renderEditor(container); return; }
    mode='list';
    container.oninput = null;
    container.onchange = null;
    const rows = state.quotations.filter(q=>{
      if(!quotationVisibleInPeriod(q)) return false;
      if(!listFilter) return true;
      const f = listFilter.toLowerCase();
      return (q.number||'').toLowerCase().includes(f) || (q.customer||'').toLowerCase().includes(f) || (q.company||'').toLowerCase().includes(f);
    });
    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Sales</p><h2>Quotations — ${quotationMonthLabel()}</h2></div>
        <div class="actions">${quotationMonthControls()}</div>
      </div>
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-8px 0 14px;">
        <p style="color:var(--ink-soft);font-size:12.5px;margin:0;">Showing quotations dated this month, plus carry-over from EARLIER months only when the order is still unfinished or still has an unpaid receivable. Completed and fully paid transactions remain only in their original month.</p>
        <div class="actions"><input class="btn" id="q-search" placeholder="Search quotation # or client…" style="min-width:220px;"><button class="btn primary" id="q-new-btn">+ New Quotation</button></div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Quotation No.</th><th>Date</th><th>Client</th><th>Salesperson</th><th>Quotation Status</th><th>Order Status</th><th class="num">Grand Total</th><th></th></tr></thead>
            <tbody>
              ${rows.length ? rows.map(q=>{
                const t = E.quotationTotals(q);
                return `<tr>
                  <td><b>${escapeHtml(q.number)}</b></td>
                  <td>${escapeHtml(q.date||'')}</td>
                  <td>${escapeHtml(q.company||q.customer||'—')}</td>
                  <td>${escapeHtml(q.salesperson||'—')}</td>
                  <td><span class="pill ${statusPillClass(q.quotationStatus)}">${escapeHtml(q.quotationStatus||'—')}</span></td>
                  <td><span class="pill ${statusPillClass(q.orderStatus)}">${escapeHtml(q.orderStatus||'—')}</span></td>
                  <td class="num">${peso(t.grand)}</td>
                  <td><button class="btn small" data-open="${escapeHtml(q.number)}">Open</button></td>
                </tr>`;
              }).join('') : `<tr><td colspan="8"><div class="empty-state">No quotations for this month and no pending or unpaid carry-over transactions.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
    E.qs('#q-new-btn', container).addEventListener('click', async ()=>{
      current = await recoverQuotationDraft(blankQuotation());
      mode='edit'; renderEditor(container);
    });
    const search = E.qs('#q-search', container);
    search.value = listFilter;
    search.addEventListener('input', e=>{ listFilter = e.target.value; renderQuotations(container); });
    E.qs('#q-prev-month',container).addEventListener('click',async()=>{await shiftQuotationMonth(-1);renderQuotations(container);});
    E.qs('#q-next-month',container).addEventListener('click',async()=>{await shiftQuotationMonth(1);renderQuotations(container);});
    E.qs('#q-current-month',container).addEventListener('click',async()=>{const n=new Date();state.selectedMonth={year:n.getFullYear(),month:n.getMonth()+1};await E.storageSet('ui:selectedMonth',state.selectedMonth);renderQuotations(container);});
    E.qs('#q-month-select',container).addEventListener('change',async e=>{state.selectedMonth={year:state.selectedMonth.year,month:parseInt(e.target.value,10)};await E.storageSet('ui:selectedMonth',state.selectedMonth);renderQuotations(container);});
    E.qs('#q-year-select',container).addEventListener('change',async e=>{state.selectedMonth={year:parseInt(e.target.value,10),month:state.selectedMonth.month};await E.storageSet('ui:selectedMonth',state.selectedMonth);renderQuotations(container);});
    E.qsa('[data-open]', container).forEach(btn=>{
      btn.addEventListener('click', ()=> E.openQuotationEditor(container, btn.dataset.open));
    });
  }

  /* ---------------- EDITOR VIEW ---------------- */
  // Quotation product picker: Category first, then only products inside that category.
  // This keeps long product lists easy to scan without changing the saved product/code model.
  function quotationCategoryList(selectedCategory){
    const seen = new Set();
    const rows = [];
    const add = value=>{
      const v = String(value||'').trim();
      if(!v || seen.has(v)) return;
      seen.add(v); rows.push(v);
    };
    (state.settings.categories||[]).forEach(add);
    (state.products||[]).forEach(p=>add(p.category));
    if(selectedCategory) add(selectedCategory);
    return rows.slice().sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base',numeric:true}));
  }

  function resolvedItemCategory(it){
    if(it && it.category) return it.category;
    if(it && it.code && it.code!=='__custom__'){
      const p = state.products.find(x=>x.code===it.code);
      if(p && p.category) return p.category;
    }
    return '';
  }

  function categoryOptions(selectedCategory){
    let opts = `<option value="">— Select category —</option>`;
    opts += quotationCategoryList(selectedCategory).map(c=>
      `<option value="${escapeHtml(c)}" ${c===selectedCategory?'selected':''}>${escapeHtml(c)}</option>`
    ).join('');
    return opts;
  }

  function productOptions(selectedCode, selectedCategory){
    if(!selectedCategory){
      return `<option value="">— Select category first —</option>`;
    }
    let opts = `<option value="">— Select product —</option>`;
    const products = (state.products||[])
      .filter(p=>p.category===selectedCategory && (p.status==='Active' || p.code===selectedCode))
      .slice()
      .sort((a,b)=>(a.name||'').localeCompare(b.name||'',undefined,{sensitivity:'base',numeric:true}));
    opts += products.map(p=>
      `<option value="${p.code}" ${p.code===selectedCode?'selected':''}>${escapeHtml(p.name)}${p.code ? ' · '+escapeHtml(p.code) : ''}</option>`
    ).join('');
    opts += `<option value="__custom__" ${selectedCode==='__custom__'?'selected':''}>— Custom item in ${escapeHtml(selectedCategory)} —</option>`;
    return opts;
  }

  function clientOptionsHtml(q){
    const matched=E.findClientForQuotation ? E.findClientForQuotation(q) : null;
    const selected=q.clientId || (matched&&matched.id) || '';
    let opts=`<option value="">— Manual / New Client —</option>`;
    opts += (state.clients||[]).slice().sort((a,b)=>E.clientDisplayName(a).localeCompare(E.clientDisplayName(b))).map(c=>
      `<option value="${escapeHtml(c.id)}" ${c.id===selected?'selected':''}>${escapeHtml(E.clientDisplayName(c))}${c.contactPerson&&c.companyName?' — '+escapeHtml(c.contactPerson):''}</option>`
    ).join('');
    return opts;
  }

  function applyClientProfileToQuotation(container,q,clientId){
    q.clientId=clientId||'';
    const c=(state.clients||[]).find(x=>x.id===q.clientId);
    if(!c) return;
    q.customer=c.contactPerson||''; q.company=c.companyName||''; q.contact=c.contactDetails||''; q.address=c.address||'';
    if(c.preferredTerms) q.terms=c.preferredTerms;
    if(c.salesperson) q.salesperson=c.salesperson;
    const set=(sel,val)=>{ const el=E.qs(sel,container); if(el) el.value=val||''; };
    set('#f-customer',q.customer); set('#f-company',q.company); set('#f-contact',q.contact); set('#f-address',q.address); set('#f-terms',q.terms); set('#f-salesperson',q.salesperson);
  }

  function renderEditor(container){
    const q = current;
    const isNew = !state.quotations.find(x=>x.number===q.number);
    E.ensureQuotationShape(q);
    if(!Array.isArray(q.items)) q.items = [];
    // Only brand-new quotations receive a starter line. Existing records are never silently
    // overwritten with a blank item if their stored items are missing/malformed.
    if(q.items.length===0 && isNew) q.items = [blankItem()];
    if(!Array.isArray(q.payments)) q.payments = [];
    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Quotation</p><h2>${escapeHtml(q.number)}</h2></div>
        <div class="actions">
          <button class="btn" id="q-back-btn">← Back to list</button>
          ${!isNew ? '<button class="btn danger" id="q-delete-btn">Delete</button>' : ''}
          <button class="btn" id="q-print-btn">🖨 Print / PDF</button>
          <button class="btn primary" id="q-save-btn">Save Quotation</button>
        </div>
      </div>

      <div class="card">
        <h3>Quotation Details</h3>
        <div class="grid">
          <div class="field"><label>Quotation Number</label><input id="f-number" readonly value="${escapeHtml(q.number)}"></div>
          <div class="field"><label>Date</label><input id="f-date" type="date" value="${q.date||''}"></div>
          <div class="field"><label>Valid Until</label><input id="f-valid" type="date" value="${q.valid||''}"></div>
          <div class="field full">
            <label>Select Existing Client</label>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <select id="f-client-id" style="flex:1;min-width:240px;">${clientOptionsHtml(q)}</select>
              <button type="button" class="btn small" id="q-save-client-btn">Save / Update Client Profile</button>
              <button type="button" class="btn small" id="q-open-clients-btn">Open Client Database</button>
            </div>
            <div style="font-size:10.5px;color:var(--ink-soft);margin-top:5px;">Selecting a saved client auto-fills the details below. You can still type manually for one-time customers.</div>
          </div>
          <div class="field"><label>Customer / Contact Person</label><input id="f-customer" value="${escapeHtml(q.customer)}" placeholder="Juan Dela Cruz"></div>
          <div class="field"><label>Company Name</label><input id="f-company" value="${escapeHtml(q.company)}" placeholder="Green Bites Resto"></div>
          <div class="field"><label>Contact Details (Phone / Email)</label><input id="f-contact" value="${escapeHtml(q.contact)}" placeholder="Phone / email"></div>
          <div class="field full"><label>Address</label><input id="f-address" value="${escapeHtml(q.address)}" placeholder="Delivery / billing address"></div>
          <div class="field"><label>Salesperson</label><select id="f-salesperson">${state.settings.salespersons.map(s=>`<option ${s===q.salesperson?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Quotation Status</label><select id="f-qstatus">${state.settings.quotationStatuses.map(s=>`<option ${s===q.quotationStatus?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Order Status</label><select id="f-ostatus">${state.settings.orderStatuses.map(s=>`<option ${s===q.orderStatus?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field"><label>Terms</label><input id="f-terms" value="${escapeHtml(q.terms)}" placeholder="e.g. 50% DP, 50% on delivery"></div>
          <div class="field"><label>Expected Completion Date</label><input id="f-expected" type="date" value="${q.expectedCompletionDate||''}"></div>
          <div class="field"><label>Payment Due Date</label><input id="f-duedate" type="date" value="${q.paymentDueDate||''}"></div>
          <div class="field full"><label>Notes</label><textarea id="f-notes" placeholder="Anything else the client should know">${escapeHtml(q.notes)}</textarea></div>
        </div>
      </div>

      <div class="card">
        <h3>Line Items</h3>
        ${(!isNew && q.items.length===0) ? `<div style="background:var(--red-bg);color:var(--red);padding:9px 11px;border-radius:7px;margin-bottom:10px;font-size:12px;"><b>Data protection:</b> this saved quotation currently has no readable line items. The system will not auto-replace it with a blank line. Check your latest backup/recovery draft before saving new items.</div>` : ''}
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th style="width:20%">Category → Product / Service</th><th style="width:14%">Description</th>
              <th style="width:7%">Qty</th><th style="width:7%">Unit</th>
              <th style="width:9%">Unit Price</th><th style="width:8%">Discount</th>
              <th style="width:9%">Amount</th><th style="width:13%">Fulfillment Source</th><th style="width:4%"></th>
            </tr></thead>
            <tbody id="q-items-body"></tbody>
          </table>
        </div>
        <button class="btn small" id="q-add-item" style="margin-top:10px;">+ Add Item</button>

        <div style="display:flex;justify-content:flex-end;margin-top:16px;">
          <div style="width:300px;font-size:13px;">
            <div style="display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-soft);"><span>Subtotal</span><span id="t-subtotal"></span></div>
            <div style="display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-soft);"><span>Discount Total</span><span id="t-discount"></span></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;color:var(--ink-soft);">
              <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" id="f-vat-enabled" ${q.vatEnabled?'checked':''}> Apply VAT</label>
              <input type="number" id="f-vat-rate" value="${q.vatRate}" min="0" max="100" step="0.5" style="width:56px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:3px 5px;"> %
            </div>
            <div style="display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-soft);"><span>VAT Amount</span><span id="t-vat"></span></div>
            <div style="display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:16px;font-weight:800;"><span>Grand Total</span><span id="t-grand" style="font-family:var(--mono);"></span></div>
          </div>
        </div>
      </div>

      ${isNew ? `<div class="card"><p style="color:var(--ink-soft);font-size:12.5px;">Save this quotation first to start recording client payments against it.</p></div>` : `
      <div class="card">
        <h3>Payments Received</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th>Remarks</th><th></th></tr></thead>
            <tbody id="q-payments-body"></tbody>
          </table>
        </div>
        <button class="btn small" id="q-add-payment" style="margin-top:10px;">+ Record Payment</button>
        <div id="q-payment-form-slot"></div>
        <div style="display:flex;justify-content:flex-end;margin-top:14px;">
          <div style="width:280px;font-size:13px;">
            <div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-soft);"><span>Amount Paid</span><span id="q-amount-paid"></span></div>
            <div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-soft);"><span>Remaining Balance</span><span id="q-remaining-balance"></span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-weight:800;"><span>Payment Status</span><span id="q-payment-status-pill"></span></div>
