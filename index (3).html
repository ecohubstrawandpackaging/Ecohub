  // inventory immediately and cleans up/flags its supplier payable, since a removed item is gone
  // from q.items and can never be reconciled by the save-time loop.
  async function releaseItemFulfillment(q, it){
    releaseItemDeduction(q, it);
    const key = payableKey(q.number, it.id, it.code);
    const pay = state.payables.find(p=> payableKey(p.quotationNumber, p.itemId, p.productCode)===key);
    if(pay){
      if((Number(pay.amountPaid)||0)>0 || pay.locked){
        pay.cancelled = true; pay.remarks = (pay.remarks?pay.remarks+' | ':'')+'Auto-cancelled: item removed from quotation';
        recomputePayableTotals(pay);
        await E.storageSet('payable:'+pay.id, pay);
      } else {
        await E.storageDelete('payable:'+pay.id);
        state.payables = state.payables.filter(x=>x.id!==pay.id);
      }
    }
  }

  /* ---------------- main sync: called after every quotation save ---------------- */
  async function syncPayablesForQuotation(q){
    const existingForQuote = state.payables.filter(p=>p.quotationNumber===q.number);
    const existingByKey = {};
    existingForQuote.forEach(p=> existingByKey[payableKey(p.quotationNumber, p.itemId, p.productCode)] = p);

    const stage = (q.quotationStatus==='Approved' || E.CONFIRMED_ORDER_STATUSES.includes(q.orderStatus)) ? 'Actual' : 'Projected';
    const quotationCancelled = E.CANCELLED_QUOTATION_STATUSES.includes(q.quotationStatus) || q.orderStatus==='Cancelled';

    const seenKeys = new Set();

    for(const it of q.items){
      if(!it.code && it.code!=='__custom__') continue; // skip totally empty rows

      if(it.code==='__custom__' && !it.tempProductCode && !it.isService){
        const tempCode = nextTempProductCode();
        const newProduct = {
          code: tempCode, name: it.name||it.description||'Unnamed Item', category:'', unit: it.unit||'Piece',
          piecesPerBox:1, supplierPrice:0, shipping:0, handling:0, printing:0, packaging:0, other:0,
          sellingPrice: Number(it.price)||0, status:'Active', supplier:'', directSupplierOrder:false,
          costingRequired: true
        };
        state.products.push(newProduct);
        await E.storageSet('product:'+tempCode, newProduct);
        state.inventory[tempCode] = {code:tempCode, beginningStock:0, stockIn:0, returns:0, stockOut:0, reserved:0, damaged:0, reorderLevel:0, movements:[]};
        await E.storageSet('inventory:'+tempCode, state.inventory[tempCode]);
        it.tempProductCode = tempCode;
        it.code = tempCode;
        toast(`"${newProduct.name}" isn't in Product Costing yet — added as ${tempCode}, flagged Costing Required`);
      }

      // Always release whatever this line previously had deducted before recomputing — this makes
      // every save a clean, idempotent recalculation instead of an incremental patch, and is what
      // lets us correctly detect "available inventory" fresh on every save.
      releaseItemDeduction(q, it);

      // Printing, screen charges, delivery fees, and other explicitly-flagged non-inventory
      // services are never checked against stock and never generate a supplier payable.
      const product = it.isService ? null : state.products.find(p=>p.code===it.code);
      if(it.isService || !product){
        const key = payableKey(q.number, it.id, it.code);
        seenKeys.add(key);
        const pay = existingByKey[key];
        if(pay && !pay.locked && (Number(pay.amountPaid)||0)===0){
          await E.storageDelete('payable:'+pay.id);
          state.payables = state.payables.filter(x=>x.id!==pay.id);
        } else if(pay){
          pay.cancelled = true; pay.remarks = (pay.remarks?pay.remarks+' | ':'')+'Auto-cancelled: line marked as non-inventory service';
          recomputePayableTotals(pay);
          await E.storageSet('payable:'+pay.id, pay);
        }
        continue;
      }

      const key = payableKey(q.number, it.id, it.code);
      seenKeys.add(key);

      const inv = state.inventory[it.code];
      const avail = inv ? Math.max(0, E.availableStock(inv)) : 0;
      const qtyOrdered = Number(it.qty)||0;

      const resolution = resolveItemFulfillment(it, product, avail);
      let { qtyFromInventory, qtyToPurchase, warning } = resolution;

      // Apply the deduction (fresh, since we released above) and remember it on the item so the
      // NEXT save can release exactly this amount before recomputing again.
      if(qtyFromInventory>0){
        const actual = E.applyInventoryDeduction(it.code, qtyFromInventory, q, product, `Deducted for ${q.number} (${q.company||q.customer||''})`);
        it._deductedQty = actual; it._deductedCode = it.code;
        qtyFromInventory = actual; // in case of a race/clamp, keep numbers consistent
      }
      it._resolvedSource = resolution.resolvedSource==='Blocked' ? '' : resolution.resolvedSource;
      if(warning) toast(warning);

      const box = computeBoxMath(qtyToPurchase, product.piecesPerBox);

      // stash live figures on the item purely for display (Quotation Display section of the editor)
      it._availAtSave = avail; it._qtyFromInventory = qtyFromInventory; it._qtyToPurchase = qtyToPurchase;
      it._boxesToPurchase = box.boxesToPurchase; it._supplierPurchaseQty = box.supplierPurchaseQuantity; it._excessQty = box.excessQuantity;
      it._inventoryStatus = resolution.inventoryStatus;

      let pay = existingByKey[key];

      if(qtyToPurchase<=0){
        // Nothing needed from supplier for this line right now.
        if(pay && !pay.locked){
          if((Number(pay.amountPaid)||0)>0){
            pay.cancelled = true; pay.remarks = (pay.remarks?pay.remarks+' | ':'')+'Auto-cancelled: fully covered by inventory';
            recomputePayableTotals(pay);
            await E.storageSet('payable:'+pay.id, pay);
          } else {
            await E.storageDelete('payable:'+pay.id);
            state.payables = state.payables.filter(x=>x.id!==pay.id);
          }
        }
        continue;
      }

      const supplierName = (product && product.supplier) || (pay && pay.supplierName) || '';
      const profile = getSupplierProfile(supplierName);

      if(!pay){
        pay = {
          id: uid('pay'),
          quotationNumber: q.number, itemId: it.id,
          sourceType: 'Quotation', sourceId: q.number,
          quotationDate: q.date, client: q.company || q.customer || '',
          productCode: it.code, productName: it.name || it.description || '',
          variant: it.description || '',
          qtyOrdered, qtyFromInventory, qtyToPurchase,
          availableInventoryAtQuotation: avail,
          piecesPerBox: Number(product.piecesPerBox)||0,
          boxesToPurchase: box.boxesToPurchase, supplierPurchaseQuantity: box.supplierPurchaseQuantity, excessQuantity: box.excessQuantity,
          excessAllocation: it.excessAllocation || 'Add Excess to General Inventory',
          supplierName,
          supplierUnitCost: product ? E.productCostPerPiece(product) : (Number(it.cost)||0),
          costingIncomplete: !!(product && product.costingRequired),
          totalSupplierCost: 0,
          paymentTerm: profile.defaultPaymentTerm, paymentTermDays: profile.defaultPaymentTermDays,
          expectedPurchaseDate: '', dateOrderedFromSupplier: '', paymentDueDate: '',
          expectedDeliveryDate: '', actualDeliveryDate: '',
          amountPaid: 0, remainingBalance: 0,
          paymentStatus: 'For Purchase', purchaseStage: 'For Supplier Selection', remarks: '',
          stage, cancelled: false, locked: false, fixedTotal: false, needsReviewDueToCancellation: false,
          batch: 'First Payment Batch', customBatchDate: '',
          history: [],
          quantityReceivedTotal: 0, damagedQuantityTotal: 0, missingQuantityTotal: 0, receivingHistory: [],
          inventoryTreatment: 'Directly Allocated to Client Order'
        };
        recomputePayableTotals(pay);
        pushPayableAudit(pay, 'Created automatically — inventory insufficient for this quotation line');
        state.payables.unshift(pay);
        if(supplierName){
          const creditCheck = supplierAvailableCredit(supplierName) - pay.totalSupplierCost;
          const prof = getSupplierProfile(supplierName);
          if((Number(prof.creditLimit)||0)>0 && creditCheck<0){
            toast(`Warning: ${supplierName} credit limit may be exceeded by this purchase`);
            if(prof.enforceCreditLimit) pay.remarks = (pay.remarks?pay.remarks+' | ':'')+'⚠ Exceeds enforced credit limit — review before ordering';
          }
        }
      } else {
        pay.cancelled = false; // un-cancel if it re-qualifies
        pay.needsReviewDueToCancellation = false;
        pay.quotationDate = q.date; pay.client = q.company || q.customer || '';
        pay.productCode = it.code; pay.productName = it.name || it.description || '';
        pay.variant = it.description || '';
        pay.costingIncomplete = !!(product && product.costingRequired);
        pay.availableInventoryAtQuotation = avail;
        pay.piecesPerBox = Number(product.piecesPerBox)||0;
        if(!pay.locked){
          const qtyChanged = pay.qtyToPurchase !== qtyToPurchase;
          const costChanged = product && Math.abs((pay.supplierUnitCost||0) - E.productCostPerPiece(product)) > 0.0001;
          if(qtyChanged || costChanged) pushPayableAudit(pay, `Updated from quotation edit (was qty ${pay.qtyToPurchase}, cost ${peso(pay.supplierUnitCost)})`);
          pay.qtyOrdered = qtyOrdered; pay.qtyFromInventory = qtyFromInventory; pay.qtyToPurchase = qtyToPurchase;
          pay.boxesToPurchase = box.boxesToPurchase; pay.supplierPurchaseQuantity = box.supplierPurchaseQuantity; pay.excessQuantity = box.excessQuantity;
          pay.excessAllocation = it.excessAllocation || pay.excessAllocation || 'Add Excess to General Inventory';
          if(!pay.supplierName) pay.supplierName = supplierName;
        }
        // stage only ever moves forward (Projected -> Actual); never regress once Actual
        if(stage==='Actual') pay.stage = 'Actual';
        else if(!pay.stage) pay.stage = stage;
        if(!pay.paymentTerm) pay.paymentTerm = profile.defaultPaymentTerm;
        if(pay.paymentTermDays===undefined) pay.paymentTermDays = profile.defaultPaymentTermDays;
        recomputePayableTotals(pay);
      }

      // Quotation cancellation: never auto-delete or silently auto-cancel a payable that may
      // already be placed/paid with the supplier. Flag it "For Review" and require a manual
      // decision (unlock + cancel/remove) instead.
      if(quotationCancelled){
        pay.needsReviewDueToCancellation = true;
        if(!/For Review: quotation cancelled/.test(pay.remarks||'')){
          pay.remarks = (pay.remarks?pay.remarks+' | ':'')+'For Review: quotation cancelled — confirm before cancelling this payable';
        }
        recomputePayableTotals(pay);
      }

      await E.storageSet('payable:'+pay.id, pay);
    }

    // any payable that existed for this quotation but whose line item is gone now -> remove/cancel,
    // and make sure any inventory that was deducted for it gets released too.
    for(const pay of existingForQuote){
      const key = payableKey(pay.quotationNumber, pay.itemId, pay.productCode);
      if(seenKeys.has(key)) continue;
      if((Number(pay.amountPaid)||0)>0 || pay.locked){
        pay.cancelled = true; pay.remarks = (pay.remarks?pay.remarks+' | ':'')+'Auto-cancelled: item removed from quotation';
        recomputePayableTotals(pay);
        await E.storageSet('payable:'+pay.id, pay);
      } else {
        await E.storageDelete('payable:'+pay.id);
        state.payables = state.payables.filter(x=>x.id!==pay.id);
      }
    }
  }

  // Reverses ALL inventory this quotation's line items currently have deducted. Used when the
  // whole quotation is deleted or cancelled outright — the per-item reconciliation loop in
  // syncPayablesForQuotation only runs over items still present in q.items, so this is the
  // catch-all for "the quotation itself is going away."
  async function reverseAllInventoryForQuotation(q){
    for(const it of (q.items||[])){
      releaseItemDeduction(q, it);
    }
  }

  async function removePayablesForQuotation(quotationNumber, q){
    if(q) await reverseAllInventoryForQuotation(q);
    const toRemove = state.payables.filter(p=>p.quotationNumber===quotationNumber);
    for(const pay of toRemove){
      if((Number(pay.amountPaid)||0)>0){
        pay.cancelled = true; recomputePayableTotals(pay);
        await E.storageSet('payable:'+pay.id, pay);
      } else {
        await E.storageDelete('payable:'+pay.id);
        state.payables = state.payables.filter(x=>x.id!==pay.id);
      }
    }
  }

  E.recomputePayableStatus = recomputePayableStatus;
  E.recomputePayableTotals = recomputePayableTotals;
  E.syncPayablesForQuotation = syncPayablesForQuotation;
  E.previewItemFulfillment = previewItemFulfillment;
  E.releaseItemFulfillment = releaseItemFulfillment;
  /* ---------------- Direct Supplier Purchase payables (no quotation involved) ---------------- */
  async function createOrUpdatePayableFromPurchase(purchase){
    let pay = state.payables.find(p=>p.sourceType==='Direct Purchase' && p.sourceId===purchase.id);
    const totalCost = E.purchaseComputedPublic ? E.purchaseComputedPublic(purchase).totalPurchaseCost :
      ((Number(purchase.quantityPurchased)||0)*(Number(purchase.supplierUnitCost)||0)
      + (Number(purchase.shippingCost)||0)+(Number(purchase.handlingCost)||0)+(Number(purchase.printingCost)||0)+(Number(purchase.otherCharges)||0));
    const profile = getSupplierProfile(purchase.supplierName);
    const purchaseTerm = purchase.paymentTerm || profile.defaultPaymentTerm || '25 Days';
    const purchaseTermDays = purchase.paymentTermDays!==undefined ? Number(purchase.paymentTermDays)||0 : (profile.defaultPaymentTermDays!==undefined ? Number(profile.defaultPaymentTermDays)||0 : 25);
    if(!pay){
      pay = {
        id: uid('pay'),
        quotationNumber: null, itemId: null,
        sourceType: 'Direct Purchase', sourceId: purchase.id,
        purchaseBatchId: purchase.purchaseBatchId || '', purchaseOrderNumber: purchase.purchaseOrderNumber || purchase.referenceNumber || '',
        referenceNumber: purchase.referenceNumber || '', batchLineNumber: purchase.batchLineNumber || 0,
        quotationDate: purchase.purchaseDate, client: '',
        productCode: purchase.productCode, productName: purchase.productName,
        variant: purchase.variant || '',
        qtyOrdered: purchase.quantityPurchased, qtyFromInventory: 0, qtyToPurchase: purchase.quantityPurchased,
        supplierName: purchase.supplierName, supplierUnitCost: purchase.supplierUnitCost,
        totalSupplierCost: totalCost, fixedTotal: true,
        paymentTerm: purchaseTerm, paymentTermDays: purchaseTermDays,
        expectedPurchaseDate: purchase.expectedDeliveryDate, dateOrderedFromSupplier: purchase.purchaseDate,
        paymentDueDate: purchase.paymentDueDate || calcDueDate(purchase.purchaseDate, purchaseTerm, purchaseTermDays),
        expectedDeliveryDate: purchase.expectedDeliveryDate, actualDeliveryDate: purchase.actualDeliveryDate||'',
        amountPaid: 0, remainingBalance: 0,
        paymentStatus: 'For Purchase', purchaseStage: 'Ordered from Supplier', remarks: purchase.remarks || '',
        stage: 'Actual', cancelled: false, locked: false,
        batch: 'First Payment Batch', customBatchDate: '',
        history: []
      };
      pushPayableAudit(pay, 'Created automatically from Direct Supplier Purchase');
      state.payables.unshift(pay);
      if(purchase.supplierName){
        const remaining = supplierAvailableCredit(purchase.supplierName) - totalCost;
        if((Number(profile.creditLimit)||0)>0 && remaining<0){
          toast(`Warning: ${purchase.supplierName} credit limit may be exceeded by this purchase`);
        }
      }
    } else {
      const qtyChanged = pay.qtyToPurchase !== purchase.quantityPurchased;
      const costChanged = Math.abs((pay.supplierUnitCost||0) - (purchase.supplierUnitCost||0)) > 0.0001;
      if(qtyChanged || costChanged) pushPayableAudit(pay, `Updated from purchase edit (was qty ${pay.qtyToPurchase}, cost ${peso(pay.supplierUnitCost)})`);
      pay.quotationDate = purchase.purchaseDate;
      pay.purchaseBatchId = purchase.purchaseBatchId || pay.purchaseBatchId || '';
      pay.purchaseOrderNumber = purchase.purchaseOrderNumber || purchase.referenceNumber || pay.purchaseOrderNumber || '';
      pay.referenceNumber = purchase.referenceNumber || pay.referenceNumber || '';
      pay.batchLineNumber = purchase.batchLineNumber || pay.batchLineNumber || 0;
      pay.productCode = purchase.productCode; pay.productName = purchase.productName; pay.variant = purchase.variant||'';
      pay.qtyOrdered = purchase.quantityPurchased; pay.qtyToPurchase = purchase.quantityPurchased;
      pay.supplierName = purchase.supplierName; pay.supplierUnitCost = purchase.supplierUnitCost;
      pay.totalSupplierCost = totalCost;
      pay.paymentTerm = purchaseTerm; pay.paymentTermDays = purchaseTermDays;
      pay.expectedPurchaseDate = purchase.expectedDeliveryDate;
      pay.expectedDeliveryDate = purchase.expectedDeliveryDate;
      pay.dateOrderedFromSupplier = purchase.purchaseDate || pay.dateOrderedFromSupplier;
      pay.paymentDueDate = purchase.paymentDueDate || calcDueDate(pay.dateOrderedFromSupplier, purchaseTerm, purchaseTermDays);
    }
    recomputePayableTotals(pay);
    await E.storageSet('payable:'+pay.id, pay);
    return pay;
  }

  async function removePayableForPurchase(purchaseId){
    const pay = state.payables.find(p=>p.sourceType==='Direct Purchase' && p.sourceId===purchaseId);
    if(!pay) return;
    if((Number(pay.amountPaid)||0)>0){
      pay.cancelled = true; recomputePayableTotals(pay);
      await E.storageSet('payable:'+pay.id, pay);
    } else {
      await E.storageDelete('payable:'+pay.id);
      state.payables = state.payables.filter(x=>x.id!==pay.id);
    }
  }

  E.blankSupplierProfile = blankSupplierProfile;
  E.getSupplierProfile = getSupplierProfile;
  E.saveSupplierProfile = saveSupplierProfile;
  E.supplierOutstandingBalance = supplierOutstandingBalance;
  E.supplierAvailableCredit = supplierAvailableCredit;
  E.calcDueDate = calcDueDate;
  E.pushPayableAudit = pushPayableAudit;
  E.finalizeSupplierOrder = finalizeSupplierOrder;
  E.createOrUpdatePayableFromPurchase = createOrUpdatePayableFromPurchase;
  E.removePayableForPurchase = removePayableForPurchase;
  E.removePayablesForQuotation = removePayablesForQuotation;
})();
</script>

<script>
/* =====================================================================
   SUPPLIER PAYABLES — page (filters, summary, table, payment recording)
===================================================================== */
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO } = E;

  let filters = { supplier:'', client:'', quotation:'', product:'', dueDate:'', status:'', stage:'' };
  let showPaymentForm = false;
  let paymentSupplier = '';
  let quickPanel = null; // {type:'restock'} | {type:'payment', payableId, full}

  function statusPill(status){
    if(status==='Fully Paid') return 'green';
    if(status==='Overdue') return 'red';
    if(status==='Cancelled') return 'gray';
    if(['Partially Paid','Unpaid','Ordered from Supplier','Due Soon','Due Today','For Purchase'].includes(status)) return 'orange';
    return 'gray';
  }
  function stagePill(stage){ return stage==='Actual' ? 'green' : 'orange'; }

  function nextBatchLabel(){
    const day = new Date().getDate();
    return day<=15 ? 'First Payment Batch' : 'Second Payment Batch';
  }

  function visiblePayables(){
    return state.payables.filter(p=>{
      if(p.cancelled || p.archived || p.historicalSettled) return false;
      if(!filters.status && p.paymentStatus==='Fully Paid') return false;
      if(filters.supplier && p.supplierName!==filters.supplier) return false;
      if(filters.client && !(p.client||'').toLowerCase().includes(filters.client.toLowerCase())) return false;
      if(filters.quotation && ![p.sourceId,p.quotationNumber,p.purchaseOrderNumber,p.referenceNumber].filter(Boolean).join(' ').toLowerCase().includes(filters.quotation.toLowerCase())) return false;
      if(filters.product && !(p.productName||'').toLowerCase().includes(filters.product.toLowerCase())) return false;
      if(filters.dueDate && p.paymentDueDate!==filters.dueDate) return false;
      if(filters.status && p.paymentStatus!==filters.status) return false;
      if(filters.stage && p.stage!==filters.stage) return false;
      return true;
    }).sort((a,b)=> (a.paymentDueDate||'9999').localeCompare(b.paymentDueDate||'9999'));
  }

  function computeSummary(){
    const all = state.payables;
    const active = all.filter(p=>!p.cancelled && !p.archived && !p.historicalSettled);
    const sum = (arr,key)=> arr.reduce((s,p)=>s+(Number(p[key])||0),0);
    const monthKey = todayISO().slice(0,7);
    const nextBatch = nextBatchLabel();
    return {
      totalProjected: sum(active.filter(p=>p.stage==='Projected'),'totalSupplierCost'),
      totalActual: sum(active.filter(p=>p.stage==='Actual'),'totalSupplierCost'),
      totalUnpaid: sum(active.filter(p=>!['Fully Paid'].includes(p.paymentStatus)),'remainingBalance'),
      totalPartial: sum(active.filter(p=>p.paymentStatus==='Partially Paid'),'remainingBalance'),
      totalPaid: sum(active,'amountPaid'),
      totalOverdue: sum(active.filter(p=>p.paymentStatus==='Overdue'),'remainingBalance'),
      dueThisMonth: sum(active.filter(p=>(p.paymentDueDate||'').slice(0,7)===monthKey && p.paymentStatus!=='Fully Paid'),'remainingBalance'),
      dueNextBatch: sum(active.filter(p=>p.batch===nextBatch && p.paymentStatus!=='Fully Paid'),'remainingBalance'),
      nextBatch
    };
  }

  let openPayableGroups = new Set();

  function formatPayableDate(iso){
    if(!iso) return 'Not finalized yet';
    try{ return new Date(iso+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}); }
    catch(e){ return iso; }
  }

  function payableGroupKey(p){
    return p.dateOrderedFromSupplier ? ('date:'+p.dateOrderedFromSupplier) : 'unfinalized';
  }

  function payableGroupStatus(items){
    if(items.some(p=>p.paymentStatus==='Overdue')) return 'Overdue';
    if(items.some(p=>p.paymentStatus==='Due Today')) return 'Due Today';
    if(items.some(p=>p.paymentStatus==='Partially Paid')) return 'Partially Paid';
    if(items.every(p=>p.paymentStatus==='Fully Paid')) return 'Fully Paid';
    if(items.every(p=>!p.dateOrderedFromSupplier)) return 'For Purchase';
    if(items.some(p=>p.paymentStatus==='Due Soon')) return 'Due Soon';
    return 'Unpaid';
  }

  function groupPayables(rows){
    const map = new Map();
    rows.forEach(p=>{
      const key = payableGroupKey(p);
      if(!map.has(key)) map.set(key,{ key, date:p.dateOrderedFromSupplier||'', items:[] });
      map.get(key).items.push(p);
    });
    return Array.from(map.values()).map(g=>{
      g.items.sort((a,b)=>(a.paymentDueDate||'9999').localeCompare(b.paymentDueDate||'9999') || (a.supplierName||'').localeCompare(b.supplierName||''));
      g.totalCost = g.items.reduce((s,p)=>s+(Number(p.totalSupplierCost)||0),0);
      g.totalPaid = g.items.reduce((s,p)=>s+(Number(p.amountPaid)||0),0);
      g.balance = g.items.reduce((s,p)=>s+(Number(p.remainingBalance)||0),0);
      g.suppliers = [...new Set(g.items.map(p=>p.supplierName||'Unassigned supplier'))];
      g.clients = [...new Set(g.items.map(p=>p.client).filter(Boolean))];
      g.dueDates = [...new Set(g.items.map(p=>p.paymentDueDate).filter(Boolean))].sort();
      g.status = payableGroupStatus(g.items);
      return g;
    }).sort((a,b)=>{
      if(a.key==='unfinalized' && b.key!=='unfinalized') return 1;
      if(b.key==='unfinalized' && a.key!=='unfinalized') return -1;
      return (b.date||'').localeCompare(a.date||'');
    });
  }

  function groupDueLabel(g){
    if(!g.dueDates.length) return '—';
    if(g.dueDates.length===1) return formatPayableDate(g.dueDates[0]);
    return `${formatPayableDate(g.dueDates[0])} – ${formatPayableDate(g.dueDates[g.dueDates.length-1])}`;
  }

  async function removePayableEntry(p){
    if((Number(p.amountPaid)||0)>0) return {ok:false,reason:'paid'};
    if(p.sourceType==='Direct Purchase' && p.sourceId){
      const purchase = state.directPurchases.find(x=>x.id===p.sourceId);
      if(purchase){
        state.directPurchases = state.directPurchases.filter(x=>x.id!==purchase.id);
        await E.storageDelete('directpurchase:'+purchase.id);
      }
      state.payables = state.payables.filter(x=>x.id!==p.id);
      await E.storageDelete('payable:'+p.id);
      return {ok:true,mode:'deleted'};
    }
    p.archived = true;
    p.manualArchived = true;
    p.archivedAt = new Date().toISOString();
    p.archivedReason = 'Removed manually from grouped Supplier Payables';
    p.locked = true;
    if(E.pushPayableAudit) E.pushPayableAudit(p,'Removed manually from current Supplier Payables view');
    await E.storageSet('payable:'+p.id,p);
    return {ok:true,mode:'archived'};
  }

  function renderPayables(container){
    const rows = visiblePayables();
    const groups = groupPayables(rows);
    const s = computeSummary();
    const suppliers = state.settings.suppliers;

    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Operations</p><h2>Supplier Payables</h2></div>
        <div class="actions"><button class="btn" id="pay-restock-btn">+ New Supplier PO (Multi-Item)</button><button class="btn primary" id="pay-record-btn">+ Bulk Supplier Payment</button></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">
        Payables are <b>grouped by Ordered / PO Date</b>. Use <b>New Supplier PO (Multi-Item)</b> to enter one supplier order like a quotation: choose the supplier once, add as many product lines as needed, then save the whole PO in one action. Every line creates its linked payable automatically and stays inside the same purchase-date batch.
      </p>

      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="kpi"><div class="lbl">Total Projected Payables</div><div class="val">${peso(s.totalProjected)}</div></div>
        <div class="kpi"><div class="lbl">Total Actual Payables</div><div class="val">${peso(s.totalActual)}</div></div>
        <div class="kpi"><div class="lbl">Total Unpaid Balance</div><div class="val">${peso(s.totalUnpaid)}</div></div>
        <div class="kpi"><div class="lbl">Total Partially Paid</div><div class="val">${peso(s.totalPartial)}</div></div>
        <div class="kpi"><div class="lbl">Total Paid</div><div class="val">${peso(s.totalPaid)}</div></div>
        <div class="kpi"><div class="lbl">Total Overdue</div><div class="val">${peso(s.totalOverdue)}</div></div>
        <div class="kpi"><div class="lbl">Amount Due This Month</div><div class="val">${peso(s.dueThisMonth)}</div></div>
        <div class="kpi"><div class="lbl">Due — ${escapeHtml(s.nextBatch)}</div><div class="val">${peso(s.dueNextBatch)}</div></div>
      </div>

      <div id="pay-quick-slot"></div>
      <div id="pay-form-slot"></div>

      <div class="card">
        <h3>Filters</h3>
        <div class="grid" style="grid-template-columns:repeat(4,1fr);">
          <div class="field"><label>Supplier</label><select id="ft-supplier"><option value="">All suppliers</option>${suppliers.map(s2=>`<option ${s2===filters.supplier?'selected':''}>${escapeHtml(s2)}</option>`).join('')}</select></div>
          <div class="field"><label>Client</label><input id="ft-client" value="${escapeHtml(filters.client)}" placeholder="Search client…"></div>
          <div class="field"><label>Quotation / PO</label><input id="ft-quotation" value="${escapeHtml(filters.quotation)}" placeholder="QTN / PO / purchase ID…"></div>
          <div class="field"><label>Product</label><input id="ft-product" value="${escapeHtml(filters.product)}" placeholder="Search product…"></div>
          <div class="field"><label>Due Date</label><input id="ft-due" type="date" value="${filters.dueDate}"></div>
          <div class="field"><label>Payment Status</label><select id="ft-status"><option value="">All statuses</option>${E.PAYABLE_STATUSES.map(st=>`<option ${st===filters.status?'selected':''}>${escapeHtml(st)}</option>`).join('')}</select></div>
          <div class="field"><label>Projected / Actual</label><select id="ft-stage"><option value="">Both</option><option ${filters.stage==='Projected'?'selected':''}>Projected</option><option ${filters.stage==='Actual'?'selected':''}>Actual</option></select></div>
          <div class="field" style="display:flex;align-items:flex-end;"><button class="btn small" id="ft-clear">Clear filters</button></div>
        </div>
      </div>

      <div class="card">
        <h3 id="pay-groups-title">Purchase Batches (${groups.length}) · ${rows.length} item${rows.length===1?'':'s'}</h3>
        <div id="pay-groups"></div>
      </div>
    `;

    renderPayableRows(container);

    E.qs('#pay-restock-btn', container).addEventListener('click', ()=> E.openSupplierPOBatch(container,todayISO()));
    E.qs('#pay-record-btn', container).addEventListener('click', ()=>{ quickPanel=null; renderQuickPanel(container); showPaymentForm = !showPaymentForm; renderPaymentForm(container); });
    E.qs('#ft-supplier', container).addEventListener('change', e=>{ filters.supplier=e.target.value; renderPayables(container); });
    E.qs('#ft-client', container).addEventListener('input', e=>{ filters.client=e.target.value; renderPayableRows(container); updateCount(container); });
    E.qs('#ft-quotation', container).addEventListener('input', e=>{ filters.quotation=e.target.value; renderPayableRows(container); updateCount(container); });
    E.qs('#ft-product', container).addEventListener('input', e=>{ filters.product=e.target.value; renderPayableRows(container); updateCount(container); });
    E.qs('#ft-due', container).addEventListener('change', e=>{ filters.dueDate=e.target.value; renderPayableRows(container); updateCount(container); });
    E.qs('#ft-status', container).addEventListener('change', e=>{ filters.status=e.target.value; renderPayableRows(container); updateCount(container); });
    E.qs('#ft-stage', container).addEventListener('change', e=>{ filters.stage=e.target.value; renderPayableRows(container); updateCount(container); });
    E.qs('#ft-clear', container).addEventListener('click', ()=>{ filters = {supplier:'',client:'',quotation:'',product:'',dueDate:'',status:'',stage:''}; renderPayables(container); });

    if(showPaymentForm) renderPaymentForm(container);
    if(quickPanel) renderQuickPanel(container);
  }

  function updateCount(container){
    const rows = visiblePayables();
    const groups = groupPayables(rows);
    const h3 = E.qs('#pay-groups-title',container);
    if(h3) h3.textContent = `Purchase Batches (${groups.length}) · ${rows.length} item${rows.length===1?'':'s'}`;
  }

  function dueDays(pay){
    if(!pay.paymentDueDate || pay.paymentStatus==='Fully Paid') return null;
    const a=new Date(todayISO()+'T00:00:00'), b=new Date(pay.paymentDueDate+'T00:00:00');
    return Math.round((b-a)/86400000);
  }
  function dueLabel(pay){
    const d=dueDays(pay);
    if(d===null) return '—';
    if(d<0) return `${Math.abs(d)}d overdue`;
    if(d===0) return 'Due today';
    return `${d}d`;
  }
  function duePillClass(pay){ const d=dueDays(pay); return d===null?'gray':(d<0?'red':(d<=7?'orange':'green')); }

  function renderPayableRows(container){
    const host = E.qs('#pay-groups', container);
    const rows = visiblePayables();
    const groups = groupPayables(rows);
    if(!host) return;

    if(!groups.length){
      host.innerHTML = `<div class="empty-state">No current supplier payables. New customer shortages and purchases will appear here automatically.</div>`;
      return;
    }

    host.innerHTML = groups.map(g=>{
      const open = openPayableGroups.has(g.key);
      const supplierText = g.suppliers.length<=2 ? g.suppliers.join(', ') : `${g.suppliers.slice(0,2).join(', ')} +${g.suppliers.length-2} more`;
      const clientText = g.clients.length===0 ? '—' : (g.clients.length===1 ? g.clients[0] : `${g.clients.length} clients`);
      return `
        <div class="payable-group" data-group="${escapeHtml(g.key)}" style="border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--cream);">
          <div style="padding:14px 14px 12px;background:#fff;display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(150px,1.2fr) 90px 120px 120px minmax(140px,1fr) auto;gap:12px;align-items:center;">
            <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--kraft);font-weight:700;">Purchase / PO Date</div><div style="font-weight:800;font-size:14px;">${escapeHtml(formatPayableDate(g.date))}</div><div style="font-size:10.5px;color:var(--ink-soft);">${g.items.length} item${g.items.length===1?'':'s'}</div></div>
            <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;">Supplier(s)</div><div style="font-weight:700;">${escapeHtml(supplierText)}</div><div style="font-size:10.5px;color:var(--ink-soft);">${escapeHtml(clientText)}</div></div>
            <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;">Total</div><div style="font-family:var(--mono);font-weight:800;">${peso(g.totalCost)}</div></div>
            <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;">Paid</div><div style="font-family:var(--mono);font-weight:700;">${peso(g.totalPaid)}</div></div>
            <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;">Balance</div><div style="font-family:var(--mono);font-weight:800;color:var(--kraft-dark);">${peso(g.balance)}</div></div>
            <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;">Due</div><div style="font-size:12px;font-weight:700;">${escapeHtml(groupDueLabel(g))}</div><span class="pill ${statusPill(g.status)}" style="margin-top:4px;">${escapeHtml(g.status)}</span></div>
            <div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;">
              <button class="btn small pg-toggle" data-group="${escapeHtml(g.key)}">${open?'Close':'Open'}</button>
              <button class="btn small pg-add" data-group="${escapeHtml(g.key)}">+ Add Item</button>
              <button class="btn small danger pg-delete-batch" data-group="${escapeHtml(g.key)}">Delete Batch</button>
            </div>
          </div>
          ${open ? `
          <div style="padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--paper);">
            <div class="table-wrap">
              <table class="data" style="background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;">
                <thead><tr>
                  <th>Source</th><th>Client / Product</th><th>Supplier</th><th class="num">Qty</th><th class="num">Unit Cost</th><th class="num">Total</th>
                  <th>Ordered / PO</th><th>Term</th><th>Due</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th>Actions</th>
                </tr></thead>
                <tbody>
                  ${g.items.map(p=>`
                    <tr data-id="${p.id}">
                      <td><b>${escapeHtml(p.purchaseOrderNumber||p.referenceNumber||p.sourceId||p.quotationNumber||'—')}</b>${p.sourceType==='Direct Purchase' ? `<div style="font-size:9.5px;color:var(--kraft);font-weight:700;">SUPPLIER PO${p.batchLineNumber?' · LINE '+p.batchLineNumber:''}</div><div style="font-size:9px;color:var(--ink-soft);">${escapeHtml(p.sourceId||'')}</div>` : '<div style="font-size:9.5px;color:var(--ink-soft);">QUOTATION</div>'}</td>
                      <td><div style="font-weight:700;">${escapeHtml(p.client||'—')}</div><div style="font-size:11px;color:var(--ink-soft);">${escapeHtml(p.productName||'')}</div><div style="font-size:9.5px;color:var(--ink-soft);">From stock: ${(Number(p.qtyFromInventory)||0).toLocaleString()} · Supplier: ${(Number(p.qtyToPurchase)||0).toLocaleString()}</div></td>
                      <td>${escapeHtml(p.supplierName||'—')}</td>
                      <td class="num"><input class="v-qty" type="number" min="0" value="${Number(p.qtyToPurchase)||0}" style="width:74px;"></td>
                      <td class="num"><input class="v-cost" type="number" step="0.0001" value="${Number(p.supplierUnitCost)||0}" style="width:82px;"></td>
                      <td class="num v-total">${peso(p.totalSupplierCost)}</td>
                      <td>
                        <input class="v-ordered" type="date" value="${p.dateOrderedFromSupplier||''}" style="min-width:126px;">
                        <div style="font-size:9.5px;color:var(--ink-soft);margin-top:4px;">Expected <input class="v-expected" type="date" value="${p.expectedPurchaseDate||''}" style="width:122px;padding:3px 4px;font-size:10px;"></div>
                      </td>
                      <td>
                        <select class="v-term" style="min-width:105px;">${E.SUPPLIER_PAYMENT_TERMS.map(t=>`<option ${t===(p.paymentTerm||'25 Days')?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>
                        <input class="v-term-days" type="number" min="0" step="1" value="${Number(p.paymentTermDays)||25}" placeholder="Days" title="Custom payment term in days" style="width:68px;margin-top:4px;${p.paymentTerm==='Custom Terms'?'':'display:none;'}">
                      </td>
                      <td><input class="v-due" type="date" value="${p.paymentDueDate||''}" style="min-width:126px;"><div style="margin-top:4px;"><span class="pill ${duePillClass(p)} v-days">${escapeHtml(dueLabel(p))}</span></div></td>
                      <td class="num">${peso(p.amountPaid)}</td>
                      <td class="num v-balance">${peso(p.remainingBalance)}</td>
                      <td><span class="pill ${statusPill(p.paymentStatus)} v-statuspill">${escapeHtml(p.paymentStatus)}</span><div style="margin-top:4px;"><span class="pill ${stagePill(p.stage)}">${escapeHtml(p.stage)}</span></div>${p.needsReviewDueToCancellation ? `<div style="margin-top:4px;"><span class="pill red">For Review</span></div>` : ''}</td>
                      <td style="min-width:170px;">
                        <div style="display:flex;gap:4px;white-space:nowrap;flex-wrap:wrap;">
                          ${!p.dateOrderedFromSupplier ? `<button class="btn small qfinalize-po">Finalize PO</button>` : ''}
                          <button class="btn small qpay-full" ${!p.dateOrderedFromSupplier?'disabled title="Finalize PO first"':''}>Pay Full</button>
                          <button class="btn small qpay-partial" ${!p.dateOrderedFromSupplier?'disabled title="Finalize PO first"':''}>Partial</button>
                          <button class="btn small danger qdelete-payable">Delete</button>
                        </div>
                        <label style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-soft);margin-top:6px;"><input class="v-lock" type="checkbox" ${p.locked?'checked':''}> Lock from quotation sync</label>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>` : ''}
        </div>`;
    }).join('');

    host.querySelectorAll('.pg-toggle').forEach(btn=>btn.addEventListener('click',()=>{
      const key=btn.dataset.group;
      if(openPayableGroups.has(key)) openPayableGroups.delete(key); else openPayableGroups.add(key);
      renderPayableRows(container);
    }));

    host.querySelectorAll('.pg-add').forEach(btn=>btn.addEventListener('click',()=>{
      const g=groups.find(x=>x.key===btn.dataset.group);
      E.openSupplierPOBatch(container,(g&&g.date)||todayISO());
    }));

    host.querySelectorAll('.pg-delete-batch').forEach(btn=>btn.addEventListener('click',async()=>{
      const g=groups.find(x=>x.key===btn.dataset.group); if(!g) return;
      if(g.items.some(p=>(Number(p.amountPaid)||0)>0)){ toast('This batch has payment history. Delete the unpaid items individually instead.'); return; }
      if(!confirm(`Delete this purchase batch (${g.items.length} item${g.items.length===1?'':'s'}) from current payables? Direct purchases will also be removed.`)) return;
      for(const p of [...g.items]) await removePayableEntry(p);
      openPayableGroups.delete(g.key);
      toast('Purchase batch deleted');
      renderPayables(container);
    }));

    host.querySelectorAll('tr[data-id]').forEach(tr=>{
      const p = state.payables.find(x=>x.id===tr.dataset.id);
      if(!p) return;
      const updateDisplay = ()=>{
        E.recomputePayableTotals(p);
        const total=tr.querySelector('.v-total'), bal=tr.querySelector('.v-balance'), pill=tr.querySelector('.v-statuspill');
        if(total) total.textContent = peso(p.totalSupplierCost);
        if(bal) bal.textContent = peso(p.remainingBalance);
        if(pill){ pill.textContent = p.paymentStatus; pill.className = 'pill '+statusPill(p.paymentStatus)+' v-statuspill'; }
      };
      const persistNow = ()=>{ updateDisplay(); E.storageSet('payable:'+p.id, p); };
      const persistDebounced = ()=>{ updateDisplay(); E.debounceSave('payable:'+p.id, ()=> E.storageSet('payable:'+p.id, p)); };

      tr.querySelector('.v-qty').addEventListener('input', e=>{ p.qtyToPurchase = parseFloat(e.target.value)||0; persistDebounced(); });
      tr.querySelector('.v-cost').addEventListener('input', e=>{ p.supplierUnitCost = parseFloat(e.target.value)||0; persistDebounced(); });
      tr.querySelector('.v-qty').addEventListener('blur', ()=> E.flushSave('payable:'+p.id));
      tr.querySelector('.v-cost').addEventListener('blur', ()=> E.flushSave('payable:'+p.id));
      tr.querySelector('.v-expected').addEventListener('change', e=>{ p.expectedPurchaseDate = e.target.value; persistNow(); });
      tr.querySelector('.v-ordered').addEventListener('change', async e=>{
        p.dateOrderedFromSupplier = e.target.value;
        if(p.dateOrderedFromSupplier){
          p.purchaseStage = 'Ordered from Supplier';
          p.paymentDueDate = E.calcDueDate(p.dateOrderedFromSupplier, p.paymentTerm||'25 Days', p.paymentTermDays||25);
          E.pushPayableAudit(p, `Supplier order date set to ${p.dateOrderedFromSupplier}; due ${p.paymentDueDate||'—'}`);
        } else {
          p.purchaseStage = 'For Purchase';
          p.paymentDueDate = '';
        }
        await E.storageSet('payable:'+p.id,p);
        if(p.dateOrderedFromSupplier) openPayableGroups.add('date:'+p.dateOrderedFromSupplier);
        renderPayables(container);
      });
      tr.querySelector('.v-term').addEventListener('change', async e=>{
        p.paymentTerm=e.target.value;
        const d=E.paymentTermDefaultDays(p.paymentTerm);
        p.paymentTermDays=d===null?(Number(p.paymentTermDays)||25):d;
        if(p.dateOrderedFromSupplier) p.paymentDueDate=E.calcDueDate(p.dateOrderedFromSupplier,p.paymentTerm,p.paymentTermDays);
        await E.storageSet('payable:'+p.id,p);
        openPayableGroups.add(payableGroupKey(p));
        renderPayables(container);
      });
      const customDaysInput = tr.querySelector('.v-term-days');
      if(customDaysInput) customDaysInput.addEventListener('change', async e=>{
        p.paymentTermDays=Math.max(0,parseInt(e.target.value,10)||0);
        if(p.paymentTerm==='Custom Terms' && p.dateOrderedFromSupplier) p.paymentDueDate=E.calcDueDate(p.dateOrderedFromSupplier,p.paymentTerm,p.paymentTermDays);
        await E.storageSet('payable:'+p.id,p);
        openPayableGroups.add(payableGroupKey(p));
        renderPayables(container);
      });
      tr.querySelector('.v-due').addEventListener('change', async e=>{ p.paymentDueDate = e.target.value; await E.storageSet('payable:'+p.id,p); openPayableGroups.add(payableGroupKey(p)); renderPayables(container); });

      const finalizeBtn = tr.querySelector('.qfinalize-po');
      if(finalizeBtn) finalizeBtn.addEventListener('click', async ()=>{
        if(p.paymentTerm==='Custom Terms' && !(Number(p.paymentTermDays)>=0)){ toast('Enter the custom payment-term days first'); return; }
        E.finalizeSupplierOrder(p, todayISO());
        await E.storageSet('payable:'+p.id,p);
        openPayableGroups.add('date:'+p.dateOrderedFromSupplier);
        toast(`Supplier order finalized — due ${p.paymentDueDate||'—'}`);
        renderPayables(container);
      });
      tr.querySelector('.qpay-full').addEventListener('click', ()=>{
        if(!p.dateOrderedFromSupplier){ toast('Finalize the supplier order / set PO date before recording payment'); return; }
        quickPanel={type:'payment',payableId:p.id,full:true}; showPaymentForm=false; renderPaymentForm(container); renderQuickPanel(container);
      });
      tr.querySelector('.qpay-partial').addEventListener('click', ()=>{
        if(!p.dateOrderedFromSupplier){ toast('Finalize the supplier order / set PO date before recording payment'); return; }
        quickPanel={type:'payment',payableId:p.id,full:false}; showPaymentForm=false; renderPaymentForm(container); renderQuickPanel(container);
      });
      tr.querySelector('.qdelete-payable').addEventListener('click', async ()=>{
        if((Number(p.amountPaid)||0)>0){ toast('This payable has payment history and cannot be deleted.'); return; }
        const label = `${p.sourceId||p.quotationNumber||'Payable'} — ${p.productName||''}`;
        if(!confirm(`Delete ${label} from current payables?`)) return;
        const res=await removePayableEntry(p);
        if(!res.ok){ toast('Unable to delete this payable'); return; }
        toast(p.sourceType==='Direct Purchase'?'Purchase deleted':'Payable removed from current list');
        renderPayables(container);
      });
      tr.querySelector('.v-lock').addEventListener('change', e=>{ p.locked = e.target.checked; persistNow(); toast(p.locked ? 'Locked — quotation edits will no longer change this payable' : 'Unlocked'); });
    });
  }

  function syncQuickPaymentAccount(container){
    const method=E.qs('#qp-method',container), account=E.qs('#qp-account',container);
    if(!method||!account) return;
    let target=E.defaultAccountForPayment(method.value,'');
    if(['Bank Transfer','Check','Credit Card'].includes(method.value)){
      const bank=state.settings.cashAccounts.find(a=>!['Cash on Hand','GCash','Maya','Petty Cash'].includes(a));
      if(bank) target=bank;
    }
    if(Array.from(account.options).some(o=>o.value===target)) account.value=target;
  }

  function supplierPOCategoryList(selectedCategory){
    const seen=new Set();
    const rows=[];
    const add=value=>{
      const v=String(value||'').trim();
      if(!v || seen.has(v)) return;
      seen.add(v); rows.push(v);
    };
    (state.settings.categories||[]).forEach(add);
    (state.products||[]).forEach(p=>add(p.category));
    if(selectedCategory) add(selectedCategory);
    return rows.slice().sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base',numeric:true}));
  }

  function supplierPOResolvedCategory(line){
    if(line && line.category) return line.category;
    if(line && line.productCode){
      const p=state.products.find(x=>x.code===line.productCode);
      if(p && p.category) return p.category;
    }
    return '';
  }

  function supplierPOCategoryOptions(selectedCategory){
    let opts='<option value="">— Select category —</option>';
    opts += supplierPOCategoryList(selectedCategory).map(c=>
      `<option value="${escapeHtml(c)}" ${c===selectedCategory?'selected':''}>${escapeHtml(c)}</option>`
    ).join('');
    return opts;
  }

  function supplierPOProductOptions(selectedCode, selectedCategory){
    if(!selectedCategory) return '<option value="">— Select category first —</option>';
    let opts='<option value="">— Select product / manual —</option>';
    const products=(state.products||[])
      .filter(p=>p.category===selectedCategory && (p.status==='Active' || p.code===selectedCode))
      .slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'',undefined,{sensitivity:'base',numeric:true}));
    opts += products.map(p=>
      `<option value="${escapeHtml(p.code)}" ${p.code===selectedCode?'selected':''}>${escapeHtml(p.name)}${p.code?' · '+escapeHtml(p.code):''}</option>`
    ).join('');
    return opts;
  }

  function blankSupplierPOLine(){
    return { id:uid('pol'), category:'', productCode:'', productName:'', unit:'Piece', qty:0, unitCost:0 };
  }

  function ensureSupplierPOLines(){
    if(!quickPanel || quickPanel.type!=='restock') return [];
    if(!Array.isArray(quickPanel.lines) || quickPanel.lines.length===0) quickPanel.lines=[blankSupplierPOLine()];
    return quickPanel.lines;
  }

  function supplierPOLineTotal(line){ return (Number(line.qty)||0)*(Number(line.unitCost)||0); }

  function renderSupplierPOLines(container){
    const body=E.qs('#qr-lines-body',container);
    if(!body) return;
    const lines=ensureSupplierPOLines();
    const products=state.products;
    body.innerHTML=lines.map((line,idx)=>{
      const selectedCategory=supplierPOResolvedCategory(line);
      if(!line.category && selectedCategory) line.category=selectedCategory;
      return `<tr data-line-id="${escapeHtml(line.id)}">
      <td style="min-width:170px;"><select class="qr-line-category" style="font-weight:700;background:var(--sage-light);">${supplierPOCategoryOptions(selectedCategory)}</select></td>
      <td style="min-width:220px;"><select class="qr-line-product" ${selectedCategory?'':'disabled'}>${supplierPOProductOptions(line.productCode,selectedCategory)}</select></td>
      <td style="min-width:210px;"><input class="qr-line-name" value="${escapeHtml(line.productName)}" placeholder="Product / stock item"></td>
      <td style="min-width:90px;"><select class="qr-line-unit">${state.settings.units.map(u=>`<option ${u===line.unit?'selected':''}>${escapeHtml(u)}</option>`).join('')}</select></td>
      <td style="width:110px;"><input class="qr-line-qty" type="number" min="0" step="1" value="${Number(line.qty)||0}"></td>
      <td style="width:125px;"><input class="qr-line-cost" type="number" min="0" step="0.0001" value="${Number(line.unitCost)||0}"></td>
      <td class="num qr-line-total" style="font-weight:800;white-space:nowrap;">${peso(supplierPOLineTotal(line))}</td>
      <td style="width:38px;text-align:center;"><button class="row-del qr-line-remove" title="Remove line" ${lines.length===1?'disabled':''}>×</button></td>
    </tr>`;
    }).join('');

    const updateGrand=()=>{
      const total=ensureSupplierPOLines().reduce((s,l)=>s+supplierPOLineTotal(l),0);
      const el=E.qs('#qr-grand-total',container); if(el) el.textContent=peso(total);
      const count=E.qs('#qr-line-count',container); if(count) count.textContent=`${ensureSupplierPOLines().length} item${ensureSupplierPOLines().length===1?'':'s'}`;
    };

    body.querySelectorAll('tr[data-line-id]').forEach(tr=>{
      const line=lines.find(l=>l.id===tr.dataset.lineId); if(!line) return;
      const totalEl=tr.querySelector('.qr-line-total');
      const refreshLine=()=>{ if(totalEl) totalEl.textContent=peso(supplierPOLineTotal(line)); updateGrand(); };
      tr.querySelector('.qr-line-category').addEventListener('change',e=>{
        const oldProduct=products.find(p=>p.code===line.productCode);
        const oldNameWasAuto=!!oldProduct && line.productName===oldProduct.name;
        line.category=e.target.value;
        line.productCode='';
        if(oldNameWasAuto) line.productName='';
        if(oldProduct){ line.unit=state.settings.units[0]||'Piece'; line.unitCost=0; }
        const productSelect=tr.querySelector('.qr-line-product');
        productSelect.innerHTML=supplierPOProductOptions('',line.category);
        productSelect.disabled=!line.category;
        tr.querySelector('.qr-line-name').value=line.productName;
        tr.querySelector('.qr-line-unit').value=line.unit;
        tr.querySelector('.qr-line-cost').value=(Number(line.unitCost)||0).toFixed(4);
        refreshLine();
      });
      tr.querySelector('.qr-line-product').addEventListener('change',e=>{
        line.productCode=e.target.value;
        const prod=products.find(p=>p.code===line.productCode);
        if(prod){
          line.category=prod.category||line.category;
          line.productName=prod.name; line.unit=prod.unit||'Piece'; line.unitCost=E.productCostPerPiece(prod);
          tr.querySelector('.qr-line-name').value=line.productName;
          tr.querySelector('.qr-line-unit').value=line.unit;
          tr.querySelector('.qr-line-cost').value=(Number(line.unitCost)||0).toFixed(4);
        }
        refreshLine();
      });
      tr.querySelector('.qr-line-name').addEventListener('input',e=>{line.productName=e.target.value;});
      tr.querySelector('.qr-line-unit').addEventListener('change',e=>{line.unit=e.target.value;});
      tr.querySelector('.qr-line-qty').addEventListener('input',e=>{line.qty=parseFloat(e.target.value)||0;refreshLine();});
      tr.querySelector('.qr-line-cost').addEventListener('input',e=>{line.unitCost=parseFloat(e.target.value)||0;refreshLine();});
      tr.querySelector('.qr-line-remove').addEventListener('click',()=>{
        if(lines.length<=1) return;
        quickPanel.lines=lines.filter(l=>l.id!==line.id);
        renderSupplierPOLines(container);
      });
    });
    updateGrand();
  }

  function renderQuickPanel(container){
    const slot=E.qs('#pay-quick-slot',container);
    if(!slot) return;
    if(!quickPanel){ slot.innerHTML=''; return; }
    if(quickPanel.type==='payment'){
      const pay=state.payables.find(p=>p.id===quickPanel.payableId);
      if(!pay){ quickPanel=null; slot.innerHTML=''; return; }
      const balance=Math.max(0,Number(pay.remainingBalance)||0);
      slot.innerHTML=`<div class="card" style="border-color:var(--sage);"><h3>${quickPanel.full?'Pay Full':'Partial Payment'} — ${escapeHtml(pay.supplierName||'Supplier')}</h3>
        <p style="font-size:12px;color:var(--ink-soft);margin-top:-6px;">${escapeHtml(pay.sourceId||pay.quotationNumber||'—')} · ${escapeHtml(pay.productName||'')} · Balance <b>${peso(balance)}</b></p>
        <div class="grid">
          <div class="field"><label>Payment Date</label><input id="qp-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Amount</label><input id="qp-amount" type="number" step="0.01" min="0" value="${quickPanel.full?balance:''}" ${quickPanel.full?'readonly':''}></div>
          <div class="field"><label>Method</label><select id="qp-method">${state.settings.paymentMethods.map(m=>`<option>${escapeHtml(m)}</option>`).join('')}</select></div>
          <div class="field"><label>Paid From</label><select id="qp-account">${state.settings.cashAccounts.map(a=>`<option>${escapeHtml(a)}</option>`).join('')}</select></div>
          <div class="field"><label>Reference</label><input id="qp-ref" placeholder="Optional"></div>
          <div class="field"><label>Remarks</label><input id="qp-remarks" placeholder="Optional"></div>
        </div>
        <div class="actions" style="margin-top:10px;"><button class="btn" id="qp-cancel">Cancel</button><button class="btn primary" id="qp-save">Save Payment</button></div></div>`;
      E.qs('#qp-method',container).addEventListener('change',()=>syncQuickPaymentAccount(container)); syncQuickPaymentAccount(container);
      E.qs('#qp-cancel',container).addEventListener('click',()=>{quickPanel=null;renderQuickPanel(container);});
      E.qs('#qp-save',container).addEventListener('click',async()=>{
        if(!pay.dateOrderedFromSupplier){toast('Finalize the supplier order / set PO date before recording payment');return;}
        const amount=parseFloat(E.qs('#qp-amount',container).value)||0;
        if(amount<=0){toast('Enter an amount greater than zero');return;}
        if(amount>balance+0.004){toast('Payment cannot be more than the remaining balance');return;}
        pay.amountPaid=(Number(pay.amountPaid)||0)+amount; E.recomputePayableTotals(pay); await E.storageSet('payable:'+pay.id,pay);
        const payment={id:uid('sp'),supplier:pay.supplierName||'',paymentDate:E.qs('#qp-date',container).value,batch:'Quick Payment',amountPaid:amount,method:E.qs('#qp-method',container).value,referenceNumber:E.qs('#qp-ref',container).value,relatedPayables:[{payableId:pay.id,quotationNumber:pay.quotationNumber,product:pay.productName,amount}],remarks:E.qs('#qp-remarks',container).value};
        state.supplierPayments.unshift(payment); await E.storageSet('supplierPayment:'+payment.id,payment);
        const ledger=await E.createLedgerEntry({date:payment.paymentDate,transactionType:'Supplier Payment',source:'Supplier Payables — Quick Pay',referenceNumber:payment.referenceNumber,clientOrSupplier:pay.supplierName||'',account:E.qs('#qp-account',container).value,cashIn:0,cashOut:amount,remarks:payment.remarks||`${quickPanel.full?'Full':'Partial'} payment for ${pay.sourceId||pay.quotationNumber||pay.productName}`});
        payment.ledgerEntryId=ledger.id; await E.storageSet('supplierPayment:'+payment.id,payment);
        quickPanel=null; toast('Supplier payment saved'); renderPayables(container);
      });
      return;
    }

    if(quickPanel.type==='restock'){
      const defaultTerm='25 Days';
      const initialDate=(quickPanel&&quickPanel.date)||todayISO();
      if(!quickPanel.term) quickPanel.term=defaultTerm;
      if(!quickPanel.lines) quickPanel.lines=[blankSupplierPOLine()];
      const due=E.calcDueDate(initialDate,quickPanel.term,25);
      slot.innerHTML=`<div class="card" style="border-color:var(--sage);">
        <div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;">
          <div><h3 style="margin-bottom:4px;">New Supplier Purchase Order — Multi-Item</h3><p style="font-size:12px;color:var(--ink-soft);margin:0;">Quotation-style supplier entry: set the supplier/order details once, then add all products below before saving.</p></div>
          <div style="text-align:right;"><div style="font-size:10px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;">PO Total</div><div id="qr-grand-total" style="font-family:var(--mono);font-size:21px;font-weight:800;color:var(--kraft-dark);">${peso(0)}</div><div id="qr-line-count" style="font-size:10px;color:var(--ink-soft);">1 item</div></div>
        </div>
        <div class="grid" style="margin-top:16px;">
          <div class="field"><label>PO / Order Date</label><input id="qr-date" type="date" value="${initialDate}"></div>
          <div class="field"><label>Supplier</label><select id="qr-supplier">${state.settings.suppliers.map(s=>`<option>${escapeHtml(s)}</option>`).join('')}</select></div>
          <div class="field"><label>PO / Reference No.</label><input id="qr-ref" placeholder="Optional — auto-numbered if blank"></div>
          <div class="field"><label>Payment Term</label><select id="qr-term">${E.SUPPLIER_PAYMENT_TERMS.map(t=>`<option ${t===quickPanel.term?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select></div>
          <div class="field"><label>Due Date</label><input id="qr-due" type="date" value="${due}"></div>
          <div class="field"><label>Expected Delivery</label><input id="qr-delivery" type="date"></div>
          <div class="field full"><label>Remarks</label><input id="qr-remarks" placeholder="Optional note for the whole supplier order"></div>
        </div>

        <div style="margin-top:16px;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;">
          <div style="padding:10px 12px;background:var(--sage-light);display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <b style="font-size:12px;">PO Line Items</b><button class="btn small" id="qr-add-line">+ Add Product Row</button>
          </div>
          <div class="table-wrap"><table class="data" style="min-width:1060px;">
            <thead><tr><th>Category</th><th>Product</th><th>Product Name</th><th>Unit</th><th class="num">Qty</th><th class="num">Supplier Unit Cost</th><th class="num">Line Total</th><th></th></tr></thead>
            <tbody id="qr-lines-body"></tbody>
          </table></div>
        </div>
        <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">One Save creates one linked Direct Purchase + Supplier Payable per line, all sharing the same PO reference/date so they remain together as one purchase batch.</p>
        <div class="actions" style="margin-top:12px;"><button class="btn" id="qr-cancel">Cancel</button><button class="btn primary" id="qr-save">Save Entire Supplier PO</button></div>
      </div>`;
      renderSupplierPOLines(container);
      const updateDue=()=>{const term=E.qs('#qr-term',container).value;quickPanel.term=term;const d=E.paymentTermDefaultDays(term);E.qs('#qr-due',container).value=E.calcDueDate(E.qs('#qr-date',container).value,term,d===null?25:d);};
      E.qs('#qr-date',container).addEventListener('change',updateDue);
      E.qs('#qr-term',container).addEventListener('change',updateDue);
      E.qs('#qr-add-line',container).addEventListener('click',()=>{ensureSupplierPOLines().push(blankSupplierPOLine());renderSupplierPOLines(container);});
      E.qs('#qr-cancel',container).addEventListener('click',()=>{quickPanel=null;renderQuickPanel(container);});
      E.qs('#qr-save',container).addEventListener('click',async()=>{
        const supplier=E.qs('#qr-supplier',container).value;
        const purchaseDate=E.qs('#qr-date',container).value;
        const validLines=ensureSupplierPOLines().filter(l=>String(l.productName||'').trim() && (Number(l.qty)||0)>0);
        if(!supplier){toast('Choose a supplier');return;}
        if(!purchaseDate){toast('Choose the PO / order date');return;}
        if(!validLines.length){toast('Add at least one product with a quantity greater than zero');return;}
        if(validLines.length!==ensureSupplierPOLines().length){toast('Complete or remove blank product rows before saving');return;}
        const batchId='POB-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
        const manualRef=E.qs('#qr-ref',container).value.trim();
        const poNumber=manualRef || `PO-${purchaseDate.replace(/-/g,'')}-${Date.now().toString(36).slice(-4).toUpperCase()}`;
        const term=E.qs('#qr-term',container).value;
        const td=E.paymentTermDefaultDays(term);
        const termDays=td===null?25:td;
        const dueDate=E.qs('#qr-due',container).value||E.calcDueDate(purchaseDate,term,termDays);
        const delivery=E.qs('#qr-delivery',container).value;
        const remarks=E.qs('#qr-remarks',container).value;
        let created=0;
        for(let i=0;i<validLines.length;i++){
          const line=validLines[i];
          const prod=state.products.find(x=>x.code===line.productCode);
          const p=E.blankDirectPurchase();
          p.purchaseDate=purchaseDate; p.supplierName=supplier; p.referenceNumber=poNumber;
          p.purchaseBatchId=batchId; p.purchaseOrderNumber=poNumber; p.batchLineNumber=i+1;
          p.productCategory=line.category||''; p.productCode=line.productCode||''; p.productName=String(line.productName||'').trim(); p.unit=line.unit||'Piece';
          p.quantityPurchased=Number(line.qty)||0; p.piecesPerBox=prod?(Number(prod.piecesPerBox)||0):0;
          p.numberOfBoxes=p.piecesPerBox>0 ? p.quantityPurchased/p.piecesPerBox : 0;
          p.supplierUnitCost=Number(line.unitCost)||0; p.purchaseType='General Inventory Stock'; p.inventoryDestination='EcoHub General Inventory';
          p.expectedDeliveryDate=delivery; p.remarks=remarks; p.paymentTerm=term; p.paymentTermDays=termDays; p.paymentDueDate=dueDate;
          state.directPurchases.unshift(p);
          await E.storageSet('directpurchase:'+p.id,p);
          await E.createOrUpdatePayableFromPurchase(p);
          created++;
        }
        openPayableGroups.add('date:'+purchaseDate);
        quickPanel=null;
        toast(`${poNumber} saved — ${created} product line${created===1?'':'s'} added to Supplier Payables`);
        renderPayables(container);
      });
    }
  }

  /* ---------------- Payment recording ---------------- */

      </div>
    `;
    renderPayablesChecklist(container);

    E.qs('#pf-supplier', container).addEventListener('change', e=>{ paymentSupplier = e.target.value; renderPayablesChecklist(container); });
    E.qs('#pf-cancel', container).addEventListener('click', ()=>{ showPaymentForm=false; renderPaymentForm(container); });
    E.qs('#pf-save', container).addEventListener('click', async ()=>{
      const supplier = E.qs('#pf-supplier',container).value;
      const amount = parseFloat(E.qs('#pf-amount',container).value)||0;
      if(!supplier){ toast('Choose a supplier first'); return; }
      if(amount<=0){ toast('Enter an amount greater than zero'); return; }
      const checked = Array.from(container.querySelectorAll('.pf-check:checked')).map(c=>c.dataset.id);
      if(checked.length===0){ toast('Select at least one payable to apply this payment to'); return; }

      let remaining = amount;
      const selected = checked.map(id=>state.payables.find(p=>p.id===id)).filter(Boolean)
        .sort((a,b)=>(a.paymentDueDate||'9999').localeCompare(b.paymentDueDate||'9999'));
      const applied = [];
      for(const pay of selected){
        if(remaining<=0) break;
        const owed = Math.max(0, (Number(pay.totalSupplierCost)||0) - (Number(pay.amountPaid)||0));
        const apply = Math.min(remaining, owed);
        if(apply<=0) continue;
        pay.amountPaid = (Number(pay.amountPaid)||0) + apply;
        E.recomputePayableTotals(pay);
        await E.storageSet('payable:'+pay.id, pay);
        applied.push({payableId:pay.id, quotationNumber:pay.quotationNumber, product:pay.productName, amount:apply});
        remaining -= apply;
      }
      if(remaining>0.004){
        toast(`Payment saved — ₱${remaining.toFixed(2)} was more than the selected balances, so it wasn't applied`);
      } else {
        toast('Payment recorded and applied');
      }

      const payment = {
        id: uid('sp'), supplier, paymentDate: E.qs('#pf-date',container).value, batch: E.qs('#pf-batch',container).value,
        amountPaid: amount - Math.max(0,remaining), method: E.qs('#pf-method',container).value,
        referenceNumber: E.qs('#pf-ref',container).value, relatedPayables: applied,
        remarks: E.qs('#pf-remarks',container).value
      };
      state.supplierPayments.unshift(payment);
      await E.storageSet('supplierPayment:'+payment.id, payment);

      if(payment.amountPaid>0){
        const ledgerEntry = await E.createLedgerEntry({
          date: payment.paymentDate, transactionType:'Supplier Payment', source:'Supplier Payables',
          referenceNumber: payment.referenceNumber, clientOrSupplier: supplier,
          account: E.qs('#pf-account',container).value, cashIn:0, cashOut: payment.amountPaid,
          remarks: payment.remarks || `Payment to ${supplier} (${applied.length} payable${applied.length===1?'':'s'})`
        });
        payment.ledgerEntryId = ledgerEntry.id;
        await E.storageSet('supplierPayment:'+payment.id, payment);
      }

      showPaymentForm = false;
      renderPayables(container);
    });
  }

  function renderPayablesChecklist(container){
    const list = E.qs('#pf-payables-list', container);
    if(!paymentSupplier){ list.innerHTML = `<div style="color:var(--ink-soft);font-size:12.5px;">Choose a supplier above to see its unpaid payables.</div>`; return; }
    const candidates = state.payables.filter(p=>p.supplierName===paymentSupplier && !p.cancelled && p.paymentStatus!=='Fully Paid' && !!p.dateOrderedFromSupplier)
      .sort((a,b)=>(a.paymentDueDate||'9999').localeCompare(b.paymentDueDate||'9999'));
    if(!candidates.length){ list.innerHTML = `<div style="color:var(--ink-soft);font-size:12.5px;">No finalized / ordered unpaid payables for this supplier. Set an Ordered / PO Date first.</div>`; return; }
    list.innerHTML = candidates.map(p=>`
      <label style="display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:12.5px;border-bottom:1px solid var(--line);">
        <input type="checkbox" class="pf-check" data-id="${p.id}">
        <span style="flex:1;">${escapeHtml(p.sourceId||p.quotationNumber||'—')} — ${escapeHtml(p.productName)} <span style="color:var(--ink-soft);">(due ${escapeHtml(p.paymentDueDate||'—')})</span></span>
        <span style="font-family:var(--mono);">${peso(p.remainingBalance)}</span>
      </label>
    `).join('');
  }

  E.openSupplierPOBatch = function(container,date){
    quickPanel={type:'restock',date:date||todayISO(),lines:[blankSupplierPOLine()]};
    showPaymentForm=false;
    renderPaymentForm(container);
    renderQuickPanel(container);
    const slot=E.qs('#pay-quick-slot',container); if(slot&&slot.scrollIntoView) slot.scrollIntoView({behavior:'smooth',block:'start'});
  };
  E.renderPayables = renderPayables;
})();
</script>

<script>
/* =====================================================================
   FINANCE — Cash Ledger engine.
   Every cash movement, wherever it originates (client payment, supplier
   payment, expense, manual entry, transfer), lands here as one or more
   immutable ledger rows. Account balances are always DERIVED from the
   ledger, never stored/cached, so they can't drift out of sync.
===================================================================== */
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, uid, todayISO } = E;

  function nowTimeHHMM(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  async function createLedgerEntry(fields){
    const entry = Object.assign({
      id: uid('cl'),
      date: todayISO(), time: nowTimeHHMM(),
      transactionType: 'Other Income', source: '', referenceNumber: '',
      clientOrSupplier: '', account: state.settings.cashAccounts[0]||'Cash on Hand',
      cashIn: 0, cashOut: 0, recordedBy: '', remarks: '',
      createdAt: new Date().toISOString(), history: []
    }, fields);
    state.cashLedger.push(entry);
    await E.storageSet('cashledger:'+entry.id, entry);
    return entry;
  }

  async function updateLedgerEntry(entry, changes){
    if(!Array.isArray(entry.history)) entry.history = [];
    entry.history.unshift({ at: new Date().toISOString(), previous: {
      date:entry.date, account:entry.account, cashIn:entry.cashIn, cashOut:entry.cashOut, remarks:entry.remarks
    }});
    Object.assign(entry, changes);
    await E.storageSet('cashledger:'+entry.id, entry);
  }

  /* ---------------- balances ---------------- */
  function accountBalance(name){
    return state.cashLedger.reduce((s,e)=> e.account===name ? s + (Number(e.cashIn)||0) - (Number(e.cashOut)||0) : s, 0);
  }
  function allAccountBalances(){
    const configured = Array.isArray(state.settings.cashAccounts) ? state.settings.cashAccounts : [];
    const discovered = state.cashLedger.map(e=>e.account).filter(Boolean);
    const names = [...new Set([...configured,...discovered])];
    return names.map(name=>({ name, balance: accountBalance(name) }));
  }
  function totalCashAvailable(){
    return allAccountBalances().reduce((s,a)=>s+a.balance,0);
  }

  /* ---------------- date range helpers ---------------- */
  function startOfWeek(dateISO){
    const d = new Date(dateISO+'T00:00:00');
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = (day===0 ? 6 : day-1); // days since Monday
    d.setDate(d.getDate()-diff);
    return d.toISOString().slice(0,10);
  }
  function sumLedger(filterFn){
    let cashIn=0, cashOut=0;
    state.cashLedger.forEach(e=>{ if(filterFn(e)){ cashIn+=Number(e.cashIn)||0; cashOut+=Number(e.cashOut)||0; } });
    return { cashIn, cashOut, net: cashIn-cashOut };
  }

  /* ---------------- finance dashboard summary ---------------- */
  function computeFinanceSummary(ym){
    ym = ym || state.selectedMonth;
    const today = todayISO();
    const weekStart = startOfWeek(today);
    const yearStr = String(ym.year);

    const collectionsToday = sumLedger(e=>e.transactionType==='Client Payment' && e.date===today).cashIn;
    const collectionsWeek = sumLedger(e=>e.transactionType==='Client Payment' && e.date>=weekStart && e.date<=today).cashIn;
    const collectionsMonth = sumLedger(e=>e.transactionType==='Client Payment' && E.inMonth(e.date, ym)).cashIn;
    const collectionsYear = sumLedger(e=>e.transactionType==='Client Payment' && (e.date||'').slice(0,4)===yearStr).cashIn;

    const expensesToday = sumLedger(e=>['Expense','Other Expense'].includes(e.transactionType) && e.date===today).cashOut;
    const expensesMonth = sumLedger(e=>['Expense','Other Expense'].includes(e.transactionType) && E.inMonth(e.date, ym)).cashOut;
    const supplierPaymentsMonth = sumLedger(e=>e.transactionType==='Supplier Payment' && E.inMonth(e.date, ym)).cashOut;

    const totalCash = totalCashAvailable();
    const cashOnHand = accountBalance('Cash on Hand');
    const bankAccounts = allAccountBalances().filter(a=>!['Cash on Hand','GCash','Maya','Petty Cash'].includes(a.name));
    const totalBank = bankAccounts.reduce((s,a)=>s+a.balance,0);
    const gcashBalance = accountBalance('GCash');
    const mayaBalance = accountBalance('Maya');

    const outstandingReceivables = state.quotations
      .filter(E.isConfirmed)
      .reduce((s,q)=> s + E.quotationPaymentInfo(q).remainingBalance, 0);
    const outstandingPayables = E.computeOutstandingSupplierPayables();
    const inventoryValue = E.currentInventoryValue ? E.currentInventoryValue() : 0;
    const netCashPosition = totalCash + outstandingReceivables - outstandingPayables;
    const netOperatingPosition = totalCash + inventoryValue + outstandingReceivables - outstandingPayables;

    return {
      totalCash, cashOnHand, totalBank, gcashBalance, mayaBalance, inventoryValue, netOperatingPosition,
      collectionsToday, collectionsWeek, collectionsMonth, collectionsYear,
      expensesToday, expensesMonth, supplierPaymentsMonth,
      netCashPosition, outstandingReceivables, outstandingPayables,
      accountBalances: allAccountBalances()
    };
  }

  /* ---------------- period cash flow reports ---------------- */
  function cashFlowReport(startISO, endISO){
    const before = sumLedger(e=>e.date<startISO);
    const beginningBalance = before.net;
    const period = sumLedger(e=>e.date>=startISO && e.date<=endISO);
    return {
      totalCashIn: period.cashIn, totalCashOut: period.cashOut, netCashFlow: period.net,
      beginningBalance, endingBalance: beginningBalance + period.net
    };
  }
  function dailyCashFlow(dateISO){ dateISO = dateISO || todayISO(); return cashFlowReport(dateISO, dateISO); }
  function weeklyCashFlow(dateISO){ dateISO = dateISO || todayISO(); const s = startOfWeek(dateISO); return cashFlowReport(s, E.addDays(s,6)); }
  function monthlyCashFlow(ym){ ym = ym || state.selectedMonth; const s = `${ym.year}-${String(ym.month).padStart(2,'0')}-01`; const endD = new Date(ym.year, ym.month, 0).getDate(); const e = `${ym.year}-${String(ym.month).padStart(2,'0')}-${String(endD).padStart(2,'0')}`; return cashFlowReport(s,e); }
  function annualCashFlow(year){ year = year || state.selectedMonth.year; return cashFlowReport(`${year}-01-01`, `${year}-12-31`); }

  E.createLedgerEntry = createLedgerEntry;
  E.updateLedgerEntry = updateLedgerEntry;
  E.accountBalance = accountBalance;
  E.allAccountBalances = allAccountBalances;
  E.totalCashAvailable = totalCashAvailable;
  E.computeFinanceSummary = computeFinanceSummary;
  E.cashFlowReport = cashFlowReport;
  E.dailyCashFlow = dailyCashFlow;
  E.weeklyCashFlow = weeklyCashFlow;
  E.monthlyCashFlow = monthlyCashFlow;
  E.annualCashFlow = annualCashFlow;
  E.startOfWeek = startOfWeek;
})();
</script>

<script>
/* =====================================================================
   FINANCE DASHBOARD — separate page. Cards, manual entry, transfers,
   the full cash ledger, reports, and charts.
===================================================================== */
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO } = E;

  let panel = null; // 'manual' | 'transfer' | null
  let ledgerFilters = { account:'', type:'' };
  let reportPeriod = 'monthly'; // daily|weekly|monthly|annual

  function renderFinance(container){
    const s = E.computeFinanceSummary(state.selectedMonth);

    container.innerHTML = `

          <button class="btn" id="fin-transfer-btn">⇄ Transfer Funds</button>

        </div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">
        Monthly figures follow the Dashboard's month selector — currently <b>${escapeHtml(monthLabel)}</b>. <b>Cash on Hand is reconciled to the verified ₱62,007 position as of August 7, 2026.</b> Future collections, expenses, and supplier payments move the balance normally from that point.
      </p>

      <h3 style="font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--kraft);font-weight:700;margin:18px 0 8px;">Assets</h3>
      <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);">
        <div class="kpi"><div class="lbl">Total Cash Available</div><div class="val">${peso(s.totalCash)}</div></div>
        <div class="kpi"><div class="lbl">Cash on Hand</div><div class="val">${peso(s.cashOnHand)}</div></div>
        <div class="kpi"><div class="lbl">Total Bank Balance</div><div class="val">${peso(s.totalBank)}</div></div>
        <div class="kpi"><div class="lbl">GCash Balance</div><div class="val">${peso(s.gcashBalance)}</div></div>
        <div class="kpi"><div class="lbl">Maya Balance</div><div class="val">${peso(s.mayaBalance)}</div></div>
      </div>

      <h3 style="font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--kraft);font-weight:700;margin:18px 0 8px;">Income</h3>
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="kpi"><div class="lbl">Collections Today</div><div class="val">${peso(s.collectionsToday)}</div></div>
        <div class="kpi"><div class="lbl">Collections This Week</div><div class="val">${peso(s.collectionsWeek)}</div></div>
        <div class="kpi"><div class="lbl">Collections This Month</div><div class="val">${peso(s.collectionsMonth)}</div></div>
        <div class="kpi"><div class="lbl">Collections This Year</div><div class="val">${peso(s.collectionsYear)}</div></div>
      </div>

      <h3 style="font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--kraft);font-weight:700;margin:18px 0 8px;">Expenses</h3>
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="kpi"><div class="lbl">Expenses Today</div><div class="val">${peso(s.expensesToday)}</div></div>
        <div class="kpi"><div class="lbl">Expenses This Month</div><div class="val">${peso(s.expensesMonth)}</div></div>
        <div class="kpi"><div class="lbl">Supplier Payments This Month</div><div class="val">${peso(s.supplierPaymentsMonth)}</div></div>
      </div>

      <h3 style="font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--kraft);font-weight:700;margin:18px 0 8px;">Business Position</h3>
      <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);">
