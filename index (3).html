          </div>
        </div>
      </div>`}
    `;

    renderItemRows(container);
    recalcTotals(container);
    if(!isNew){ renderPaymentsSection(container); wirePaymentAddButton(container); }
    wireQuotationDraftProtection(container,q);

    E.qs('#q-back-btn', container).addEventListener('click', ()=>{
      if(!canLeaveQuotationEditor()) return;
      editorDirty=false; mode='list'; current=null; renderQuotations(container);
    });
    E.qs('#q-add-item', container).addEventListener('click', ()=>{
      q.items.push(blankItem()); markEditorDirty(); renderItemRows(container); recalcTotals(container);
      queueQuotationDraft(container,q);
    });
    E.qs('#f-vat-enabled', container).addEventListener('change', e=>{ q.vatEnabled=e.target.checked; markEditorDirty(); recalcTotals(container); });
    E.qs('#f-vat-rate', container).addEventListener('input', e=>{ q.vatRate=parseFloat(e.target.value)||0; markEditorDirty(); recalcTotals(container); });

    const clientSelect=E.qs('#f-client-id',container);
    if(clientSelect) clientSelect.addEventListener('change', e=>{
      applyClientProfileToQuotation(container,q,e.target.value); markEditorDirty(); queueQuotationDraft(container,q);
    });
    const saveClientBtn=E.qs('#q-save-client-btn',container);
    if(saveClientBtn) saveClientBtn.addEventListener('click',async()=>{
      readHeaderIntoState(container,q,{touchLastUpdated:false});
      if(!q.customer && !q.company){ toast('Add a customer or company name first'); return; }
      if(!E.upsertClientFromQuotation){ toast('Client Database is not available'); return; }
      const c=await E.upsertClientFromQuotation(q);
      if(c){ q.clientId=c.id; markEditorDirty(); renderEditor(container); toast('Client profile saved — ready for reuse'); }
    });
    const openClientsBtn=E.qs('#q-open-clients-btn',container);
    if(openClientsBtn) openClientsBtn.addEventListener('click',()=>{
      readHeaderIntoState(container,q,{touchLastUpdated:false}); queueQuotationDraft(container,q);
      if(!canLeaveQuotationEditor()) return;
      editorDirty=false; mode='list'; current=null; E.navigate('clients');
    });

    // Header values used to be read only when Save was clicked. Mark them dirty immediately so
    // navigation cannot silently discard typed client/company/date/notes data.
    ['#f-date','#f-valid','#f-client-id','#f-customer','#f-company','#f-contact','#f-address','#f-salesperson','#f-qstatus','#f-ostatus','#f-terms','#f-expected','#f-duedate','#f-notes']
      .forEach(sel=>{ const el=E.qs(sel,container); if(el) el.addEventListener('input', markEditorDirty); if(el && el.tagName==='SELECT') el.addEventListener('change', markEditorDirty); });

    if(!isNew){
      E.qs('#q-delete-btn', container).addEventListener('click', async ()=>{
        if(!confirm(`Delete quotation ${q.number}? This can't be undone. Any inventory already deducted for it will be returned to stock.`)) return;
        await E.storageDelete('quotation:'+q.number);
        state.quotations = state.quotations.filter(x=>x.number!==q.number);
        await E.removePayablesForQuotation(q.number, q);
        toast('Quotation deleted — inventory deductions reversed');
        mode='list'; current=null; renderQuotations(container);
      });
    }
    E.qs('#q-save-btn', container).addEventListener('click', async ()=>{
      if(editorSaving) return;
      readHeaderIntoState(container, q);
      if(!q.customer && !q.company){ toast('Add a customer or company name first'); return; }
      const meaningfulItems = (q.items||[]).filter(it=>it.code || (it.description||'').trim() || Number(it.qty)>1 || Number(it.price)>0);
      if(!meaningfulItems.length){ toast('Add at least one product or service line'); return; }

      editorSaving = true;
      const saveBtn = E.qs('#q-save-btn', container);
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      const draftTimer = quotationDraftTimerKey(q.number);
      try{
        // PHASE 0 — recovery copy first. If anything below fails, this remains available.
        await E.flushSave(draftTimer);
        await persistQuotationDraft(container,q);

        // PHASE 1 — permanently save the USER'S quotation data BEFORE touching derived modules.
        // This is the critical data-loss fix: inventory/payables errors can no longer prevent the
        // actual quotation lines, prices, descriptions, and header fields from being persisted.
        const idx = state.quotations.findIndex(x=>x.number===q.number);
        if(idx>=0) state.quotations[idx]=q; else state.quotations.unshift(q);

        const primarySaved = await E.storageSet('quotation:'+q.number, q);
        if(!primarySaved){
          toast('Quotation could not be permanently saved. A recovery draft was kept — do not close the page.');
          return;
        }

        const primarySavedAt = new Date().toISOString();
        await E.storageSet(quotationSaveMetaKey(q.number), {savedAt:primarySavedAt, syncStatus:'pending'});
        editorDirty = false;

        // PHASE 2 — derived bookkeeping. If this fails, the quotation itself is still safe.
        let syncOk = true;
        try{
          await E.syncPayablesForQuotation(q);
        }catch(syncErr){
          syncOk = false;
          console.error('quotation derived sync failed after safe save', syncErr);
        }

        // Persist bookkeeping fields written back to quotation items by the sync engine.
        const finalSaved = await E.storageSet('quotation:'+q.number, q);
        const finalSavedAt = new Date().toISOString();
        await E.storageSet(quotationSaveMetaKey(q.number), {
          savedAt:finalSavedAt,
          syncStatus:(syncOk && finalSaved) ? 'complete' : 'needs-review'
        });

        // Since the primary quotation is already safely stored, stale recovery drafts should not
        // override it on next open. Keep draft only if the permanent final write itself failed.
        if(finalSaved) await E.storageDelete(quotationDraftKey(q.number));

        if(syncOk && finalSaved){
          toast('Quotation saved safely — inventory & supplier payables updated');
        }else if(finalSaved){
          toast('Quotation data is saved. Inventory/payables sync needs another Save to retry.');
        }else{
          toast('Quotation data was saved before sync, but final bookkeeping save needs retry.');
        }
        renderEditor(container);
      }catch(err){
        console.error('quotation save failed', err);
        toast('Save hit an error. Your recovery draft was kept so the quotation data will not disappear.');
      }finally{
        editorSaving = false;
        const btn = E.qs('#q-save-btn', container);
        if(btn){ btn.disabled=false; btn.textContent='Save Quotation'; }
      }
    });
    E.qs('#q-print-btn', container).addEventListener('click', ()=>{
      readHeaderIntoState(container, q);
      E.buildPrintView(q);
      window.print();
    });
  }

  function readHeaderIntoState(container, q, options){
    options = options || {};
    q.date = E.qs('#f-date',container).value;
    q.valid = E.qs('#f-valid',container).value;
    const clientEl=E.qs('#f-client-id',container); q.clientId = clientEl ? clientEl.value : (q.clientId||'');
    q.customer = E.qs('#f-customer',container).value;
    q.company = E.qs('#f-company',container).value;
    q.contact = E.qs('#f-contact',container).value;
    q.address = E.qs('#f-address',container).value;
    q.salesperson = E.qs('#f-salesperson',container).value;
    q.quotationStatus = E.qs('#f-qstatus',container).value;
    q.orderStatus = E.qs('#f-ostatus',container).value;
    if(q.orderStatus==='Completed' && !q.completedDate) q.completedDate=E.todayISO();
    if(q.orderStatus!=='Completed') q.completedDate='';
    q.terms = E.qs('#f-terms',container).value;
    q.expectedCompletionDate = E.qs('#f-expected',container).value;
    q.paymentDueDate = E.qs('#f-duedate',container).value;
    q.notes = E.qs('#f-notes',container).value;
    q.vatEnabled = E.qs('#f-vat-enabled',container).checked;
    q.vatRate = parseFloat(E.qs('#f-vat-rate',container).value)||0;
    if(options.touchLastUpdated!==false) q.lastUpdated = E.todayISO();
  }

  const FULFILLMENT_SOURCES = ['Automatic','Use Inventory','Order Entire Quantity from Supplier','Mixed Fulfillment'];
  const EXCESS_OPTIONS = ['Add Excess to General Inventory','Add Excess to Client-Specific Stock','Keep as Supplier Purchase Excess','Manually Allocate'];

  function fulfillmentOptionsHtml(it){
    return FULFILLMENT_SOURCES.map(s=>`<option value="${s}" ${(it.fulfillmentSource||'Automatic')===s?'selected':''}>${s}</option>`).join('');
  }
  function excessOptionsHtml(it){
    return EXCESS_OPTIONS.map(s=>`<option value="${s}" ${(it.excessAllocation||EXCESS_OPTIONS[0])===s?'selected':''}>${s}</option>`).join('');
  }

  // Live, non-committing preview of how a line item WOULD be fulfilled if saved right now.
  // Mirrors the real allocation engine in the payables/inventory sync module (E.previewItemFulfillment),
  // but never writes to inventory — used only to render the badges under each line item.
  function previewFulfillment(it){
    if(it.isService) return null;
    if(!it.code || it.code==='__custom__') return null; // custom line without a saved product yet — nothing to check until saved
    const product = state.products.find(p=>p.code===it.code);
    if(!product) return null;
    return E.previewItemFulfillment(it, product);
  }

  function allocationRowHtml(it){
    const info = previewFulfillment(it);
    const showMixed = (it.fulfillmentSource==='Mixed Fulfillment');
    let badges = `<span style="color:var(--ink-soft);font-size:11.5px;">Non-inventory service — not checked against stock.</span>`;
    if(!it.isService){
      if(!info){
        badges = `<span style="color:var(--ink-soft);font-size:11.5px;">Select a product to see inventory allocation.</span>`;
      } else {
        const statusColor = info.inventoryStatus==='Fully Covered by Inventory' ? 'green'
          : info.inventoryStatus==='Insufficient Inventory' ? 'red'
          : (info.qtyToPurchase>0 ? 'orange' : 'gray');
        const supplierPurchaseQty = Number(info.supplierPurchaseQuantity ?? info.supplierPurchaseQty ?? 0);
        const excessQty = Number(info.excessQuantity ?? info.excessQty ?? 0);
        badges = `
          <span class="pill gray">Available: ${Number(info.avail||0).toLocaleString()}</span>
          <span class="pill ${statusColor}">${escapeHtml(info.inventoryStatus)}</span>
          ${info.qtyFromInventory>0 ? `<span class="pill green">From Inventory: ${Number(info.qtyFromInventory||0).toLocaleString()}</span>` : ''}
          ${info.qtyToPurchase>0 ? `<span class="pill orange">From Supplier: ${Number(info.qtyToPurchase||0).toLocaleString()}</span>` : ''}
          ${info.boxesToPurchase>0 ? `<span class="pill gray">Boxes: ${info.boxesToPurchase} × ${info.piecesPerBox} = ${supplierPurchaseQty.toLocaleString()}</span>` : ''}
          ${excessQty>0 ? `<span class="pill orange">Excess: ${excessQty.toLocaleString()}</span>` : ''}
          ${info.warning ? `<span style="color:var(--red);font-size:11.5px;display:block;margin-top:4px;">${escapeHtml(info.warning)}</span>` : ''}
        `;
      }
    }
    return `
      <tr class="alloc-row" data-alloc-for="${it.id}">
        <td colspan="9" style="padding:2px 8px 12px;border-bottom:1px solid var(--line);background:var(--sage-light);">
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
            <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-right:6px;">
              <input type="checkbox" class="c-service" ${it.isService?'checked':''}> Non-inventory service (printing, screen charge, delivery, etc.)
            </label>
            ${badges}
          </div>
          ${(!it.isService && showMixed) ? `
          <div style="display:flex;gap:14px;align-items:center;margin-top:8px;">
            <label style="font-size:11.5px;color:var(--ink-soft);font-weight:600;">Qty from Inventory (manual)
              <input class="c-mix-inv" type="number" min="0" step="1" value="${it.mixQtyInventory||0}" style="width:90px;margin-left:6px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;">
            </label>
            <span style="font-size:11.5px;color:var(--ink-soft);">Only used when Fulfillment Source = Mixed Fulfillment. Qty from Supplier is calculated automatically as Quotation Qty − Qty from Inventory.</span>
          </div>` : ''}
          ${(!it.isService && info && info.excessQty>0) ? `
          <div style="margin-top:8px;">
            <label style="font-size:11.5px;color:var(--ink-soft);font-weight:600;">Excess Stock Allocation
              <select class="c-excess" style="margin-left:6px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;">${excessOptionsHtml(it)}</select>
            </label>
          </div>` : ''}
        </td>
      </tr>`;
  }

  function renderItemRows(container){
    const q = current;
    const body = E.qs('#q-items-body', container);
    body.innerHTML = q.items.map(it=>{
      let allocationHtml='';
      try{ allocationHtml=allocationRowHtml(it); }
      catch(err){ console.error('quotation allocation preview failed',q.number,it,err); allocationHtml=`<tr data-alloc-for="${it.id}"><td colspan="9" style="padding:8px;color:var(--red);">Allocation preview unavailable, but this item can still be edited and saved.</td></tr>`; }
      const selectedCategory = resolvedItemCategory(it);
      if(!it.category && selectedCategory) it.category = selectedCategory;
      return `
      <tr data-id="${it.id}">
        <td>
          <select class="c-category" style="margin-bottom:6px;font-weight:700;background:var(--sage-light);">${categoryOptions(selectedCategory)}</select>
          <select class="c-product" ${selectedCategory?'':'disabled'}>${productOptions(it.code, selectedCategory)}</select>
        </td>
        <td><input class="c-desc" value="${escapeHtml(it.description)}" placeholder="Item description"></td>
        <td><input class="c-qty" type="number" min="0" step="1" value="${it.qty}"></td>
        <td><input class="c-unit" value="${escapeHtml(it.unit)}"></td>
        <td><input class="c-price" type="number" min="0" step="0.01" value="${it.price}"></td>
        <td><input class="c-discount" type="number" min="0" step="0.01" value="${it.discount}"></td>
        <td class="num c-amount">${peso(E.lineAmount(it))}</td>
        <td><select class="c-fulfillment">${fulfillmentOptionsHtml(it)}</select></td>
        <td><button class="row-del" title="Remove item">✕</button></td>
      </tr>
      ${allocationHtml}
    `;}).join('');

    body.querySelectorAll('tr[data-id]').forEach(tr=>{
      const item = q.items.find(i=>i.id===tr.dataset.id);
      const refreshAlloc = ()=>{
        const liveAllocRow = body.querySelector(`tr[data-alloc-for="${item.id}"]`);
        if(liveAllocRow) liveAllocRow.outerHTML = allocationRowHtml(item);
        wireAllocRow(item);
      };

      tr.querySelector('.c-category').addEventListener('change', e=>{
        const category = e.target.value;
        const oldProduct = state.products.find(p=>p.code===item.code);
        const descriptionWasProductName = !!oldProduct && item.description===oldProduct.name;
        item.category = category;
        item.code = '';
        item.name = '';
        item.cost = 0;
        // Clear fields that were automatically supplied by the old product, but preserve
        // genuinely custom descriptions typed by the user.
        if(descriptionWasProductName) item.description = '';
        if(oldProduct){
          item.unit = state.settings.units[0] || 'Piece';
          item.price = 0;
          tr.querySelector('.c-desc').value = item.description;
          tr.querySelector('.c-unit').value = item.unit;
          tr.querySelector('.c-price').value = item.price;
        }
        const productSelect = tr.querySelector('.c-product');
        productSelect.innerHTML = productOptions('', category);
        productSelect.disabled = !category;
        markEditorDirty(); recalcTotals(container); refreshAlloc();
      });

      tr.querySelector('.c-product').addEventListener('change', e=>{
        const code = e.target.value;
        const previousProduct = state.products.find(p=>p.code===item.code);
        item.code = code;
        if(code==='__custom__'){
          item.name = item.description || '';
          item.cost = 0;
          // category stays as the first-step selection
        } else if(!code){
          item.name = '';
          item.cost = 0;
        } else {
          const p = state.products.find(p=>p.code===code);
          if(p){
            const replaceDescription = !item.description || (previousProduct && item.description===previousProduct.name);
            item.name = p.name; item.category = p.category;
            if(replaceDescription) item.description = p.name;
            item.unit = p.unit; item.price = p.sellingPrice;
            item.cost = E.productCostPerPiece(p);
            tr.querySelector('.c-desc').value = item.description;
            tr.querySelector('.c-unit').value = item.unit;
            tr.querySelector('.c-price').value = item.price;
          }
        }
        markEditorDirty(); recalcTotals(container); refreshAlloc();
      });
      tr.querySelector('.c-desc').addEventListener('input', e=>{ item.description=e.target.value; if(!item.name) item.name=e.target.value; markEditorDirty(); });
      tr.querySelector('.c-qty').addEventListener('input', e=>{ item.qty=parseFloat(e.target.value)||0; markEditorDirty(); rowAmount(tr,item); recalcTotals(container); refreshAlloc(); });
      tr.querySelector('.c-unit').addEventListener('input', e=>{ item.unit=e.target.value; markEditorDirty(); });
      tr.querySelector('.c-price').addEventListener('input', e=>{ item.price=parseFloat(e.target.value)||0; markEditorDirty(); rowAmount(tr,item); recalcTotals(container); });
      tr.querySelector('.c-discount').addEventListener('input', e=>{ item.discount=parseFloat(e.target.value)||0; markEditorDirty(); rowAmount(tr,item); recalcTotals(container); });
      tr.querySelector('.c-fulfillment').addEventListener('change', e=>{ item.fulfillmentSource = e.target.value; markEditorDirty(); refreshAlloc(); });
      tr.querySelector('.row-del').addEventListener('click', async ()=>{
        if(q.items.length===1){ toast('A quotation needs at least one line item'); return; }
        // Release any inventory this line already had deducted, and clean up its supplier payable immediately —
        // otherwise the reversal would only happen on next Save, since a removed item can no longer be reconciled.
        await E.releaseItemFulfillment(q, item);
        q.items = q.items.filter(i=>i.id!==item.id);
        markEditorDirty(); renderItemRows(container); recalcTotals(container);
        queueQuotationDraft(container,q);
      });

      wireAllocRow(item);
    });

    function wireAllocRow(item){
      const allocRow = body.querySelector(`tr[data-alloc-for="${item.id}"]`);
      if(!allocRow) return;
      const svc = allocRow.querySelector('.c-service');
      if(svc) svc.addEventListener('change', e=>{ item.isService = e.target.checked; markEditorDirty(); const r=body.querySelector(`tr[data-alloc-for="${item.id}"]`); if(r) r.outerHTML = allocationRowHtml(item); wireAllocRow(item); });
      const mix = allocRow.querySelector('.c-mix-inv');
      if(mix) mix.addEventListener('input', e=>{ item.mixQtyInventory = parseFloat(e.target.value)||0; markEditorDirty(); });
      const exc = allocRow.querySelector('.c-excess');
      if(exc) exc.addEventListener('change', e=>{ item.excessAllocation = e.target.value; markEditorDirty(); });
    }
  }

  function rowAmount(tr,item){ tr.querySelector('.c-amount').textContent = peso(E.lineAmount(item)); }

  function paymentStatusPill(status){
    if(status==='Fully Paid') return 'green';
    if(status==='Overdue') return 'red';
    if(status==='Unpaid') return 'gray';
    return 'orange'; // Partially Paid
  }

  function renderPaymentsSection(container){
    const q = current;
    const body = E.qs('#q-payments-body', container);
    body.innerHTML = (q.payments && q.payments.length) ? q.payments.map(p=>`
      <tr data-id="${p.id}">
        <td>${escapeHtml(p.date)}</td>
        <td class="num">${peso(p.amount)}</td>
        <td>${escapeHtml(p.method)}</td>
        <td>${escapeHtml(p.reference)}</td>
        <td>${escapeHtml(p.remarks)}</td>
        <td><button class="row-del" title="Remove this payment">✕</button></td>
      </tr>
    `).join('') : `<tr><td colspan="6"><div class="empty-state">No payments recorded yet.</div></td></tr>`;

    body.querySelectorAll('[data-id]').forEach(tr=>{
      tr.querySelector('.row-del').addEventListener('click', async ()=>{
        const removed = q.payments.find(p=>p.id===tr.dataset.id);
        q.payments = q.payments.filter(p=>p.id!==tr.dataset.id);
        await E.storageSet('quotation:'+q.number, q);
        if(removed && removed.ledgerEntryId){
          state.cashLedger = state.cashLedger.filter(e=>e.id!==removed.ledgerEntryId);
          await E.storageDelete('cashledger:'+removed.ledgerEntryId);
        }
        renderPaymentsSection(container);
        toast('Payment entry removed');
      });
    });

    updatePaymentSummary(container);
  }

  function updatePaymentSummary(container){
    const q = current;
    const info = E.quotationPaymentInfo(q);
    container.querySelector('#q-amount-paid').textContent = peso(info.amountPaid);
    container.querySelector('#q-remaining-balance').textContent = peso(info.remainingBalance);
    const pill = container.querySelector('#q-payment-status-pill');
    pill.innerHTML = `<span class="pill ${paymentStatusPill(info.status)}">${info.status}</span>`;
  }

  function wirePaymentAddButton(container){
    const btn = E.qs('#q-add-payment', container);
    if(!btn) return;
    btn.addEventListener('click', ()=> togglePaymentForm(container));
  }

  function togglePaymentForm(container, show){
    const slot = E.qs('#q-payment-form-slot', container);
    if(!slot) return;
    const shouldShow = show!==undefined ? show : !slot.dataset.open;
    if(!shouldShow){ slot.innerHTML=''; slot.dataset.open=''; return; }
    slot.dataset.open = '1';
    slot.innerHTML = `
      <div class="grid" style="margin-top:10px;background:var(--sage-light);padding:12px;border-radius:8px;">
        <div class="field"><label>Payment Date</label><input id="pmt-date" type="date" value="${todayISO()}"></div>
        <div class="field"><label>Amount</label><input id="pmt-amount" type="number" step="0.01" min="0" value="0"></div>
        <div class="field"><label>Method</label><select id="pmt-method">${state.settings.paymentMethods.map(m=>`<option>${escapeHtml(m)}</option>`).join('')}</select></div>
        <div class="field"><label>Deposited To</label><select id="pmt-account">${state.settings.cashAccounts.map(a=>`<option>${escapeHtml(a)}</option>`).join('')}</select></div>
        <div class="field"><label>Reference Number</label><input id="pmt-ref" placeholder="Optional"></div>
        <div class="field full"><label>Remarks</label><input id="pmt-remarks" placeholder="Optional"></div>
      </div>
      <div class="actions" style="margin-top:8px;">
        <button class="btn small" id="pmt-cancel">Cancel</button>
        <button class="btn small primary" id="pmt-save">Save Payment</button>
      </div>
    `;
    const methodSelect = E.qs('#pmt-method',container);
    const accountSelect = E.qs('#pmt-account',container);
    function syncPaymentAccount(){
      const method = methodSelect.value;
      let target = E.defaultAccountForPayment(method,'');
      if(method==='Bank Transfer' || method==='Check' || method==='Credit Card'){
        const firstBank = state.settings.cashAccounts.find(a=>!['Cash on Hand','GCash','Maya','Petty Cash'].includes(a));
        if(firstBank) target=firstBank;
      }
      if(Array.from(accountSelect.options).some(o=>o.value===target)) accountSelect.value=target;
    }
    methodSelect.addEventListener('change',syncPaymentAccount);
    syncPaymentAccount();
    E.qs('#pmt-cancel', container).addEventListener('click', ()=> togglePaymentForm(container, false));
    E.qs('#pmt-save', container).addEventListener('click', async ()=>{
      const amount = parseFloat(E.qs('#pmt-amount',container).value)||0;
      if(amount<=0){ toast('Enter an amount greater than zero'); return; }
      const q = current;
      const account = E.qs('#pmt-account',container).value;
      const date = E.qs('#pmt-date',container).value;
      const method = E.qs('#pmt-method',container).value;
      const reference = E.qs('#pmt-ref',container).value;
      const remarks = E.qs('#pmt-remarks',container).value;
      q.payments.unshift({ id: uid('cpay'), date, amount, method, reference, remarks, account });
      await E.storageSet('quotation:'+q.number, q);
      const ledgerEntry = await E.createLedgerEntry({
        date, transactionType:'Client Payment', source:'Quotation', referenceNumber: reference,
        clientOrSupplier: q.company||q.customer||'', account, cashIn: amount, cashOut: 0,
        remarks: remarks || `Payment for ${q.number}`
      });
      q.payments[0].ledgerEntryId = ledgerEntry.id;
      await E.storageSet('quotation:'+q.number, q);
      toast('Payment recorded — added to Finance Dashboard');
      togglePaymentForm(container, false);
      renderPaymentsSection(container);
    });
  }

  function recalcTotals(container){
    const t = E.quotationTotals(current);
    container.querySelector('#t-subtotal').textContent = peso(t.subtotal);
    container.querySelector('#t-discount').textContent = peso(t.discountTotal);
    container.querySelector('#t-vat').textContent = peso(t.vat);
    container.querySelector('#t-grand').textContent = peso(t.grand);
  }

  E.renderQuotations = renderQuotations;
  E.openQuotationEditor = async function(container, quotationNumber){
    const base = state.quotations.find(q=>q.number===quotationNumber) || blankQuotation();
    current = await recoverQuotationDraft(base);
    mode='edit'; renderEditor(container);
  };
  E.canLeaveQuotationEditor = canLeaveQuotationEditor;
  E.resetQuotationsListMode = function(){
    mode='list'; current=null; editorDirty=false;
    const c=document.getElementById('main-content');
    if(c){ c.oninput=null; c.onchange=null; }
  };
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { peso, escapeHtml } = E;

  let salesFilter = '';

  function completedSalesTransactions(){
    return (state.quotations||[])
      .filter(q=>E.isRevenueRecognized(q))
      .slice()
      .sort((a,b)=>(b.completedDate||b.date||'').localeCompare(a.completedDate||a.date||''));
  }

  function salesClientIdentity(q){
    const matched = E.findClientForQuotation ? E.findClientForQuotation(q) : null;
    const display = matched && E.clientDisplayName ? E.clientDisplayName(matched) : String(q.company||q.customer||'Unassigned Client').trim();
    const normalized = E.normalizeClientName ? E.normalizeClientName(display) : display.toLowerCase();
    return {
      key: matched && matched.id ? 'client:'+matched.id : 'name:'+(normalized||'unassigned'),
      name: display || 'Unassigned Client'
    };
  }

  function computeGroupedSales(){
    const groups = new Map();
    for(const q of completedSalesTransactions()){
      const ident = salesClientIdentity(q);
      if(!groups.has(ident.key)){
        groups.set(ident.key, {
          key:ident.key, client:ident.name, transactions:[], transactionCount:0,
          totalSales:0, totalPaid:0, totalCost:0, totalProfit:0, latestDate:''
        });
      }
      const g = groups.get(ident.key);
      const totals = E.quotationTotals(q);
      const pay = E.quotationPaymentInfo(q);
      const recognizedDate = q.completedDate || q.date || '';
      g.transactions.push({q, totals, pay, recognizedDate});
      g.transactionCount += 1;
      g.totalSales += Number(totals.grand)||0;
      g.totalPaid += Number(pay.amountPaid)||0;
      g.totalCost += Number(totals.cogs)||0;
      g.totalProfit += Number(totals.grossProfit)||0;
      if(recognizedDate > g.latestDate) g.latestDate = recognizedDate;
    }
    return Array.from(groups.values()).sort((a,b)=>a.client.localeCompare(b.client,undefined,{sensitivity:'base',numeric:true}));
  }

  function salesItemDetailRows(q){
    return (q.items||[]).map(it=>{
      const qty=Number(it.qty)||0;
      const gross=qty*(Number(it.price)||0);
      const discount=Number(it.discount)||0;
      const net=Math.max(0,gross-discount);
      const cost=qty*(Number(it.cost)||0);
      const profit=net-cost;
      return `<tr>
        <td>${escapeHtml(it.name||it.description||'—')}</td>
        <td class="num">${qty.toLocaleString()}</td>
        <td class="num">${peso(Number(it.price)||0)}</td>
        <td class="num">${peso(net)}</td>
        <td class="num">${peso(cost)}</td>
        <td class="num" style="font-weight:700;">${peso(profit)}</td>
      </tr>`;
    }).join('');
  }

  function salesTransactionDetails(g){
    return g.transactions.map(({q,totals,pay,recognizedDate})=>`
      <div style="border:1px solid var(--line);border-radius:9px;background:#fff;margin:10px 0;overflow:hidden;">
        <div style="display:grid;grid-template-columns:minmax(150px,1.3fr) repeat(4,minmax(110px,.8fr));gap:10px;padding:11px 12px;background:var(--cream);align-items:center;">
          <div><b>${escapeHtml(q.number||'—')}</b><div style="font-size:11px;color:var(--ink-soft);">Completed ${escapeHtml(recognizedDate||'—')}</div></div>
          <div><div style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;">Total Sale</div><b>${peso(totals.grand)}</b></div>
          <div><div style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;">Paid</div><b>${peso(pay.amountPaid)}</b></div>
          <div><div style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;">Cost</div><b>${peso(totals.cogs)}</b></div>
          <div><div style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;">Profit</div><b>${peso(totals.grossProfit)}</b></div>
        </div>
        <div class="table-wrap" style="padding:10px 12px 12px;">
          <table class="data" style="font-size:12px;">
            <thead><tr><th>Product / Item</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Net Sale</th><th class="num">Cost</th><th class="num">Profit</th></tr></thead>
            <tbody>${salesItemDetailRows(q) || `<tr><td colspan="6"><div class="empty-state">No items recorded.</div></td></tr>`}</tbody>
          </table>
        </div>
      </div>`).join('');
  }

  function renderSales(container){
    const allGroups = computeGroupedSales();
    const needle = String(salesFilter||'').trim().toLowerCase();
    const groups = needle ? allGroups.filter(g=>g.client.toLowerCase().includes(needle) || g.transactions.some(x=>String(x.q.number||'').toLowerCase().includes(needle))) : allGroups;
    const summary = allGroups.reduce((a,g)=>{
      a.sales+=g.totalSales; a.paid+=g.totalPaid; a.cost+=g.totalCost; a.profit+=g.totalProfit; a.transactions+=g.transactionCount; return a;
    },{sales:0,paid:0,cost:0,profit:0,transactions:0});

    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Sales</p><h2>Sales Records</h2></div>
        <div class="actions"><input id="sales-search" value="${escapeHtml(salesFilter)}" placeholder="Search client or quotation…" style="min-width:240px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;"></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">Completed sales are compressed by client. See Total Paid, Total Cost, and Gross Profit immediately; click Open only when you need the quotation and item breakdown.</p>

      <div class="kpi-grid">
        <div class="kpi"><div class="lbl">Completed Transactions</div><div class="val">${summary.transactions.toLocaleString()}</div></div>
        <div class="kpi"><div class="lbl">Total Paid by Clients</div><div class="val">${peso(summary.paid)}</div></div>
        <div class="kpi"><div class="lbl">Total Cost</div><div class="val">${peso(summary.cost)}</div></div>
        <div class="kpi"><div class="lbl">Gross Profit</div><div class="val">${peso(summary.profit)}</div></div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Client</th><th class="num">Transactions</th><th>Latest Sale</th>
              <th class="num">Total Sales</th><th class="num">Total Paid</th><th class="num">Total Cost</th><th class="num">Gross Profit</th><th></th>
            </tr></thead>
            <tbody>
              ${groups.length ? groups.map((g,i)=>`
                <tr>
                  <td><b>${escapeHtml(g.client)}</b></td>
                  <td class="num">${g.transactionCount.toLocaleString()}</td>
                  <td>${escapeHtml(g.latestDate||'—')}</td>
                  <td class="num">${peso(g.totalSales)}</td>
                  <td class="num" style="font-weight:800;color:var(--ink);">${peso(g.totalPaid)}</td>
                  <td class="num">${peso(g.totalCost)}</td>
                  <td class="num" style="font-weight:800;color:${g.totalProfit<0?'var(--red)':'var(--ink)'};">${peso(g.totalProfit)}</td>
                  <td><button class="btn small sales-open-btn" data-sales-open="${i}">Open</button></td>
                </tr>
                <tr class="sales-detail-row" data-sales-detail="${i}" style="display:none;background:var(--sage-light);">
                  <td colspan="8" style="padding:12px 16px 16px;">
                    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
                      <div><b>${escapeHtml(g.client)} — Transaction Details</b><div style="font-size:11.5px;color:var(--ink-soft);">${g.transactionCount} completed transaction${g.transactionCount===1?'':'s'}</div></div>
                      <div style="font-size:12px;color:var(--ink-soft);">Paid ${peso(g.totalPaid)} · Cost ${peso(g.totalCost)} · Profit ${peso(g.totalProfit)}</div>
                    </div>
                    ${salesTransactionDetails(g)}
                  </td>
                </tr>
              `).join('') : `<tr><td colspan="8"><div class="empty-state">${allGroups.length?'No client matches your search.':'No completed sales yet. Set an order to Completed to recognize its sales and profit.'}</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const search=E.qs('#sales-search',container);
    if(search) search.addEventListener('input',e=>{ salesFilter=e.target.value; renderSales(container); const next=E.qs('#sales-search',container); if(next){ next.focus(); next.setSelectionRange(next.value.length,next.value.length); } });

    E.qsa('[data-sales-open]',container).forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx=btn.dataset.salesOpen;
        const row=E.qs(`[data-sales-detail="${idx}"]`,container);
        if(!row) return;
        const opening=row.style.display==='none';
        row.style.display=opening?'table-row':'none';
        btn.textContent=opening?'Close':'Open';
      });
    });
  }

  function renderPending(container){
    const rows = E.computePendingOrders();
    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Sales</p><h2>Pending / Ongoing Orders</h2></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">Every order not yet Completed or Cancelled. Update the Order Status on a quotation and it moves — or drops off — automatically.</p>
      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Quotation No.</th><th>Date</th><th>Client</th><th>Salesperson</th><th>Items</th><th class="num">Grand Total</th><th>Quotation Status</th><th>Order Status</th><th></th></tr></thead>
            <tbody>
              ${rows.length ? rows.map(q=>{
                const t = E.quotationTotals(q);
                const itemSummary = q.items.map(it=>it.name||it.description).filter(Boolean).join(', ');
                return `<tr>
                  <td><b>${escapeHtml(q.number)}</b></td>
                  <td>${escapeHtml(q.date||'')}</td>
                  <td>${escapeHtml(q.company||q.customer||'—')}</td>
                  <td>${escapeHtml(q.salesperson||'—')}</td>
                  <td style="max-width:220px;">${escapeHtml(itemSummary)}</td>
                  <td class="num">${peso(t.grand)}</td>
                  <td><span class="pill ${statusClass(q.quotationStatus)}">${escapeHtml(q.quotationStatus||'—')}</span></td>
                  <td><span class="pill ${statusClass(q.orderStatus)}">${escapeHtml(q.orderStatus||'—')}</span></td>
                  <td><button class="btn small" data-open="${escapeHtml(q.number)}">Open</button></td>
                </tr>`;
              }).join('') : `<tr><td colspan="9"><div class="empty-state">Nothing pending — every order is either Completed or Cancelled.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
    E.qsa('[data-open]', container).forEach(btn=>{
      btn.addEventListener('click', ()=>{ E.navigate('quotations'); E.openQuotationEditor(document.getElementById('main-content'), btn.dataset.open); });
    });
  }
  function statusClass(status){
    if(['Approved','Completed','Delivered','Shipped'].includes(status)) return 'green';
    if(['Cancelled','Expired'].includes(status)) return 'gray';
    if(['Declined'].includes(status)) return 'red';
    return 'orange';
  }

  E.renderSales = renderSales;
  E.renderPending = renderPending;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid } = E;

  function renderProducts(container){
    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Operations</p><h2>Product Costing</h2></div>
        <div class="actions"><button class="btn primary" id="p-add-btn">+ Add Product</button></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">Cost per piece here is what the Quotation editor locks in when you add a line item — later cost changes won't retroactively change past quotations.</p>
      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Code</th><th>Name</th><th>Category</th><th>Unit</th><th class="num">Pcs/Box</th>
              <th class="num">Supplier ₱/Box</th><th class="num">Ship</th><th class="num">Handle</th><th class="num">Print</th><th class="num">Pack</th><th class="num">Other</th>
              <th class="num">Cost/Pc</th><th class="num">Selling Price</th><th class="num">Margin %</th>
              <th>Supplier</th><th>Direct Order</th><th>Status</th><th></th>
            </tr></thead>
            <tbody id="p-body"></tbody>
          </table>
        </div>
      </div>
    `;
    renderProductRows(container);
    E.qs('#p-add-btn', container).addEventListener('click', ()=>{
      let n = state.products.length + 1;
      let code = 'NEW-'+String(n).padStart(3,'0');
      while(state.products.some(p=>p.code===code)){ n++; code = 'NEW-'+String(n).padStart(3,'0'); }
      state.products.push({code, name:'New Product', category:state.settings.categories[0]||'', unit:state.settings.units[0]||'Piece', piecesPerBox:1, supplierPrice:0, shipping:0, handling:0, printing:0, packaging:0, other:0, sellingPrice:0, status:'Active', supplier:state.settings.suppliers[0]||'', directSupplierOrder:false});
      renderProductRows(container);
    });
  }

  function renderProductRows(container){
    const body = E.qs('#p-body', container);
    body.innerHTML = state.products.map(p=>{
      const cost = E.productCostPerPiece(p);
      const margin = p.sellingPrice>0 ? ((p.sellingPrice-cost)/p.sellingPrice*100) : 0;
      return `<tr data-code="${escapeHtml(p.code)}">
        <td><input class="c-code" value="${escapeHtml(p.code)}" style="width:80px;"></td>
        <td><input class="c-name" value="${escapeHtml(p.name)}" style="width:150px;">${p.costingRequired?'<div class="pill red" style="margin-top:3px;">Costing Required</div>':''}</td>
        <td><select class="c-cat">${state.settings.categories.map(c=>`<option ${c===p.category?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></td>
        <td><select class="c-unit">${state.settings.units.map(u=>`<option ${u===p.unit?'selected':''}>${escapeHtml(u)}</option>`).join('')}</select></td>
        <td class="num"><input class="c-pieces" type="number" value="${p.piecesPerBox}" style="width:64px;"></td>
        <td class="num"><input class="c-supplier" type="number" value="${p.supplierPrice}" style="width:74px;"></td>
        <td class="num"><input class="c-ship" type="number" value="${p.shipping}" style="width:64px;"></td>
        <td class="num"><input class="c-handle" type="number" value="${p.handling}" style="width:64px;"></td>
        <td class="num"><input class="c-print" type="number" value="${p.printing}" style="width:64px;"></td>
        <td class="num"><input class="c-pack" type="number" value="${p.packaging}" style="width:64px;"></td>
        <td class="num"><input class="c-other" type="number" value="${p.other}" style="width:64px;"></td>
        <td class="num c-cost">${peso(cost)}</td>
        <td class="num"><input class="c-sell" type="number" step="0.01" value="${p.sellingPrice}" style="width:74px;"></td>
        <td class="num c-margin">${margin.toFixed(1)}%</td>
        <td><select class="c-supname">${state.settings.suppliers.map(s=>`<option ${s===p.supplier?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></td>
        <td style="text-align:center;"><input class="c-direct" type="checkbox" ${p.directSupplierOrder?'checked':''} title="Full quantity always goes to Supplier Payables (e.g. custom-printed items)"></td>
        <td><select class="c-status"><option ${p.status==='Active'?'selected':''}>Active</option><option ${p.status==='Inactive'?'selected':''}>Inactive</option><option ${p.status==='Discontinued'?'selected':''}>Discontinued</option></select></td>
        <td><button class="row-del">✕</button></td>
      </tr>`;
    }).join('') || `<tr><td colspan="17"><div class="empty-state">No products yet.</div></td></tr>`;

    body.querySelectorAll('tr').forEach(tr=>{
      const code = tr.dataset.code;
      const p = state.products.find(x=>x.code===code);
      if(!p) return;
      const fields = [['c-name','name',false],['c-cat','category',false],['c-unit','unit',false],
        ['c-pieces','piecesPerBox',true],['c-supplier','supplierPrice',true],['c-ship','shipping',true],['c-handle','handling',true],
        ['c-print','printing',true],['c-pack','packaging',true],['c-other','other',true],['c-sell','sellingPrice',true],
        ['c-supname','supplier',false],['c-status','status',false]];
      fields.forEach(([cls,key,numeric])=>{
        const el = tr.querySelector('.'+cls);
        if(!el) return;
        const evt = (el.tagName==='SELECT') ? 'change' : 'input';
        const doSave = ()=>{
          E.storageSet('product:'+p.code, p);
          if(state.inventory[p.code]) E.storageSet('inventory:'+p.code, state.inventory[p.code]);
        };
        el.addEventListener(evt, ()=>{
          p[key] = numeric ? (parseFloat(el.value)||0) : el.value;
          if(p.costingRequired && E.productCostPerPiece(p)>0){ p.costingRequired = false; toast(`${p.code} cost entered — cleared from Missing Cost Review`); }
          tr.querySelector('.c-cost').textContent = peso(E.productCostPerPiece(p));
          const m = p.sellingPrice>0 ? ((p.sellingPrice-E.productCostPerPiece(p))/p.sellingPrice*100) : 0;
          tr.querySelector('.c-margin').textContent = m.toFixed(1)+'%';
          if(evt==='change') doSave();
          else E.debounceSave('product:'+p.code, doSave);
        });
        if(evt==='input') el.addEventListener('blur', ()=> E.flushSave('product:'+p.code));
      });
      tr.querySelector('.c-direct').addEventListener('change', async e=>{
        p.directSupplierOrder = e.target.checked;
        await E.storageSet('product:'+p.code, p);
      });

      tr.querySelector('.c-code').addEventListener('change', async e=>{
        const oldCode = p.code;
        const newCode = E.sanitizeKeyPart(e.target.value);
        if(!newCode){
          toast('Product code cannot be empty or made only of spaces/slashes');
          e.target.value = oldCode; return;
        }
        if(newCode===oldCode){ e.target.value = newCode; return; }
        if(state.products.some(x=>x!==p && x.code===newCode)){
          toast(`Product code "${newCode}" is already in use — pick a different one`);
          e.target.value = oldCode; return;
        }
        e.target.value = newCode; // reflect any sanitization back into the field
        // Save the record under the NEW key first, confirm it worked, only then
        // remove the old key — never delete-before-confirm (that's what caused data loss).
        const newProduct = Object.assign({}, p, {code:newCode});
        const savedNew = await E.storageSet('product:'+newCode, newProduct);
        if(!savedNew){
          toast('Could not save the renamed product — code change was not applied');
          e.target.value = oldCode; return;
        }
        let newInventory = null;
        if(state.inventory[oldCode]){
          newInventory = Object.assign({}, state.inventory[oldCode], {code:newCode});
          const savedInv = await E.storageSet('inventory:'+newCode, newInventory);
          if(!savedInv){
            toast('Renamed product saved, but its inventory record could not move — please check Inventory');
          }
        }
        // Only now remove the old records.
        await E.storageDelete('product:'+oldCode);
        if(state.inventory[oldCode]) await E.storageDelete('inventory:'+oldCode);
        p.code = newCode;
        if(newInventory){ state.inventory[newCode] = newInventory; delete state.inventory[oldCode]; }
        tr.dataset.code = newCode;
        toast('Product code updated');
      });

      tr.querySelector('.row-del').addEventListener('click', async ()=>{
        if(!confirm(`Delete product ${p.code}? Existing quotations keep their saved cost/price.`)) return;
        await E.storageDelete('product:'+p.code);
        await E.storageDelete('inventory:'+p.code);
        state.products = state.products.filter(x=>x.code!==p.code);
        delete state.inventory[p.code];
        renderProductRows(container);
        toast('Product deleted');
      });
    });
  }

  E.renderProducts = renderProducts;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, peso, escapeHtml, toast, uid, todayISO } = E;

  /* ---------------- INVENTORY ---------------- */
  function availableStock(inv){
    // Available Inventory = Beginning Stock + Stock In + Returns − Stock Out − Reserved − Damaged
    return (Number(inv.beginningStock)||0)+(Number(inv.stockIn)||0)+(Number(inv.returns)||0)-(Number(inv.stockOut)||0)-(Number(inv.reserved)||0)-(Number(inv.damaged)||0);
  }
  function stockStatus(inv){
    const avail = availableStock(inv);
    if(avail<=0) return 'Out of Stock';
    if(avail<=(Number(inv.reorderLevel)||0)) return 'Low Stock';
    return 'In Stock';
  }
  function stockPill(status){
    if(status==='Out of Stock') return 'red';
    if(status==='Low Stock') return 'orange';
    return 'green';
  }

  /* ---------------- movement history + deduction/reversal (used by quotation fulfillment engine) ---------------- */
  function nowTimeHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  // Records one row in the product's movement log. Fields follow the required Inventory Movement History spec:
  // Movement ID, Date/Time, Product Code, Product Name, Previous Qty, Qty Changed, New Qty, Movement Type,
  // Quotation Number, Client, User, Remarks.
  function recordInventoryMovement(inv, opts){
    if(!Array.isArray(inv.movements)) inv.movements = [];
    inv.movements.unshift({
      id: uid('mv'), date: todayISO(), time: nowTimeHHMM(),
      productCode: opts.productCode, productName: opts.productName || opts.productCode,
      previousQuantity: opts.previousQuantity, quantityChanged: opts.quantityChanged, newQuantity: opts.newQuantity,
      type: opts.type, quotationNumber: opts.quotationNumber || '', client: opts.client || '',
      user: 'System', remarks: opts.remarks || ''
    });
  }

  // Deducts `qty` pieces of `code` from available inventory for a quotation line, and logs a
  // "Quotation Stock Out" movement tied to the quotation number. Clamps to available stock so
  // inventory can never go negative. Returns the quantity actually deducted.
  function applyInventoryDeduction(code, qty, q, product, remarks){
    const inv = state.inventory[code];
    if(!inv || qty<=0) return 0;
    const prevBalance = availableStock(inv);
    const actual = Math.max(0, Math.min(qty, prevBalance));
    if(actual<=0) return 0;
    inv.stockOut = (Number(inv.stockOut)||0) + actual;
    const newBalance = availableStock(inv);
    recordInventoryMovement(inv, {
      productCode: code, productName: product ? product.name : code,
      previousQuantity: prevBalance, quantityChanged: -actual, newQuantity: newBalance,
      type: 'Quotation Stock Out', quotationNumber: q.number, client: q.company || q.customer || '',
      remarks: remarks || `Deducted for ${q.number}`
    });
    E.storageSet('inventory:'+code, inv);
    return actual;
  }

  // Reverses a previous "Quotation Stock Out" deduction (e.g. quotation edited, item removed, or
  // quotation cancelled) and logs a "Quotation Stock Out Reversal" movement. The original movement
  // is preserved for the audit trail — this adds a new offsetting entry rather than deleting history.
  function reverseInventoryDeduction(code, qty, q, product, remarks){
    const inv = state.inventory[code];
    if(!inv || qty<=0) return;
    const prevBalance = availableStock(inv);
    inv.stockOut = Math.max(0, (Number(inv.stockOut)||0) - qty);
    const newBalance = availableStock(inv);
    recordInventoryMovement(inv, {
      productCode: code, productName: product ? (product.name||product) : code,
      previousQuantity: prevBalance, quantityChanged: qty, newQuantity: newBalance,
      type: 'Quotation Stock Out Reversal', quotationNumber: q.number, client: q.company || q.customer || '',
      remarks: remarks || `Reversed for ${q.number}`
    });
    E.storageSet('inventory:'+code, inv);
  }

  function computeInventorySummary(){
    const rows = state.products.map(p=>{
      const inv = state.inventory[p.code] || {beginningStock:0,stockIn:0,returns:0,stockOut:0,reserved:0,damaged:0,reorderLevel:100};
      const avail = availableStock(inv);
      const cost = E.productCostPerPiece(p);
      return { p, inv, avail, value: avail*cost, status: stockStatus(inv) };
    });
    const totalGeneralValue = rows.reduce((s,r)=>s+r.value,0);
    const totalCupValue = E.computeCupStockCardValue ? E.computeCupStockCardValue() : 0;
    const rawTotalValue = totalGeneralValue+totalCupValue;
    const reconciliationAdjustment = E.inventoryValueAdjustment ? E.inventoryValueAdjustment() : 0;
    const totalQuantity = rows.reduce((s,r)=>s+r.avail,0);
    const lowStock = rows.filter(r=>r.status==='Low Stock').length;
    const outStock = rows.filter(r=>r.status==='Out of Stock').length;
    const byCat = {};
    rows.forEach(r=>{ const c = r.p.category||'Uncategorized'; byCat[c]=(byCat[c]||0)+r.value; });
    return {
      totalValue: rawTotalValue+reconciliationAdjustment, rawTotalValue, reconciliationAdjustment, totalGeneralValue, totalCupValue,
      totalQuantity, numProducts: state.products.length, lowStock, outStock,
      byCategory: Object.entries(byCat).sort((a,b)=>b[1]-a[1])
    };
  }

  function renderInventory(container){
    const s = computeInventorySummary();
    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Operations</p><h2>Inventory</h2></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">Update Stock In / Stock Out as deliveries and shipments happen. <b>Total Inventory Value is reconciled to the verified ₱337,993 position as of August 7, 2026</b>; future stock movements continue from that baseline without changing your underlying quantities or product costs.</p>

      <div class="card">
        <h3>Inventory Summary</h3>
        <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
          <div class="kpi"><div class="lbl">Total Inventory Value</div><div class="val">${peso(s.totalValue)}</div></div>
          <div class="kpi"><div class="lbl">General Inventory Value</div><div class="val">${peso(s.totalGeneralValue)}</div></div>
          <div class="kpi"><div class="lbl">Client Cup Inventory Value</div><div class="val">${peso(s.totalCupValue)}</div></div>
          <div class="kpi"><div class="lbl">Reconciliation Adjustment</div><div class="val">${peso(s.reconciliationAdjustment)}</div></div>
          <div class="kpi"><div class="lbl">Total Inventory Quantity</div><div class="val">${s.totalQuantity.toLocaleString()}</div></div>
          <div class="kpi"><div class="lbl"># of Products</div><div class="val">${s.numProducts}</div></div>
          <div class="kpi"><div class="lbl">Low Stock Items</div><div class="val">${s.lowStock}</div></div>
          <div class="kpi"><div class="lbl">Out of Stock Items</div><div class="val">${s.outStock}</div></div>
        </div>
        <h4 style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:16px 0 8px;">Value by Category</h4>
        ${E.charts.barChart(s.byCategory.map(([label,value])=>({label, value:Math.round(value)})))}
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Code</th><th>Product</th><th class="num">Beginning</th><th class="num">Stock In</th><th class="num">Returns</th><th class="num">Stock Out</th>
              <th class="num">Reserved</th><th class="num">Damaged</th><th class="num">Available</th><th class="num">Reorder At</th>
              <th class="num">Unit Cost</th><th class="num">Inventory Value</th><th>Status</th>
            </tr></thead>
            <tbody id="i-body"></tbody>
          </table>
        </div>
        <p style="color:var(--ink-soft);font-size:11.5px;margin:10px 2px 0;">Available Inventory = Beginning Stock + Stock In + Returns − Stock Out − Reserved − Damaged. "Stock Out" here also reflects automatic deductions made when quotations are fulfilled from inventory — see Stock Movement History below.</p>
      </div>

      <div class="card">
        <h3>Stock Movement History</h3>
        <div class="table-wrap">
          <table class="data">
            <thead><tr>
              <th>Date</th><th>Product</th><th>Movement Type</th><th class="num">Qty</th>
              <th class="num">Prev. Bal.</th><th class="num">New Bal.</th><th>Quotation #</th><th>Client</th><th>Remarks</th>
            </tr></thead>
            <tbody id="i-movements-body"></tbody>
          </table>
        </div>
      </div>
    `;
    renderInventoryRows(container);
    renderInventoryMovements(container);
  }

  function renderInventoryMovements(container){
    const body = E.qs('#i-movements-body', container);
    if(!body) return;
    const rows = [];
    Object.values(state.inventory).forEach(inv=>{
      (inv.movements||[]).forEach(m=> rows.push(Object.assign({}, m, {code: inv.code})));
    });
    rows.sort((a,b)=> (b.date+((b.time)||'')).localeCompare(a.date+((a.time)||'')));
    body.innerHTML = rows.slice(0,50).map(m=>`
      <tr>
        <td>${escapeHtml(m.date||'')}${m.time?' '+escapeHtml(m.time):''}</td>
        <td>${escapeHtml(m.productName||m.code||'')}</td>
        <td><span class="pill ${m.type==='Quotation Stock Out'?'orange':(m.type==='Quotation Stock Out Reversal'?'green':'gray')}">${escapeHtml(m.type||'')}</span></td>
        <td class="num">${(Number(m.quantityChanged)||0).toLocaleString()}</td>
        <td class="num">${(Number(m.previousQuantity)||0).toLocaleString()}</td>
        <td class="num">${(Number(m.newQuantity)||0).toLocaleString()}</td>
        <td>${escapeHtml(m.quotationNumber||'—')}</td>
        <td>${escapeHtml(m.client||'—')}</td>
        <td>${escapeHtml(m.remarks||'')}</td>
      </tr>
    `).join('') || `<tr><td colspan="9"><div class="empty-state">No stock movements yet.</div></td></tr>`;
  }

  function renderInventoryRows(container){
    const body = E.qs('#i-body', container);
    body.innerHTML = state.products.map(p=>{
      const inv = state.inventory[p.code] || (state.inventory[p.code] = {code:p.code,beginningStock:0,stockIn:0,returns:0,stockOut:0,reserved:0,damaged:0,reorderLevel:100,movements:[]});
      const avail = availableStock(inv);
      const status = stockStatus(inv);
      const unitCost = E.productCostPerPiece(p);
      return `<tr data-code="${escapeHtml(p.code)}">
        <td><b>${escapeHtml(p.code)}</b></td>
        <td>${escapeHtml(p.name)}</td>
        <td class="num"><input class="v-begin" type="number" value="${inv.beginningStock}" style="width:70px;"></td>
        <td class="num"><input class="v-in" type="number" value="${inv.stockIn}" style="width:70px;"></td>
        <td class="num"><input class="v-returns" type="number" value="${inv.returns||0}" style="width:70px;"></td>
        <td class="num"><input class="v-out" type="number" value="${inv.stockOut}" style="width:70px;"></td>
        <td class="num"><input class="v-reserved" type="number" value="${inv.reserved}" style="width:70px;"></td>
        <td class="num"><input class="v-damaged" type="number" value="${inv.damaged}" style="width:70px;"></td>
        <td class="num v-avail">${avail}</td>
        <td class="num"><input class="v-reorder" type="number" value="${inv.reorderLevel}" style="width:70px;"></td>
        <td class="num">${peso(unitCost)}</td>
        <td class="num v-value">${peso(avail*unitCost)}</td>
        <td><span class="pill ${stockPill(status)} v-status">${status}</span></td>
      </tr>`;
    }).join('') || `<tr><td colspan="13"><div class="empty-state">Add products in Product Costing first.</div></td></tr>`;

    body.querySelectorAll('tr').forEach(tr=>{
      const code = tr.dataset.code;
      const inv = state.inventory[code];
      const p = state.products.find(x=>x.code===code);
      const map = {'v-begin':'beginningStock','v-in':'stockIn','v-returns':'returns','v-out':'stockOut','v-reserved':'reserved','v-damaged':'damaged','v-reorder':'reorderLevel'};
      Object.keys(map).forEach(cls=>{
        const el = tr.querySelector('.'+cls);
        el.addEventListener('input', ()=>{
          inv[map[cls]] = parseFloat(el.value)||0;
          const avail = availableStock(inv);
          const status = stockStatus(inv);
          const unitCost = E.productCostPerPiece(p);
          tr.querySelector('.v-avail').textContent = avail;
          tr.querySelector('.v-value').textContent = peso(avail*unitCost);
          const pill = tr.querySelector('.v-status');
          pill.textContent = status;
          pill.className = 'pill '+stockPill(status)+' v-status';
          E.debounceSave('inventory:'+code, ()=> E.storageSet('inventory:'+code, inv));
        });
        el.addEventListener('blur', ()=> E.flushSave('inventory:'+code));
      });
    });
  }

  /* ---------------- EXPENSES ---------------- */
  function renderExpenses(container){
    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">Operations</p><h2>Expenses</h2></div>
        <div class="actions"><button class="btn primary" id="e-add-btn">+ Add Expense</button></div>
      </div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin-top:-10px;">These totals reduce Net Income on the Dashboard, separate from Cost of Goods Sold. Each expense also creates a matching entry in the Finance Dashboard's cash ledger.</p>
      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Payee</th><th class="num">Amount</th><th>Method</th><th>Paid From</th><th></th></tr></thead>
            <tbody id="e-body"></tbody>
          </table>
        </div>
      </div>
    `;
    renderExpenseRows(container);
    E.qs('#e-add-btn', container).addEventListener('click', async ()=>{
      const account = state.settings.cashAccounts[0]||'Cash on Hand';
      const exp = {id: uid('exp'), date: todayISO(), category: state.settings.expenseCategories[0]||'', description:'', payee:'', amount:0, method: state.settings.paymentMethods[0]||'', account};
      state.expenses.unshift(exp);
      await E.storageSet('expense:'+exp.id, exp);
      const ledgerEntry = await E.createLedgerEntry({
        date: exp.date, transactionType:'Expense', source:'Expenses', clientOrSupplier: exp.payee,
        account, cashIn:0, cashOut: exp.amount, remarks: exp.description || 'Expense entry'
      });
      exp.ledgerEntryId = ledgerEntry.id;
      await E.storageSet('expense:'+exp.id, exp);
      renderExpenseRows(container);
    });
  }

  function syncExpenseLedgerEntry(exp){
    const entry = state.cashLedger.find(e=>e.id===exp.ledgerEntryId);
    if(!entry) return;
    E.updateLedgerEntry(entry, {
      date: exp.date, account: exp.account, cashOut: Number(exp.amount)||0,
      clientOrSupplier: exp.payee, remarks: exp.description || 'Expense entry'
    });
  }

  function renderExpenseRows(container){
    const body = E.qs('#e-body', container);
    const total = state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
    body.innerHTML = (state.expenses.length ? state.expenses.map(e=>`
      <tr data-id="${e.id}">
        <td><input class="x-date" type="date" value="${e.date||''}"></td>
        <td><select class="x-cat">${state.settings.expenseCategories.map(c=>`<option ${c===e.category?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></td>
        <td><input class="x-desc" value="${escapeHtml(e.description)}" style="width:180px;"></td>
        <td><input class="x-payee" value="${escapeHtml(e.payee)}" style="width:130px;"></td>
        <td class="num"><input class="x-amount" type="number" step="0.01" value="${e.amount}" style="width:90px;text-align:right;"></td>
        <td><select class="x-method">${state.settings.paymentMethods.map(m=>`<option ${m===e.method?'selected':''}>${escapeHtml(m)}</option>`).join('')}</select></td>
        <td><select class="x-account">${state.settings.cashAccounts.map(a=>`<option ${a===e.account?'selected':''}>${escapeHtml(a)}</option>`).join('')}</select></td>
        <td><button class="row-del">✕</button></td>
      </tr>
    `).join('') : `<tr><td colspan="8"><div class="empty-state">No expenses recorded yet.</div></td></tr>`)
    + `<tr><td colspan="4" style="text-align:right;font-weight:700;">Total</td><td class="num" id="e-total" style="font-weight:800;">${peso(total)}</td><td colspan="3"></td></tr>`;

    body.querySelectorAll('tr[data-id]').forEach(tr=>{
      const exp = state.expenses.find(x=>x.id===tr.dataset.id);
      const map = {'x-date':'date','x-cat':'category','x-desc':'description','x-payee':'payee','x-amount':'amount','x-method':'method','x-account':'account'};
      Object.keys(map).forEach(cls=>{
        const el = tr.querySelector('.'+cls);
        const evt = (el.tagName==='SELECT'||el.type==='date') ? 'change' : 'input';
        el.addEventListener(evt, ()=>{
          exp[map[cls]] = (cls==='x-amount') ? (parseFloat(el.value)||0) : el.value;
          if(cls==='x-amount'){
            const totalCell = E.qs('#e-total', container);
            if(totalCell) totalCell.textContent = peso(state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0));
          }
          if(evt==='change'){ E.storageSet('expense:'+exp.id, exp); syncExpenseLedgerEntry(exp); }
          else E.debounceSave('expense:'+exp.id, ()=>{ E.storageSet('expense:'+exp.id, exp); syncExpenseLedgerEntry(exp); });
        });
        if(evt==='input') el.addEventListener('blur', ()=> E.flushSave('expense:'+exp.id));
      });
      tr.querySelector('.row-del').addEventListener('click', async ()=>{
        await E.flushSave('expense:'+exp.id);
        await E.storageDelete('expense:'+exp.id);
        state.expenses = state.expenses.filter(x=>x.id!==exp.id);
        if(exp.ledgerEntryId){
          state.cashLedger = state.cashLedger.filter(e=>e.id!==exp.ledgerEntryId);
          await E.storageDelete('cashledger:'+exp.ledgerEntryId);
        }
        renderExpenseRows(container);
        toast('Expense deleted');
      });
    });
  }

  E.renderInventory = renderInventory;
  E.computeInventorySummary = computeInventorySummary;
  E.availableStock = availableStock;
  E.stockStatus = stockStatus;
  E.recordInventoryMovement = recordInventoryMovement;
  E.applyInventoryDeduction = applyInventoryDeduction;
  E.reverseInventoryDeduction = reverseInventoryDeduction;
  E.renderExpenses = renderExpenses;
})();
</script>

<script>
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, escapeHtml, toast } = E;

  const LIST_FIELDS = [
    ['categories','Product Categories'],
    ['units','Units'],
    ['quotationStatuses','Quotation Statuses'],
    ['orderStatuses','Order Statuses'],
    ['paymentMethods','Payment Methods'],
    ['salespersons','Salespersons'],
    ['expenseCategories','Expense Categories'],
    ['suppliers','Suppliers'],
    ['cashAccounts','Cash Accounts'],
  ];

  function renderSettings(container){
    container.innerHTML = `
      <div class="topbar">
        <div class="titleblock"><p class="eyebrow">System</p><h2>Settings</h2></div>
      </div>
      <div class="card">
        <h3>Key Assumptions</h3>
        <div class="grid cols-2">
          <div class="field"><label>Down Payment Percentage</label><input id="s-dp" type="number" min="0" max="100" value="${state.settings.downPaymentPct}"></div>
          <div class="field"><label>Default Tax / VAT Rate (%)</label><input id="s-tax" type="number" min="0" max="100" value="${state.settings.taxRate}"></div>
        </div>
      </div>
      ${LIST_FIELDS.map(([key,label])=>`
        <div class="card">
          <h3>${label}</h3>
          <div class="tag-list" id="list-${key}"></div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <input id="add-${key}" placeholder="Add new ${label.toLowerCase().replace(/s$/,'')}…" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;">
            <button class="btn small" data-add="${key}">Add</button>
          </div>
        </div>
      `).join('')}
    `;
    LIST_FIELDS.forEach(([key])=> renderTagList(container, key));

    const dpEl = E.qs('#s-dp', container);
    dpEl.addEventListener('input', e=>{
      state.settings.downPaymentPct = parseFloat(e.target.value)||0;
      E.debounceSave('settings:main', ()=> E.storageSet('settings:main', state.settings));
    });
    dpEl.addEventListener('blur', ()=> E.flushSave('settings:main'));
    const taxEl = E.qs('#s-tax', container);
    taxEl.addEventListener('input', e=>{
      state.settings.taxRate = parseFloat(e.target.value)||0;
      E.debounceSave('settings:main', ()=> E.storageSet('settings:main', state.settings));
    });
    taxEl.addEventListener('blur', ()=> E.flushSave('settings:main'));
    LIST_FIELDS.forEach(([key])=>{
      const btn = container.querySelector(`[data-add="${key}"]`);
      const input = E.qs('#add-'+key, container);
      const submit = async ()=>{
        const val = input.value.trim();
        if(!val) return;
        if(state.settings[key].includes(val)){ toast('Already in the list'); return; }
        state.settings[key].push(val);
        await E.storageSet('settings:main', state.settings);
        input.value = '';
        renderTagList(container, key);
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    });
  }

  function renderTagList(container, key){
    const wrap = E.qs('#list-'+key, container);
    wrap.innerHTML = state.settings[key].map((v,i)=>`
      <span class="tag-chip">${escapeHtml(v)}<button data-remove="${key}" data-idx="${i}">✕</button></span>
    `).join('') || `<span style="color:var(--ink-soft);font-size:12px;">Empty — add one below.</span>`;
    wrap.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const k = btn.dataset.remove, idx = parseInt(btn.dataset.idx,10);
        state.settings[k].splice(idx,1);
        await E.storageSet('settings:main', state.settings);
        renderTagList(container, k);
      });
    });
  }

  E.renderSettings = renderSettings;
})();
</script>

<script>
/* =====================================================================
   SUPPLIER PAYABLES — core engine
   Hooks into Quotation save/delete. Never a separate source of truth:
   every payable is derived from + linked to a quotation line item.
===================================================================== */
(function(){
  "use strict";
  const E = window.__ecohub;
  const { state, uid, todayISO, peso, toast } = E;

  function todayIso(){ return todayISO(); }

  // Uniqueness rule per spec: Quotation Number + Quotation Item ID + Product Code
  function payableKey(quotationNumber, itemId, productCode){ return quotationNumber+'::'+itemId+'::'+(productCode||''); }

  function nextTempProductCode(){
    let n = 1;
    let code = 'NEW-'+String(n).padStart(4,'0');
    while(state.products.some(p=>p.code===code)){ n++; code = 'NEW-'+String(n).padStart(4,'0'); }
    return code;
  }

  /* ---------------- supplier credit profiles ---------------- */
  function blankSupplierProfile(name){
    return {
      name, contactPerson:'', contactNumber:'', defaultPaymentTerm:'25 Days', defaultPaymentTermDays:25,
      creditLimit:0, enforceCreditLimit:false, status:'Active', remarks:''
    };
  }
  function getSupplierProfile(name){
    return state.supplierProfiles.find(p=>p.name===name) || blankSupplierProfile(name);
  }
  async function saveSupplierProfile(profile){
    const idx = state.supplierProfiles.findIndex(p=>p.name===profile.name);
    if(idx>=0) state.supplierProfiles[idx]=profile; else state.supplierProfiles.push(profile);
    await E.storageSet('supplierprofile:'+E.sanitizeKeyPart(profile.name), profile);
  }
  function supplierOutstandingBalance(name){
    return state.payables.filter(p=>!p.cancelled && !p.archived && !p.historicalSettled && p.supplierName===name).reduce((s,p)=>s+(Number(p.remainingBalance)||0),0);
  }
  function supplierAvailableCredit(name){
    const profile = getSupplierProfile(name);
    return (Number(profile.creditLimit)||0) - supplierOutstandingBalance(name);
  }

  function calcDueDate(orderedDateISO, term, customDays){
    if(!orderedDateISO) return '';
    const days = term==='Custom Terms' ? (Number(customDays)||0) : (E.paymentTermDefaultDays(term)||0);
    return E.addDays(orderedDateISO, days);
  }

  function pushPayableAudit(pay, note){
    if(!Array.isArray(pay.history)) pay.history = [];
    pay.history.unshift({ date: todayIso(), qty: pay.qtyToPurchase, cost: pay.supplierUnitCost, total: pay.totalSupplierCost, note });
  }

  // Starts the agreed supplier credit term. A quotation can create a projected/actual purchase
  // requirement earlier, but the due-date countdown only begins when EcoHub actually places or
  // finalizes the order with the supplier.
  function finalizeSupplierOrder(pay, orderDate){
    if(!pay) return pay;
    const date = orderDate || todayIso();
    pay.dateOrderedFromSupplier = date;
    pay.purchaseStage = 'Ordered from Supplier';
    if(!pay.paymentTerm) pay.paymentTerm = '25 Days';
    const mapped = E.paymentTermDefaultDays(pay.paymentTerm);
    if(mapped!==null) pay.paymentTermDays = mapped;
    else if(pay.paymentTermDays===undefined || pay.paymentTermDays===null) pay.paymentTermDays = 25;
    pay.paymentDueDate = calcDueDate(date, pay.paymentTerm, pay.paymentTermDays);
    pushPayableAudit(pay, `Supplier order finalized — ${pay.paymentTerm} from ${date}; due ${pay.paymentDueDate||'—'}`);
    recomputePayableTotals(pay);
    return pay;
  }

  /* ---------------- status + totals ---------------- */
  function recomputePayableStatus(pay){
    if(pay.cancelled) return 'Cancelled';
    const total = Number(pay.totalSupplierCost)||0;
    const paid = Number(pay.amountPaid)||0;
    const remaining = Math.max(0, total - paid);
    if(total>0 && remaining<=0.004) return 'Fully Paid';

    const today = todayIso();
    const due = pay.paymentDueDate;
    const isOverdue = due && due < today && remaining>0;
    const isDueToday = due && due === today && remaining>0;
    const daysUntilDue = due ? Math.round((new Date(due+'T00:00:00') - new Date(today+'T00:00:00'))/86400000) : null;
    const isDueSoon = due && daysUntilDue!==null && daysUntilDue>0 && daysUntilDue<=7 && remaining>0;

    if(isOverdue) return 'Overdue';
    if(isDueToday) return 'Due Today';
    if(paid>0 && remaining>0) return 'Partially Paid';
    if(isDueSoon) return 'Due Soon';
    if(pay.dateOrderedFromSupplier) return 'Unpaid';
    return 'For Purchase';
  }

  function recomputePayableTotals(pay){
    if(!pay.fixedTotal){
      pay.totalSupplierCost = (Number(pay.qtyToPurchase)||0) * (Number(pay.supplierUnitCost)||0);
    }
    pay.remainingBalance = Math.max(0, pay.totalSupplierCost - (Number(pay.amountPaid)||0));
    pay.paymentStatus = recomputePayableStatus(pay);
    return pay;
  }

  /* =====================================================================
     INVENTORY-FIRST FULFILLMENT ENGINE
     Rule: use existing inventory ONLY when it can cover the entire quotation
     item quantity (all-or-nothing). If it can't, preserve inventory untouched
     and purchase the FULL requirement from the supplier (rounded up to whole
     boxes). Supplier payables are only ever created for the shortfall that
     inventory genuinely cannot cover — never as a default step.
  ===================================================================== */

  // Pure calculation — given a resolved qtyFromInventory/qtyToPurchase, work out the
  // box math and excess quantity for a supplier purchase.
  function computeBoxMath(qtyToPurchase, piecesPerBox){
    if(qtyToPurchase<=0) return { boxesToPurchase:0, supplierPurchaseQuantity:0, excessQuantity:0 };
    const pieces = Number(piecesPerBox)||0;
    if(pieces<=0) return { boxesToPurchase:0, supplierPurchaseQuantity:qtyToPurchase, excessQuantity:0 };
    const boxes = Math.ceil(qtyToPurchase/pieces);
    const purchaseQty = boxes*pieces;
    return { boxesToPurchase: boxes, supplierPurchaseQuantity: purchaseQty, excessQuantity: purchaseQty-qtyToPurchase };
  }

  // Decides how a single quotation line should be fulfilled, given its chosen
  // Fulfillment Source and the product's CURRENT available inventory.
  // `avail` must reflect inventory with this item's own prior deduction already
  // released (callers release-then-resolve so this function always sees the true balance).
  function resolveItemFulfillment(it, product, avail){
    const qty = Number(it.qty)||0;
    const chosen = it.fulfillmentSource || 'Automatic';
    const isDirectOrder = !!(product && product.directSupplierOrder);
    let resolvedSource, qtyFromInventory=0, qtyToPurchase=0, warning='';

    if(chosen==='Use Inventory'){
      if(avail>=qty){ resolvedSource='Inventory'; qtyFromInventory=qty; }
      else { resolvedSource='Blocked'; warning='Not enough inventory to fulfill this line entirely from stock — choose another Fulfillment Source or top up inventory.'; }
    } else if(chosen==='Order Entire Quantity from Supplier'){
      resolvedSource='Supplier'; qtyToPurchase=qty;
    } else if(chosen==='Mixed Fulfillment'){
      const mFromInv = Math.max(0, Math.min(Number(it.mixQtyInventory)||0, avail, qty));
      qtyFromInventory = mFromInv;
      qtyToPurchase = Math.max(0, qty-mFromInv);
      resolvedSource = qtyToPurchase>0 ? (qtyFromInventory>0 ? 'Mixed' : 'Supplier') : 'Inventory';
    } else {
      // Automatic — all-or-nothing rule
      if(isDirectOrder){
        resolvedSource='Supplier'; qtyToPurchase=qty;
      } else if(it._resolvedSource==='Supplier'){
        // Sticky: once a line has been assigned to the supplier, don't silently switch it back
        // to inventory just because stock arrived later — requires a manual Fulfillment Source change.
        resolvedSource='Supplier'; qtyToPurchase=qty;
        if(avail>=qty) warning='Enough inventory is now available for this item — switch Fulfillment Source to "Use Inventory" manually if you want to use it instead of the supplier order.';
      } else if(avail>=qty && qty>0){
        resolvedSource='Inventory'; qtyFromInventory=qty;
      } else if(qty>0){
        resolvedSource='Supplier'; qtyToPurchase=qty;
      } else {
        resolvedSource='';
      }
    }

    let inventoryStatus = '—';
    if(warning && resolvedSource==='Blocked') inventoryStatus='Insufficient Inventory';
    else if(qty>0 && qtyFromInventory>=qty) inventoryStatus='Fully Covered by Inventory';
    else if(qtyFromInventory>0 && qtyToPurchase>0) inventoryStatus='Mixed Fulfillment';
    else if(qtyToPurchase>0) inventoryStatus='Supplier Purchase Required';

    return { resolvedSource, qtyFromInventory, qtyToPurchase, warning, inventoryStatus, avail, qty };
  }

  // Non-committing preview used by the quotation editor UI to show live badges before Save.
  function previewItemFulfillment(it, product){
    const inv = state.inventory[product.code];
    const avail = inv ? Math.max(0, E.availableStock(inv)) : 0;
    // While previewing (not yet saved) we treat the item's own currently-deducted qty as
    // already released, matching what will happen for real at save time.
    const effectiveAvail = avail + (it._deductedCode===product.code ? (Number(it._deductedQty)||0) : 0);
    const r = resolveItemFulfillment(it, product, effectiveAvail);
    const piecesPerBox = Number(product.piecesPerBox)||0;
    const box = computeBoxMath(r.qtyToPurchase, piecesPerBox);
    return Object.assign({ piecesPerBox }, r, box, { avail: effectiveAvail });
  }

  // Releases whatever inventory a line item currently has deducted (if any). Called both by the
  // per-item reconciliation loop (which then re-deducts fresh) and directly when a line item is
  // removed from a quotation entirely (since a removed item can't be reconciled at save time).
  function releaseItemDeduction(q, it){
    if(it._deductedCode && (Number(it._deductedQty)||0)>0){
      const product = state.products.find(p=>p.code===it._deductedCode);
      E.reverseInventoryDeduction(it._deductedCode, Number(it._deductedQty)||0, q, product, 'Released — quotation line changed or removed');
    }
    it._deductedQty = 0; it._deductedCode = '';
  }

  // Called when a line item is deleted from the editor before the quotation is saved: releases
